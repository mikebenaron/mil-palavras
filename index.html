function showReading(p){
  var i = READINGS.findIndex ? READINGS.findIndex(function(r){ return r.id === p.id; }) : -1;
  if (i < 0) READINGS.push(p); else READINGS[i] = p;
  READMODE = "read";
  renderReading(p.id);
}

/* ------------------------- today's plan -------------------------
   Twelve tiles is a menu, not a route. This builds a short ordered list that
   fits the time budget, puts the spaced-repetition queue first because that's
   the part with a deadline, then pulls up whichever skill has gone longest
   without practice. It ends — "done for today" is the point, not a nudge to
   keep grazing. */
function dailyBudgetMins(){
  var m = S && S.set ? S.set.minutes : null;
  return (typeof m === "number" && m >= 5) ? m : 30;
}
var PLAN_SECS = { review:10, listen:18, speak:25, drill:8, read:300 };

function todayPlan(){
  var a = act(), budget = dailyBudgetMins() * 60, used = 0, steps = [];
  function add(s){
    if (used + s.secs > budget && steps.length) return false;
    used += s.secs; steps.push(s); return true;
  }

  // 1. Anything the scheduler says is due, plus today's new intake.
  var due = dueList().length;
  var fresh = Math.min(newAllowance(), newPool().length);
  var reviewN = due + fresh;
  // Keep the step visible once it's been worked on, even though finishing it
  // empties the queue that generated it — a step that vanishes reads like a
  // glitch, where a ticked one reads like progress.
  if (reviewN > 0 || a.review > 0) {
    var doneReview = reviewN === 0 || a.review >= reviewN;
    add({ key:"review", nav:"review", pt:"Rever", en:"review",
          note: doneReview ? a.review + " feitas hoje" : due + " por rever" + (fresh ? " + " + fresh + " novas" : ""),
          noteE: doneReview ? a.review + " done today" : due + " due" + (fresh ? " + " + fresh + " new" : ""),
          count: reviewN, secs: Math.min(reviewN || a.review, 40) * PLAN_SECS.review,
          done: doneReview });
  }

  // 2. The neglected skill first — listening and speaking decay fastest and
  //    are the easiest to quietly skip.
  var wantListen = Recorded.ready();
  var wantSpeak = Pronounce.available();
  var order = [];
  if (wantListen) order.push({ k:"listen", since: sinceAct("listen") });
  if (wantSpeak) order.push({ k:"speak", since: sinceAct("speak") });
  order.sort(function(x, y){ return y.since - x.since; });

  order.forEach(function(o){
    if (o.k === "listen") {
      add({ key:"listen", nav:"listen", pt:"Ditado", en:"dictation",
            note: o.since > 2 ? "há " + (o.since > 90 ? "muito" : o.since + " dias") + " que não ouves" : "treina o ouvido",
            noteE: o.since > 2 ? (o.since > 90 ? "you haven't trained your ear yet" : "ear untrained for " + o.since + " days") : "trains your ear",
            count: 8, secs: 8 * PLAN_SECS.listen, done: a.listen >= 8 });
    } else {
      add({ key:"speak", nav:"speak", pt:"Falar", en:"speaking",
            note: o.since > 2 ? "há " + (o.since > 90 ? "muito" : o.since + " dias") + " que não falas" : "diz em voz alta",
            noteE: o.since > 2 ? (o.since > 90 ? "you haven't spoken yet" : "haven't spoken for " + o.since + " days") : "say it out loud",
            count: 6, secs: 6 * PLAN_SECS.speak, done: a.speak >= 6 });
    }
  });

  /* 3. A conversation, once there is enough vocabulary to hold one. Placed
     after listening and speaking because it needs a warm ear, and before the
     passage because producing is harder than receiving and deserves the
     better half of the budget. */
  if (conversaReady()) {
    add({ key:"conversa", nav:"conversa", pt:"Conversa", en:"conversation",
          note:"fala com alguém, só com as tuas palavras",
          noteE:"talk to someone, using only your own words",
          count:1, secs: 240, done: (a.conversa || 0) >= 1 });
  }

  /* 4. The day's own text, when there is one. This is the app's most
     personal feature — a passage written from the words the scheduler says
     you're about to forget — and it lived as a panel inside Leitura that
     announced itself to nobody. The plan is the one surface that always
     gets read, so it belongs here on the days it exists. */
  if (dailyReady()) {
    var haveDaily = !!dailyCached();
    add({ key:"daily", nav:"dailytext", pt:"O teu texto de hoje", en:"your text today",
          note: haveDaily ? "escrito a partir das tuas palavras" : "a partir de " + dailyWords().length + " palavras tuas",
          noteE: haveDaily ? "written from your own words" : "from " + dailyWords().length + " of your words",
          /* renderDailyText gives the passage the id "hoje-<day>" and pushes
             it through renderReading, which is what records the read mark. */
          count:1, secs: PLAN_SECS.read, done: !!(S.read && S.read["hoje-" + dayNo()]) });
  }

  // 5. One passage — where the words stop being a list and become language.
  if (READINGS.length) {
    add({ key:"read", nav:"leitura", pt:"Leitura", en:"reading",
          note:"um texto, do início ao fim", noteE:"one passage, start to finish",
          count:1, secs: PLAN_SECS.read, done: a.read >= 1 });
  }

  // 6. Spare time goes to recognition practice.
  add({ key:"drill", nav:"choice", pt:"Escolha", en:"multiple choice",
        note:"se ainda tiveres tempo", noteE:"if you still have time",
        count:15, secs: 15 * PLAN_SECS.drill, done: a.drill >= 15 });

  return { steps: steps, mins: Math.round(used / 60) };
}

function planHTML(){
  var plan = todayPlan(), steps = plan.steps;
  if (!steps.length) return "";
  var doneAll = steps.every(function(s){ return s.done; });
  var nextIdx = -1;
  for (var i = 0; i < steps.length; i++) if (!steps[i].done) { nextIdx = i; break; }

  var rows = steps.map(function(s, i){
    var cls = s.done ? "done" : (i === nextIdx ? "next" : "");
    return '<button class="planrow ' + cls + '" data-nav="' + s.nav + '">' +
      '<span class="pmark">' + (s.done ? "✓" : pad2(i + 1)) + '</span>' +
      '<span class="pbody"><span class="ppt">' + esc(s.pt) + '</span>' +
        '<span class="pen" lang="en">' + esc(s.en) + '</span>' +
        '<span class="pnote">' + esc(s.note) + ' · <span lang="en">' + esc(s.noteE) + '</span></span></span>' +
      '<span class="pmins">' + Math.max(1, Math.round(s.secs / 60)) + '′</span></button>';
  }).join("");

  return '<div class="plan">' +
    '<div class="planhd"><span>Hoje · today</span><span class="planbudget">' +
      (doneAll ? "feito · done" : "~" + plan.mins + " min") + '</span></div>' +
    rows +
    (doneAll
      ? '<div class="plandone">Já chega por hoje. Voltar amanhã vale mais do que continuar agora. · ' +
        '<span lang="en">That\'s enough for today. Coming back tomorrow is worth more than pushing on now.</span></div>'
      : '') +
  '</div>';
}

/* ============================ Hoje ============================
   The home screen answers one question: what do I do now. Everything else is
   below the decision, not above it. The old screen put a masthead, a word of
   the day, three KPIs, a five-row plan, two progress blocks and sixteen tiles
   in front of the answer — about five phone-screens of scroll to reach a
   verb. */
function themeCycleBtn(){
  var t = themeSetting();
  var lab = { light:"claro · light", dark:"escuro · dark", night:"noite · night", auto:"auto" }[t] || "auto";
  return '<button class="thcycle" data-thcycle="1" aria-label="Tema · theme">' +
    '<span class="thsw"></span><span class="thlab">' + lab + '</span></button>';
}

    panel =
      '<div class="hpanel">' +

        '</div>' +

            '<span class="hpse" lang="en">words</span></div>' +

            '<span class="hpse" lang="en">verbs</span></div>' +
          '<div class="hps"><span class="hpsn">' + sp.other + '</span><span class="hpsl">outras</span>' +
            '<span class="hpse" lang="en">other</span></div>' +
        '</div>' +
        lenPicker(true) +
        '<button class="hpcta" data-nav="review">' +
          '<span class="hpctapt">Começar</span>' +
          '<span class="hpctaen" lang="en">start · ' + pl.planned + ' cards</span></button>' +
      '</div>';
  } else {
    /* Nothing due: do not show a zero and do not invent work. */
    var nx = nextReturn();
    panel =
      '<div class="hpanel">' +
        '<div class="hplab">nada por rever · nothing due</div>' +

        '<button class="hpquiet" data-nav="choice">ou pratica · or practise anyway</button>' +
      '</div>';
  }

    ["leitura","Continuar a leitura","carry on reading",
      (S.readLast && READINGS.filter(function(r){ return r.id === S.readLast; })[0])
        ? READINGS.filter(function(r){ return r.id === S.readLast; })[0].title
        : READINGS.length + " textos por ler"],
    ["conversa","Conversa","conversation","só com palavras tuas"],
    ["browse","Dicionário","dictionary", CARDS.length + " cartões"],
  ].map(function(r){
    return '<button class="hnrow" data-nav="' + r[0] + '">' +
      '<span class="hnb"><span class="hnpt">' + esc(r[1]) + '<span class="hngloss" lang="en">' + esc(r[2]) + '</span></span>' +
      '<span class="hnd">' + esc(r[3]) + '</span></span><span class="hnar">\u2192</span></button>';
  }).join("");

  h(
    '<div class="hhead">' +
      '<div class="hbrand">Mil Palavras</div>' +
      '<div class="hhr"><span class="hday">dia ' + day + '</span>' + themeCycleBtn() + '</div>' +

    '<div class="hnext">' + nextRows + '</div>' +

/* Seven columns, recomputed from card state every render — grading a card
   Fácil has to visibly move it out of today\u2019s bar into a later one. */
function forecastChart(){
  var fc = dueForecast(7), mx = Math.max(1, Math.max.apply(null, fc));
  return '<div class="fchart">' + fc.map(function(count, i){
    var hpx = Math.max(2, Math.round(count / mx * 44));
    return '<div class="fcol"><div class="fcn' + (i === 0 ? " today" : "") + '">' + count + '</div>' +
      '<div class="fcwrap"><span class="fcb' + (i === 0 ? " today" : "") + '" style="height:' + hpx + 'px"></span></div>' +
      '<div class="fcd">' + esc(forecastLabel(i)) + '</div></div>';
  }).join("") + '</div>';
}

    {n:"13",p:"Leitura",e:"reading",nav:"leitura",tail:String(READINGS.length)},
    {n:"14",p:"Memória",e:"your memory",nav:"memoria",tail:""},
    {n:"15",p:"Método",e:"method",nav:"method",tail:""},
    {n:"16",p:"Definições",e:"settings",nav:"settings",tail:""}

        ? '<div class="wodhead-w answer">'+esc(c.e)+'</div><div class="wodhead-ipa">'+esc(pt)+(c.ipa?' · '+esc(c.ipa):'')+'</div>'

    '</button>';

  h(
    '<div class="masthead"><div class="wordmark">Mil Palavras</div>'+
      '<div class="caderno">caderno · notebook · dia '+day+'</div>'+
      wodHead +
    '</div>'+

    '<div class="kpis">'+
      '<div class="kpi terra"><div class="n">'+due+'</div><div class="lp">por rever</div><div class="le">due for review</div></div>'+
      '<div class="kpi teal"><div class="n">'+(S.streak||0)+'</div><div class="lp">dias seguidos</div><div class="le">day streak</div></div>'+

/* Shared word-of-the-day flip: tap toggles the meaning, no rotation. */
function bindHero(c){
  var hero = document.getElementById("hero");
  if (!hero) return;
  hero.addEventListener("click", function(){
    heroFlipped = !heroFlipped;
    renderHome();
    if (heroFlipped) autoSay(c.p);
  });
}

/* ---- web home: the two-column dashboard ---- */
function homeCounts(){
  var totC = {}, startC = {};
  for (var i=0;i<CARDS.length;i++){ var k = CARDS[i].c;
    totC[k] = (totC[k]||0)+1; if (S.prog[CARDS[i].i]) startC[k]=(startC[k]||0)+1; }
  var vocabDue=0, verbDue=0, gramDue=0, due = dueList();
  for (var j=0;j<due.length;j++){ var cc = due[j].c;
    if (cc==="conjugacao") verbDue++; else if (cc==="gramatica") gramDue++; else vocabDue++; }
  return { totC:totC, startC:startC, vocabDue:vocabDue, verbDue:verbDue, gramDue:gramDue, dueN:due.length };
}

/* Render a navigable "page" screen, responsive: web shell (rail) or phone
   (back link). Remembers itself so a breakpoint change re-renders it. */
var LAST_RENDER = null;
function renderPage(activeNav, inner, self, backNav, backLabel){
  var web = window.innerWidth >= 760;
  /* Pass backNav through untouched — "|| home" here defeated the whole nav
     stack, because every screen that doesn't name a destination wants the
     stack's answer, not a hard-coded trip to the top. */
  h(web ? webShell(activeNav, inner) : backLink(backNav, backLabel) + inner);
  if (web) app.classList.add("web");
  app.setAttribute("data-screen", "page");
  LAST_RENDER = self || null;
}

  var mins = Math.max(1, Math.round(k.dueN * 0.5));

    var d = e.currentTarget.getAttribute("data-deck"), pool, rnd = false;
    var size = mode === "flash" ? 40 : mode === "type" || mode === "choice" ? 30 : 25;
    /* "Mistura equilibrada" is stratified; everything else is a plain filter.
       These two used to start from an identical CARDS.slice() and differ only
       in how they were sliced afterwards — which made "Tudo" behave like a
       beginner vocabulary set (the first 60 of CARDS are all words) and
       "aleatória" behave like a conjugation firehose. Each is now its own
       query, and the rows say which is which. */
    if (d === "__random") { pool = mixedPool(size); rnd = true; }
    else if (d === "__all") pool = CARDS.filter(function(c){ return !tenseBlocked(c); });
    else if (d === "__started") pool = CARDS.filter(function(c){ return S.prog[c.i] && !tenseBlocked(c); });
    else if (d === "__weak") pool = CARDS.filter(function(c){ return (S.prog[c.i]||{}).l >= 3 && !tenseBlocked(c); });
    else pool = CARDS.filter(function(c){ return c.c === d; });

    // to write down what the device voice guessed at.
    if (mode === "listen" || mode === "speak") pool = pool.filter(function(c){ return !!Recorded.srcFor(c.p); });
    /* Selection is by frequency — the deck is ordered by usefulness, so the
       top of a set is the part worth learning first. Presentation is then
       shuffled, because deck order inside a class is also semantic order:
       the números set arrived dois, três, quatro… and the months January to
       December, which makes the answer guessable from position alone. */
    if (rnd) pool = pool.slice(0, size);          // already stratified and shuffled
    else if (d === "__all") pool = shuffle(pool.slice()).slice(0, size);
    else if (mode === "type" || mode === "choice") pool = shuffle(pool.slice()).slice(0, 30);
    /* Draw from the WHOLE set, not its first 60. Slicing before the shuffle
       meant a class of 500 nouns only ever served the same opening 60, so the
       rest of the deck was unreachable from Cartões however long you used it.
       Frequency order is what newPool() is for; picking a set by hand is a
       different act. */
    else pool = shuffle(pool.slice()).slice(0, 60);
    if (!pool.length) { toast("Ainda nada neste conjunto · nothing in that set yet"); return; }
    startSession(mode, pool);
  });

/* A representative sample of the whole app. A uniform draw over CARDS is 91%
   conjugation — 14,819 verb cells against 1,105 words — so "random" served a
   wall of verb tables and almost no vocabulary. This uses the same 3 words :
   1 conjugation : 1 grammar ratio newPool() uses for the daily intake, so the
   mix you can ask for is the mix the app already gives you unasked.
   Switched-off tense rungs are excluded: "off" is meant to be global. */
function mixedPool(n){
  var w = [], j = [], g = [];
  for (var i = 0; i < CARDS.length; i++) {
    var c = CARDS[i];
    if (tenseBlocked(c)) continue;
    if (c.c === "conjugacao") j.push(c);
    else if (c.c === "gramatica") g.push(c);
    else w.push(c);
  }
  shuffle(w); shuffle(j); shuffle(g);
  var out = [], iw = 0, ij = 0, ig = 0;
  while (out.length < n && (iw < w.length || ij < j.length || ig < g.length)) {
    for (var k = 0; k < 3 && iw < w.length && out.length < n; k++) out.push(w[iw++]);
    if (ij < j.length && out.length < n) out.push(j[ij++]);
    if (ig < g.length && out.length < n) out.push(g[ig++]);
  }
  return shuffle(out);
}
function genderPool(){
  var p = CARDS.filter(function(c){ return c.c === "substantivo" && (c.g === "o" || c.g === "a"); });
  return shuffle(p).slice(0, 25);
}

/* The words you keep forgetting, worst first — regardless of when they're due.
   Grading here feeds the same scheduler, so a word you finally master ages out
   of the list once its interval passes 21 days. */
function startTrouble(){
  rollDay();
  var q = troubleList();
  if (!q.length){ toast("Sem palavras difíceis · no trouble words"); return renderHome(); }
  var tcap = sesLen();
  if (tcap > 0 && q.length > tcap) q = q.slice(0, tcap);
  startSession("review", q);
}
function startReview(){
  rollDay();
  var due = shuffle(dueList());
  /* newPool() is frequency-ordered, which is right for *which* words arrive
     and wrong for the order they arrive in — consecutive ids meant the day's
     new words came out as a run of numbers or a run of months. */
  var fresh = shuffle(newPool().slice(0, newAllowance()));
  if (!due.length && !fresh.length) return renderEmpty();
  /* Honour the chosen session length. Hoje's numeral, its "10 dos 23" line
     and the CTA all promise this number — the queue has to match, or the
     panel is lying about what pressing Começar does. */
  var cap = sesLen();
  // interleave: spread the new cards evenly through the due pile
  var q = due.slice();
  if (fresh.length) {
    if (!q.length) q = fresh.slice();
    else {
      var step = Math.max(1, Math.floor(q.length / fresh.length));
      for (var i = 0; i < fresh.length; i++) {
        var at = Math.min(q.length, i * (step + 1) + 1);
        q.splice(at, 0, fresh[i]);
      }
    }
  }
  if (cap > 0 && q.length > cap) q = q.slice(0, cap);
  startSession("review", q);
}

/* ============================ session runner ============================ */
var SES = null;

/* Leaving an exercise used to throw the session away, so coming back started
   you at card one — after twenty cards, that is the whole session gone. The
   queue is just card ids, an index and some tallies, so it costs almost
   nothing to keep, and persisting it means an iOS restart doesn't lose it
   either. Only today's session is ever restored: a half-finished queue from
   last week is stale, because the scheduler has moved on since. */
function sesSnapshot(){
  if (!SES || !SES.q || SES.i >= SES.q.length) return null;
  return {
    day: dayNo(), mode: SES.mode,
    ids: SES.q.map(function(c){ return c.i; }),
    i: SES.i, total: SES.total, right: SES.right || 0, near: SES.near || 0,
    wrong: SES.wrong || 0, done: SES.done || 0, dir: SES.dir_locked || null,
    missed: (SES.missed || []).map(function(c){ return c.i; }),
  };
}
function sesRemember(){
  if (!S) return;
  if (!S.ui) S.ui = {};
  var snap = sesSnapshot();
  if (snap) S.ui.ses = snap; else delete S.ui.ses;
}
function sesSaved(){
  var v = S && S.ui && S.ui.ses;
  return (v && v.day === dayNo() && v.ids && v.i < v.ids.length) ? v : null;
}
function sesResume(){
  var v = sesSaved();
  if (!v) return false;
  var q = v.ids.map(function(id){ return BY_ID[id]; }).filter(Boolean);
  if (!q.length || v.i >= q.length) return false;
  SES = { mode:v.mode, q:q, i:v.i, total:v.total || q.length, right:v.right, near:v.near,
          wrong:v.wrong, done:v.done, shown:false, answered:false, score:null,
          dir_locked:v.dir || undefined,
          missed:(v.missed || []).map(function(id){ return BY_ID[id]; }).filter(Boolean) };

}
function sesDiscard(){ SES = null; if (S && S.ui) delete S.ui.ses; }
function startSession(mode, queue){

}

  var front, back, frontIsPt, backIsPt;
  if (isDrill) { front = c.q; back = c.p; frontIsPt = false; backIsPt = true; }
  else if (dir === "pt") { front = ptText; back = c.e; frontIsPt = true; backIsPt = false; }
  else { front = c.e; back = ptText; frontIsPt = false; backIsPt = true; }
  var isNew = !S.prog[c.i];
  var klass = isDrill ? c.s : CLASS_LABEL[c.c];
  var frontIpa = (frontIsPt && c.ipa) ? c.ipa : "";
  var backIpa = (backIsPt && c.ipa) ? c.ipa : "";

  var faceInner;
  if (isDrill && c.c === "conjugacao") {
    faceInner = conjPromptFace(c) +
      (SES.shown ? '<div class="hr"></div><div class="answer">' + esc(c.p) + '</div>'
                 : '<div class="tap-reveal">toque para conjugar · tap to conjugate</div>');
  } else {
    faceInner =
      '<div class="klass">' + esc(klass) + (isNew ? " · nova" : "") + '</div>' +
      '<div class="word">' + esc(front) + '</div>' +
      (frontIpa ? '<div class="ipa">' + esc(frontIpa) + '</div>' : '') +
      (isDrill && c.qs ? '<div class="ipa">' + esc(c.qs) + '</div>' : '') +
      (SES.shown
        ? '<div class="hr"></div><div class="answer">' + esc(back) + '</div>' +
          (backIpa ? '<div class="ipa">' + esc(backIpa) + '</div>' : '')
        : '<div class="tap-reveal">toque para revelar · tap to reveal</div>');
  }

  var notes = "";
  // renderFlip used to build its own copy of this block, so a change to
  // noteCards() silently missed the review and flashcard screens — the two
  // people actually use most. One source now.
  if (SES.shown) notes = noteCards(c, !isDrill);

  /* Order on the back is deliberate: the full sentence first, the English
     only after it. Meeting the word in use and then being told what it means
     is a different act from reading a translation and checking a sentence. */
  var cue = cueFor(c);
  var backBlocks = "";
  if (SES.shown && !isDrill) {
    backBlocks =
      (c.ex ? '<div class="sfsect"><span class="sfspt">no contexto</span>' +
          '<span class="sfsen" lang="en">in context</span></div>' +
          '<div class="ctxfull">' + esc(c.ex) + '</div>' : '') +
      '<div class="sfsect"><span class="sfspt">significa</span>' +
        '<span class="sfsen" lang="en">it means</span></div>' +
      '<div class="meansit">' + esc(c.e) + '</div>' +
      (c.exE ? '<div class="meanen" lang="en">' + esc(c.exE) + '</div>' : '') +
      familyBlock(c);
  }

  /* Review shows the scheduler's own four grades, with the real interval on
     each. Flashcards ask the simpler question — did you know it or not — and
     map the answer to Difícil / Bom. Two buttons rather than four because
     flipping through a deck is a coarser act than a considered self-grade,
     and the same rule as every other practice mode applies: never Fácil.

     Both of these buttons used to be the same button. They shared one
     data-adv handler that advanced the card and recorded nothing at all —
     no grade, no lapse, no session tally, no plan tick — so a deck flipped
     through in Cartões left the scheduler exactly as it found it, while the
     labels implied you were telling it something. */
  var grades = SES.mode === "review"
    ? '<div class="grades">' +
        gbtn(1,"Outra","again",c.i) + gbtn(2,"Difícil","hard",c.i) +
        gbtn(3,"Bom","good",c.i) + gbtn(4,"Fácil","easy",c.i) + '</div>'
    : '<div class="grades" style="grid-template-columns:1fr 1fr">' +
        '<button class="grade again" data-adv="no"><span class="gl">Ainda aprendo</span>' +
          '<span class="gi">' + (S.prog[c.i] ? previewIv(c.i, 1) : "still learning") + '</span></button>' +
        '<button class="grade good" data-adv="yes"><span class="gl">Já sei</span>' +
          '<span class="gi">' + (S.prog[c.i] ? previewIv(c.i, 3) : "got it") + '</span></button></div>';

  /* The cue card sits on the front under the word, so the sentence is the
     first thing after the word itself — not the translation. */
  var cueCard = (!SES.shown && cue)
    ? '<div class="ctxcard"><div class="ctxlab">no contexto <span lang="en">in context</span></div>' +
      '<div class="ctxcue">' + cue + '</div></div>' : "";

  h(sessionHead() +
    '<button class="cardtap" id="cd">' +
      '<div class="cardface' + (SES.shown ? " fade-in" : "") + '">' + faceInner + '</div>' +
    '</button>' +
    cueCard +
    (SES.shown ? backBlocks : "") + notes +
    audioBar(c.p, SES.shown) +
    (SES.shown ? grades : '<button class="btn fill block" style="margin-top:18px" data-show="1">Mostrar resposta · show answer</button>'));

  var cd = document.getElementById("cd");
  function reveal(){ if (SES.shown) return; SES.shown = true; renderSession(); autoSay(c.p); }
  cd.addEventListener("click", reveal);
  on("[data-show]","click", reveal);
  bindSay();
  on("[data-rate]","click",function(e){
    S.set.rate = e.currentTarget.getAttribute("data-rate"); save(); renderSession();
  });
  on("[data-grade]","click",function(e){ applyGrade(c, +e.currentTarget.getAttribute("data-grade")); });
  on("[data-adv]","click",function(e){
    var knew = e.currentTarget.getAttribute("data-adv") === "yes";
    if (knew) SES.right++; else { SES.wrong++; markMissed(c); }
    SES.done++;
    /* "Ainda aprendo" is a self-report of not knowing it, so it maps to wrong,
       not near. Mapped to near it became grade 2, and FSRS grows stability on
       a hard-but-early review — pressing "still learning" on a 30-day card
       pushed it out to 32 days, which is the opposite of what the button
       says. Wrong brings it back to today, exactly as "Outra" does in Rever. */
    practiceGrade(c, knew ? "right" : "wrong");
    studyBeat(); save();
    SES.i++; SES.shown = false; renderSession();
  });
  bindEnd();
}
function gbtn(g, lab, cls, id){
  return '<button class="grade ' + cls + '" data-grade="' + g + '"><span class="gl">' + lab +
    '</span><span class="gi">' + previewIv(id, g) + '</span></button>';
}
/* small "ouvir · listen" audio trigger (caller decides when to show it) */
function sayLine(c){
  if (!canSpeak() || !speakable(c.p)) return "";
  return '<div style="text-align:center;margin-top:8px"><button class="txtbtn" data-say="' + esc(c.p) + '">' +
    '<svg width="12" height="12" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
    '<path d="M4 7.5h2.5L10 4.5v11L6.5 12.5H4z" fill="currentColor" stroke="none"/><path d="M13 7.4a3.6 3.6 0 010 5.2"/></svg>ouvir · listen</button></div>';
}
function markMissed(c){
  if (!SES.missed) SES.missed = [];
  if (!SES.missed.some(function(x){ return x.i === c.i; })) SES.missed.push(c);
}
function applyGrade(c, g){
  grade(c.i, g);
  studyBeat();
  if (g === 1) {
    SES.wrong++; markMissed(c);
    // Requeue a few cards later so it comes back inside this session. The
    // denominator has to grow with it, or the header counts past its own
    // total ("12 / 10") and the progress track overflows 100%.
    var at = Math.min(SES.q.length, SES.i + 1 + Math.floor(Math.random()*4) + 4);
    SES.q.splice(at, 0, c);
    SES.total++;
  } else { SES.right++; }
  SES.done++; SES.i++; SES.shown = false;
  renderSession();
}

/* Clear prompt for a conjugation card: verb + tense up top, pronoun as the cue.
   qs is "verb · tense · meaning"; s is "tense · regular|irregular". */
function conjPromptFace(c){
  var parts = (c.qs || "").split(" · ");
  var verb = parts[0] || c.v || "";
  var meaning = parts[2] || "";
  var t = TBY[c.tn];
  var tensePT = t ? (t.pt + " · " + t.en) : (parts[1] || "");
  return '<div class="klass">' + esc(tensePT) + '</div>' +
    '<div class="word" style="font-size:34px">' + esc(verb) + '</div>' +
    (meaning ? '<div class="conjmeaning">' + esc(meaning) + '</div>' : '') +
    '<div class="conjcue"><span class="cuelabel">conjuga para · conjugate for</span>' + esc(c.q) + '</div>';
}

/* reveal note + footnote cards (shared by review, choice, type, gender) */
/* noteCards is still the ONLY renderer of this block — see CLAUDE.md. The
   flag exists because the redesigned card back now shows the sentence and its
   translation itself, in the order it wants them (context, then meaning), so
   repeating them underneath would say the same thing twice. Everywhere else
   still gets both. */
function noteCards(c, notesOnly){
  var s = "";
  if (c.ex && !notesOnly) s += '<div class="note"><div class="nl">Numa frase · in a sentence' +
    // Hearing the sentence matters more than hearing the word: connected speech
    // is where the vowels vanish and the s turns to sh.
    (Recorded.srcFor(c.ex) ? sayBtn(c.ex, "inline") : "") + '</div><div class="np">' +
    esc(c.ex) + '</div>' + (c.exE ? '<div class="ne">' + esc(c.exE) + '</div>' : '') + '</div>';
  if (c.note) s += '<div class="footnote"><div class="np">' + esc(c.note) + '</div>' +
    (c.noteE ? '<div class="ne">' + esc(c.noteE) + '</div>' : '') + '</div>';
  return s;
}

/* ---- multiple choice ---- */
function renderChoice(head, c){
  if (!SES.opts) {
    if (c.k && c.x && c.x.length) {
      /* a drill carries its own distractors: the other cells of its table,
         or the other persons of the same verb — far more useful than random */
      var d = shuffle(c.x.filter(function(t){ return t !== c.p; })).slice(0,3).map(function(t, n){
        return { i:"x" + n, p:t, e:t, c:c.c, k:1 };
      });
      SES.opts = shuffle([c].concat(d));
    } else {
      /* Exclude by TEXT as well as by id. Six words exist as two cards with
         different word classes (a, se, melhor, pior, perto, longe), so an
         id-only filter could offer the same word as its own distractor —
         two identical buttons, one of them marked wrong. */
      var sameText = function(x){ return variants(x.p)[0] === variants(c.p)[0] || x.e === c.e; };
      var same = CARDS.filter(function(x){ return x.c === c.c && x.i !== c.i && !x.k && !sameText(x); });
      var pool = same.length >= 3 ? same : CARDS.filter(function(x){ return x.i !== c.i && !x.k && !sameText(x); });
      var d2 = shuffle(pool.slice()).slice(0,3);
      SES.opts = shuffle([c].concat(d2));
    }
  }
  var dir = SES.dir;
  var prompt = dir === "pt" ? variants(c.p)[0] : c.e;
  if (c.k) prompt = c.q;
  var opts = SES.opts.map(function(o){
    var txt = dir === "pt" ? o.e : variants(o.p)[0];
    var state = "";
    if (SES.answered) {
      /* Compare as strings throughout. Word cards carry numeric ids but drill
         cards carry "c|falar|pres|1", and the handler used to coerce the
         attribute with +, so every conjugation and grammar answer produced
         NaN: the pick never matched, the card was always scored wrong, and
         the option you actually chose was never highlighted. */
      if (String(o.i) === String(c.i)) state = " right";
      else if (String(o.i) === SES.chosen) state = " wrong";
      else state = " dim";
    }
    return '<button class="choice' + state + '" data-opt="' + o.i + '"' + (SES.answered ? " disabled" : "") + '>' +
      esc(txt) + '</button>';
  }).join("");

  var promptFace = (c.k && c.c === "conjugacao")
    ? conjPromptFace(c)
    : '<div class="klass">' + esc(c.k ? c.s : CLASS_LABEL[c.c]) + '</div>' +
      '<div class="word" style="font-size:40px">' + esc(prompt) + '</div>' +
      (c.k && c.qs ? '<div class="ipa">' + esc(c.qs) + '</div>' : '');
  h(head +
    '<div class="cardface" style="padding:18px 4px 6px">' + promptFace + '</div>' +
    '<div class="choices">' + opts + '</div>' +
    (SES.answered ? sayLine(c) + noteCards(c) : "") +
    (SES.answered ? '<button class="btn fill block" style="margin-top:20px" data-next="1">Seguinte · next</button>' : ''));

  on("[data-opt]","click",function(e){
    if (SES.answered) return;
    SES.chosen = e.currentTarget.getAttribute("data-opt");
    SES.answered = true;
    autoSay(c.p);
    var right = SES.chosen === String(c.i);
    if (right) SES.right++; else { SES.wrong++; markMissed(c); }
    SES.done++;
    practiceGrade(c, right ? "right" : "wrong");
    studyBeat(); save();
    renderSession();
  });
  on("[data-next]","click",function(){ nextQ(); });
  bindSay(); bindEnd();
}
function nextQ(){ SES.opts = null; SES.answered = false; SES.chosen = null; SES.i++; SES.shown = false; renderSession(); prefetchAhead(); }

/* Warm the next couple of clips so playback starts instantly instead of
   waiting on the network mid-session. */
/* Prepare what the session is about to need. This used to warm only the word,
   which is why the "Numa frase" example — the biggest clip on the card, and
   the one revealed a second later — was always fetched cold at the moment of
   the tap. The current card is decoded outright; the next two are merely
   fetched, so they cost bandwidth but not memory. */
function prefetchAhead(){
  if (!SES || !Recorded.warm) return;
  var here = SES.q[SES.i];
  if (here) {
    if (here.p) Recorded.warm(here.p);
    if (here.ex) Recorded.warm(here.ex);
  }
  /* Only one card ahead, and only after a beat, so the fetch never competes
     with the clip for the card that is on screen right now. */
  setTimeout(function(){
    var c = SES && SES.q[SES.i + 1];
    if (!c) return;
    if (c.p) Recorded.prefetch(c.p);
    if (c.ex) Recorded.prefetch(c.ex);
  }, 1200);
}

/* ---- type it ---- */
var ACCENTS = ["á","à","â","ã","ç","é","ê","í","ó","ô","õ","ú"];

/* Character-level diff between what was typed and what was wanted.
   "Não é bem" followed by the correct spelling leaves the learner to hunt for
   the discrepancy themselves — for conheço vs conheco vs cunheço that hunt is
   precisely the work the feedback should be doing. Answers are a few
   characters long, so the quadratic LCS costs nothing. */
function diffPair(got, want){
  var a = String(got), b = String(want), m = a.length, n = b.length, i, j;
  var L = [];
  for (i = 0; i <= m; i++) { L.push([]); for (j = 0; j <= n; j++) L[i].push(0); }
  for (i = m - 1; i >= 0; i--)
    for (j = n - 1; j >= 0; j--)
      L[i][j] = (a[i] === b[j]) ? L[i+1][j+1] + 1 : Math.max(L[i+1][j], L[i][j+1]);
  var outA = "", outB = "", bufA = "", bufB = "";
  function mark(s){ return '<b class="dx">' + esc(s) + '</b>'; }
  i = 0; j = 0;
  while (i < m && j < n) {
    if (a[i] === b[j]) {
      if (bufA) { outA += mark(bufA); bufA = ""; }
      if (bufB) { outB += mark(bufB); bufB = ""; }
      outA += esc(a[i]); outB += esc(b[j]); i++; j++;
    } else if (L[i+1][j] >= L[i][j+1]) bufA += a[i++];
    else bufB += b[j++];
  }
  bufA += a.slice(i); bufB += b.slice(j);
  if (bufA) outA += mark(bufA);
  if (bufB) outB += mark(bufB);
  return { got: outA, want: outB };
}
/* ---- speak (pronunciation assessment) ---- */
/* The live recogniser, if one is running. Module-scoped so navigating away
   can close the microphone rather than leaving it open behind you. */
var SPEAK_MIC = null;
/* Sticky so the panel stays open between attempts once you've opened it. */
var SPEAK_DIAG = false;
function renderSpeak(head, c){
  var r = SES.score;
  var pt = variants(c.p)[0];
  h(head +
    '<div class="cardface" style="padding:12px 4px 6px">' +
      '<div class="klass">diz em voz alta · say it out loud</div>' +
      '<div class="word" lang="pt-PT">' + esc(pt) + '</div>' +
      '<div class="ne" style="margin-top:6px">' + esc(c.e) + '</div>' +
      '<button class="btn quiet" style="margin-top:10px" data-say="' + esc(c.p) + '">Ouvir o modelo · hear it first</button>' +
    '</div>' +
    (r ? scoreBlock(r) :
      '<button class="bigrec" data-rec="1" aria-label="Record">' +
        '<svg width="34" height="34" viewBox="0 0 20 20" fill="currentColor">' +
        '<rect x="7" y="2.5" width="6" height="10" rx="3"/>' +
        '<path d="M4.5 9.5a5.5 5.5 0 0011 0" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>' +
        '<path d="M10 15v2.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>' +
      '</button>' +
      '<div class="pcap" id="recCap" style="text-align:center;margin-top:10px">' +
        'toca, espera pelo sinal, e diz tudo — incluindo o artigo · ' +
        'tap, wait for the go-ahead, then say the whole thing including the article</div>') +
    (r ? '<button class="btn outline block" style="margin-top:12px" data-again="1">Tentar outra vez · try again</button>' +
         '<button class="btn fill block" style="margin-top:10px" data-next="1">Seguinte · next</button>' : "") +
    // Diagnostics for the microphone problems — visible, not buried in a console
    // you can't open on a phone.
    '<details class="diag"' + (SPEAK_DIAG ? " open" : "") + '>' +
      '<summary>Diagnóstico · what the mic is doing</summary>' +
      '<pre id="speakLog">' + esc(Pronounce.logText() || "(nada ainda · nothing yet)") + '</pre>' +
      '<button class="btn quiet" data-diagcopy="1">Copiar · copy</button>' +
    '</details>');

  bindSay(); bindEnd();
  Pronounce.prepare();   // warm the mic while they read the word
  var dg = app.querySelector(".diag");
  if (dg) dg.addEventListener("toggle", function(){ SPEAK_DIAG = dg.open; });
  on("[data-diagcopy]","click",function(e){
    e.preventDefault();
    var t = document.createElement("textarea");
    t.value = Pronounce.logText(); document.body.appendChild(t); t.select();
    try { document.execCommand("copy"); toast("Copiado · copied"); }
    catch(err){ toast("Seleciona e copia · select and copy"); }
    t.remove();
  });
  on("[data-again]","click",function(){ SES.score = null; renderSession(); });
  on("[data-next]","click",function(){ SES.score = null; nextQ(); });
  /* Tap once to start, tap again to send. A safety stop fires after 20s so a
     forgotten recording can't run indefinitely. SPEAK_MIC is module-scoped so
     leaving the screen can shut the microphone off — see h(). */
  var micTimer = null;
  on("[data-rec]","click",function(e){
    var btn = e.currentTarget, cap = document.getElementById("recCap");

    if (SPEAK_MIC){                              // second tap — finish and score
      var h = SPEAK_MIC; SPEAK_MIC = null;
      clearTimeout(micTimer);
      btn.classList.remove("on"); btn.classList.add("warm");
      cap.textContent = "A avaliar… · scoring…";
      h.stop().then(function(res){
        SES.score = res;
        // Practice still counts toward the session tally; 70+ reads as a pass.
        // The scheduler hears the same verdict: saying a word badly is real
        // evidence that the memory is weaker than its due date claims.
        var band = res.overall >= 70 ? "right" : res.overall >= 50 ? "near" : "wrong";
        if (band === "right") SES.right++; else SES.wrong++;
        SES.done++;
        practiceGrade(c, band);
        studyBeat(); save();
        renderSession();
      }).catch(function(err){
        btn.classList.remove("warm");
        cap.textContent = speakError(err);
      });
      return;
    }

    btn.classList.add("warm");
    cap.textContent = "A preparar… espera · getting ready…";
    Pronounce.start(pt, function(heard){
      btn.classList.remove("warm"); btn.classList.add("on");
      cap.textContent = heard
        ? "A ouvir-te — toca para terminar · hearing you, tap to finish"
        : "Fala agora — toca para terminar · speak now, tap to finish";
    }).then(function(handle){
      SPEAK_MIC = handle;
      micTimer = setTimeout(function(){
        if (SPEAK_MIC && btn.isConnected) btn.click();   // don't record forever
      }, 20000);
    }).catch(function(err){
      btn.classList.remove("warm"); btn.classList.remove("on");
      cap.textContent = speakError(err);
    });
  });
}

/* The predictable failures deserve an answer, not a stack trace. */
function speakError(err){
  var m = String((err && err.message) || err || "");
  // Order matters: match the function's own words before any status code, and
  // never treat a generic wrapper as "not deployed" — that misled once already.
  if (/Speech not configured/i.test(m))
    return "Falta a chave no servidor. · The AZURE_SPEECH_KEY / AZURE_SPEECH_REGION secrets aren't set on the speech-token function.";
  if (/Azure refused/i.test(m))
    return "A Azure recusou a chave. · Azure rejected the key — check the secret matches your current Speech key and region.";
  if (/\[404\]|not found/i.test(m))
    return "A função speech-token não existe. · The speech-token function isn't deployed under that exact name.";
  if (/not signed in|\[401\]/i.test(m))
    return "Sessão expirada — inicia sessão outra vez. · Session expired, please sign in again.";
  if (/permission|NotAllowed|denied/i.test(m))
    return "Sem acesso ao microfone. · No microphone access — allow it in your browser settings.";
  if (/NotFound|no microphone|NotReadable/i.test(m))
    return "Não encontrei um microfone. · Couldn't find a microphone.";
  if (/didn't catch|NoMatch/i.test(m)) return "Não te ouvi — tenta outra vez. · Didn't catch that, try again.";
  return m || "Algo correu mal · something went wrong";
}
/* Coaching for the sounds English speakers actually get wrong in European
   Portuguese. Keyed on the phoneme Azure reports (IPA-ish), lower-cased. */
var SOUND_TIP = {
  "ʃ": "O <em>s</em> no fim de palavra é «sh», não «ss» — <em>livros</em> soa a «LEE-vrush».",
  "ʒ": "Este som é o <em>s</em> de <em>measure</em>, não um «j» inglês.",
  "ɨ": "Vogal quase muda — engole-a. <em>de repente</em> soa a «d'r'PENT».",
  "ɐ": "<em>a</em> fraco e curto, não o «ah» aberto do inglês.",
  "ɔ": "<em>o</em> aberto, como em <em>law</em> — não o «oh» fechado.",
  "ɛ": "<em>e</em> aberto, como em <em>bed</em>.",
  "õ": "Nasal — deixa o ar sair pelo nariz, sem fechar com «ng».",
  "ɐ̃": "Nasal — o ar sai pelo nariz, sem «ng» no fim.",
  "ʎ": "<em>lh</em> é um só som, como o <em>lli</em> de <em>million</em>.",
  "ɲ": "<em>nh</em> é um só som, como o <em>ni</em> de <em>onion</em>.",
  "ʁ": "<em>rr</em> vem da garganta, não da ponta da língua.",
  "ɾ": "<em>r</em> simples é um toque rápido da língua.",
  "l": "<em>l</em> no fim é escuro, quase «w» — mas nunca desaparece.",
  "u": "<em>o</em> átono no fim soa a «u»: <em>livro</em> = «LEE-vru»."
};
function tipFor(ph){
  if (!ph) return "";
  var k = String(ph).toLowerCase();
  if (SOUND_TIP[k]) return SOUND_TIP[k];
  for (var key in SOUND_TIP) if (k.indexOf(key) >= 0) return SOUND_TIP[key];
  return "";
}

/* Turns the raw assessment into something worth reading: what went wrong,
   where, and what to do about it. */
function feedbackFor(r){
  var missed = [], added = [], sounds = [];
  (r.words || []).forEach(function(w){
    var pa = w.PronunciationAssessment || {};
    if (pa.ErrorType === "Omission") { missed.push(w.Word); return; }
    if (pa.ErrorType === "Insertion") { added.push(w.Word); return; }
    var worst = null;
    (w.Phonemes || []).forEach(function(p){
      var s = (p.PronunciationAssessment || {}).AccuracyScore;
      if (typeof s === "number" && (!worst || s < worst.score)) worst = { ph:p.Phoneme, score:s };
    });
    if (worst && worst.score < 70) sounds.push({ word:w.Word, ph:worst.ph, score:Math.round(worst.score) });
  });
  sounds.sort(function(a,b){ return a.score - b.score; });

  var bits = [];
  if (missed.length)
    bits.push('<li><b>Faltou</b> · you didn\'t say: <em lang="pt-PT">' + missed.map(esc).join(", ") + '</em>' +
      ' — o artigo faz parte da palavra. · the article is part of the word.</li>');
  if (added.length)
    bits.push('<li><b>A mais</b> · extra word: <em lang="pt-PT">' + added.map(esc).join(", ") + '</em></li>');

  sounds.slice(0, 2).forEach(function(s){
    var tip = tipFor(s.ph);
    bits.push('<li>Em <em lang="pt-PT">' + esc(s.word) + '</em>, o som <b>' + esc(s.ph || "?") + '</b>' +
      ' ficou em ' + s.score + '. ' + (tip || "Ouve o modelo e repete devagar. · Hear the model and repeat it slowly.") + '</li>');
  });

  if (!bits.length){
    // Nothing specific went wrong — say what to work on next instead of nothing.
    if (!(r.words || []).length)
      // No detail came back; never congratulate a result we can't see inside.
      bits.push("<li>Sem detalhe para analisar desta vez. · No detail came back for this attempt — try again.</li>");
    else if ((r.overall || 0) < 60)
      bits.push("<li>A pontuação está baixa mas nenhum som se destacou — ouve o modelo e repete devagar. · " +
        "Score is low but no single sound stood out; hear the model and repeat it slowly.</li>");
    else if ((r.fluency || 0) < 70 && (r.words || []).length > 1)
      bits.push("<li>Os sons estão certos; falta ritmo. Tenta dizer tudo de uma vez, sem pausas. · " +
        "The sounds are right, it's the rhythm — try saying it in one flow.</li>");
    else
      bits.push("<li>Nada a corrigir — soou bem. · Nothing to fix, that sounded right.</li>");
  }
  return '<ul class="fbk">' + bits.join("") + '</ul>';
}

function scoreBand(n){
  if (n >= 85) return { k:"ok", pt:"Muito bem", en:"excellent" };
  if (n >= 70) return { k:"ok", pt:"Bem", en:"good" };
  if (n >= 55) return { k:"near", pt:"Quase", en:"close" };
  return { k:"no", pt:"Outra vez", en:"try again" };
}
function scoreBlock(r){
  var band = scoreBand(r.overall || 0);
  // Per-word colouring is the useful part: it says *where* it went wrong.
  var words = (r.words || []).map(function(w){
    var s = (w.PronunciationAssessment && w.PronunciationAssessment.AccuracyScore);
    if (typeof s !== "number") return '<span class="sw">' + esc(w.Word || "") + '</span>';
    var cls = s >= 80 ? "good" : (s >= 60 ? "mid" : "bad");
    return '<span class="sw ' + cls + '" title="' + Math.round(s) + '">' + esc(w.Word || "") + '</span>';
  }).join(" ");
  return '<div class="scorewrap">' +
    '<div class="scoren ' + band.k + '">' + Math.round(r.overall || 0) + '</div>' +
    '<div class="eyebrow ' + (band.k === "no" ? "" : "teal") + '" style="text-align:center">' +
      esc(band.pt) + ' · ' + esc(band.en) + '</div>' +
    (words ? '<div class="scorewords" lang="pt-PT">' + words + '</div>' : '') +
    feedbackFor(r) +
    '<div class="scorebars">' +
      scoreBar("Precisão", "accuracy", r.accuracy) +
      scoreBar("Fluência", "fluency", r.fluency) +
      scoreBar("Completo", "completeness", r.completeness) +
    '</div>' +
    (r.text ? '<div class="pcap" style="margin-top:12px">Ouvi · heard: “' + esc(r.text) + '”</div>' : '') +
  '</div>';
}
function scoreBar(pt, en, n){
  var v = Math.max(0, Math.min(100, Math.round(n || 0)));
  return '<div class="sbar"><div class="sbl">' + esc(pt) + ' <span lang="en">' + esc(en) + '</span>' +
    '<b>' + v + '</b></div><div class="sbt"><span style="width:' + v + '%"></span></div></div>';
}

/* Type-it in context: blank the target word out of its own example sentence
   instead of glossing it in English. Producing a word inside a sentence is far
   closer to what using the language actually demands than producing it from a
   translation prompt, and every card already carries a sentence — the only
   production exercise in the app used to be one isolated word at a time.
   Conservative on purpose: only an exact appearance of the headword is
   blanked. If a verb's example carries a conjugated form the sentence is left
   alone and the normal English prompt is used, rather than guessing at stems. */
function clozeFor(c){
  if (!c || c.k || !c.ex) return null;
  var bare = stripArticle(variants(c.p)[0]).replace(/-se$/, "").trim();
  if (bare.length < 3 || /\s/.test(bare)) return null;
  var re = new RegExp("(^|[^0-9A-Za-zÀ-ÿ])(" + escapeRe(bare) + ")([^0-9A-Za-zÀ-ÿ]|$)", "i");
  var m = re.exec(c.ex);
  if (!m) return null;
  return {
    form: m[2],
    html: esc(c.ex).replace(
      new RegExp("(^|[^0-9A-Za-zÀ-ÿ])(" + escapeRe(esc(bare)) + ")([^0-9A-Za-zÀ-ÿ]|$)", "i"),
      function(_, a, b, z){ return a + '<span class="clzgap">' + "\u00a0\u00a0\u00a0\u00a0" + '</span>' + z; })
  };
}
function renderType(head, c){
  var listening = SES.mode === "listen";
  var cloze = listening ? null : clozeFor(c);
  var accents = ACCENTS.map(function(a){ return '<button class="akey" data-acc="' + a + '">' + a + '</button>'; }).join("") +
    '<button class="akey" data-back="1" aria-label="backspace">⌫</button>';
  var v = SES.verdict;
  var vlabel = v ? (v.k === "ok" ? "Certo · correct" : v.k === "near" ? "Quase certo · almost" : "Não é bem · not quite") : "";
  var vwrong = v && v.k === "no";
  /* Show the answer, and when it wasn't exact, show it against what was
     actually typed with the differing characters marked. */
  var answerHTML;
  if (!v) answerHTML = "";
  else if (v.k === "ok")
    answerHTML = '<div class="np" style="font-family:var(--serif);font-size:22px;color:var(--ink)">' +
      esc(cloze ? cloze.form : c.p) + '</div>';
  else {
    /* In a cloze the article is already sitting in the sentence, so diffing
       against the full headword would mark it missing when it wasn't wanted. */
    var d = diffPair(SES.typed || "", cloze ? cloze.form : c.p);
    answerHTML =
      '<div class="dline"><span class="dlab">escreveste · you wrote</span>' +
        '<span class="dgot">' + d.got + '</span></div>' +
      '<div class="dline"><span class="dlab">certo · correct</span>' +
        '<span class="dwant">' + d.want + '</span></div>';
  }
  h(head +
    (listening
      // Dictation: the prompt is the sound. Showing the English would give the
      // answer away, so the ear is the only clue until it's been checked.
      ? '<div class="cardface" style="padding:12px 4px 6px">' +
          '<div class="klass">escreve o que ouves · write what you hear</div>' +
          '<button class="bigplay" data-replay="1" aria-label="Play again">' +
            '<svg width="34" height="34" viewBox="0 0 20 20" fill="none" stroke="currentColor" ' +
            'stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">' +
            '<path d="M4 7.5h2.5L10 4.5v11L6.5 12.5H4z" fill="currentColor" stroke="none"/>' +
            '<path d="M13 7.4a3.6 3.6 0 010 5.2"/><path d="M15.4 5a7 7 0 010 10"/></svg></button>' +
          '<div class="pcap" style="margin-top:10px">toca para ouvir outra vez · tap to hear it again</div>' +
        '</div>'
      : cloze
        // The sentence is the prompt; the English underneath is the clue.
        ? '<div class="cardface" style="padding:12px 4px 6px">' +
            '<div class="klass">completa a frase · complete the sentence</div>' +
            '<div class="clzline">' + cloze.html + '</div>' +
            '<div class="clzen">' + esc(c.exE || c.e) + '</div>' +
          '</div>'
        : '<div class="cardface" style="padding:12px 4px 6px">' +
            '<div class="klass">escreve em português · write it in portuguese</div>' +
            '<div class="typeprompt">' + esc(c.k ? c.q : c.e) + '</div>' +
            (c.k && c.qs ? '<div class="ipa" style="margin-top:-16px;margin-bottom:10px">' + esc(c.qs) + '</div>' : '') +
          '</div>') +
    '<input class="typeline" id="ans" autocapitalize="none" autocorrect="off" spellcheck="false" ' +
      'autocomplete="off" placeholder="…"' + (v ? " disabled" : "") + ' value="' + esc(SES.typed || "") + '">' +
    (v ? "" : '<div class="accents">' + accents + '</div>') +
    (v ? '<div class="explain"' + (vwrong ? ' style="box-shadow:inset 3px 0 0 var(--vinho)"' : '') + '>' +
        '<div class="eyebrow ' + (vwrong ? '' : 'teal') + '" style="margin-bottom:9px">' + vlabel + '</div>' +
        answerHTML +
        '<div class="ne">' + esc(c.e) + (c.ipa ? ' · ' + esc(c.ipa) : '') + '</div></div>' + noteCards(c) : "") +
    (v ? sayLine(c) : "") +
    (v ? '<button class="btn fill block" style="margin-top:20px" data-next="1">Seguinte · next</button>'
       : '<button class="btn fill block" style="margin-top:20px" data-check="1">Verificar · check</button>'));

  var input = document.getElementById("ans");
  if (!v) { input.focus(); }
  input.addEventListener("keydown", function(e){ if (e.key === "Enter") { e.preventDefault(); check(); } });

  if (listening){
    var playBtn = app.querySelector("[data-replay]");
    var say = function(){ Speech.speak(c.p, playBtn); };
    if (playBtn) playBtn.addEventListener("click", say);
    // Autoplay only before the answer is checked. renderSession runs inside the
    // tap that advanced the card, so iOS still counts this as user-initiated;
    // if it's ever blocked, the replay button is right there.
    if (!v) say();
  }
  on("[data-acc]","click",function(e){
    var a = e.currentTarget.getAttribute("data-acc");
    var s = input.selectionStart || input.value.length;
    input.value = input.value.slice(0,s) + a + input.value.slice(input.selectionEnd || s);
    input.focus(); input.setSelectionRange(s+1, s+1);
  });
  on("[data-back]","click",function(){
    var s = input.selectionStart, e2 = input.selectionEnd;
    if (s === e2 && s > 0) { input.value = input.value.slice(0, s-1) + input.value.slice(s); s--; }
    else if (s !== e2) { input.value = input.value.slice(0, s) + input.value.slice(e2); }
    input.focus(); input.setSelectionRange(s, s);
  });
  on("[data-check]","click",check);
  on("[data-next]","click",function(){ SES.verdict = null; SES.typed = ""; nextQ(); });
  bindSay(); bindEnd();

  function check(){
    var raw = input.value;
    if (!raw.trim()) return;
    SES.typed = raw;
    var accepted = c.a ? c.a.slice() : variants(c.p);
    accepted = accepted.concat(accepted.map(function(z){ return z.replace(/^-/, ""); }));
    /* In a cloze the gap is mid-sentence, so the article is already there in
       the text — the answer wanted is the bare form the sentence shows. */
    if (cloze) accepted.push(cloze.form);
    var exact = accepted.some(function(a){ return keepAccents(a) === keepAccents(raw); });
    var loose = accepted.some(function(a){ return norm(a) === norm(raw); });
    var noArt = accepted.some(function(a){ return norm(stripArticle(a)) === norm(raw); });
    if (exact) { SES.verdict = { k:"ok", msg:"Exactly right." }; SES.right++; }
    else if (loose) { SES.verdict = { k:"near", msg:"Right word — the accents are off." }; SES.near++; }
    else if (noArt) { SES.verdict = { k:"near", msg:"Right noun, but it needs its article — gender is part of the word." }; SES.near++; }
    else { SES.verdict = { k:"no", msg:"Not quite." }; SES.wrong++; markMissed(c); }
    /* "Quase" is its own bucket. Both near cases used to increment right++,
       so the summary counted accentless, article-less Portuguese as success
       and a learner could plateau there without the app ever pushing back.
       The scheduler hears "Difícil" for them, which is what they are. */
    SES.done++;
    practiceGrade(c, SES.verdict.k === "ok" ? "right" : SES.verdict.k === "near" ? "near" : "wrong");
    studyBeat(); save();
    autoSay(c.p);
    renderSession();
  }
}

function oab(letter, correct, chosen){
  var cls = "gopt";
  if (chosen) {
    if (letter === correct) cls += " right";
    else if (letter === chosen) cls += " wrong";
    else cls += " dim";
  }
  return '<button class="' + cls + '" data-oa="' + letter + '">' + letter + '</button>';
}
function bindEnd(){
  /* Back out of an exercise and the queue survives — see sesSnapshot. */
  on("[data-end]","click",function(){ sesRemember(); save(); navBack(); });

  q.forEach(function(c){

function bucketPool(k){

  if (k === "__due")    return dueList().filter(function(c){ return !c.k; });
  if (k === "__all")    return CARDS.filter(live);

}

/* ============================ memória ============================ */
/* The scheduler knows, for every word, how long that memory is currently
   expected to last and how likely it is to survive until tomorrow. Until now
   it spent all of that on picking a due date and showed the user a streak.
   This screen is the same numbers, said out loud. */

/* Stability is, by FSRS's own definition, the number of days until recall
   falls to 90% — so it reads directly as "this memory lasts about ...". */
function memoryLife(p){ return p && p.s > 0 ? p.s : 0; }
function saysLife(days){
  if (days < 1) return "menos de um dia · under a day";
  if (days < 14) return Math.round(days) + " dias · days";
  if (days < 60) return Math.round(days / 7) + " semanas · weeks";
  if (days < 365) return Math.round(days / 30) + " meses · months";
  var y = Math.round(days / 36.5) / 10;
  return y + (y === 1 ? " ano · year" : " anos · years");
}
/* Everything the memory screen needs, computed once. */
function memoryStats(){
  var t = dayNo(), rows = [], holds = 0, atRisk = [], sum = 0;
  for (var i = 0; i < WORDS.length; i++) {
    var c = WORDS[i], p = S.prog[c.i];
    if (!p) continue;
    var life = memoryLife(p);
    var r = life > 0 ? fsrsRecall(Math.max(0, t - (p.lr != null ? p.lr : t)), life) : 0;
    sum += r;
    if (r >= 0.9) holds++;
    rows.push({ c: c, p: p, life: life, r: r });
    if (r < 0.8 && life > 0) atRisk.push({ c: c, r: r });
  }
  rows.sort(function(a, b){ return b.life - a.life; });
  atRisk.sort(function(a, b){ return a.r - b.r; });

  /* Words pulled back from the edge today: graded today, and by the log's own
     record of stability-before they were already slipping when you got them. */
  var rescued = 0, seen = {};
  (S.rlog || []).forEach(function(e){
    var id = e[0], g = e[1], day = e[2], elapsed = e[3], sBefore = e[4];
    if (day !== t || g < 3 || seen[id]) return;
    if (sBefore > 0 && fsrsRecall(elapsed, sBefore) < 0.85) { rescued++; seen[id] = 1; }
  });

  var pr = deckProgress();
  var perDay = Math.max(1, S.set.perDay || 15);
  var daysLeft = Math.ceil(pr.fresh / perDay);
  return { rows: rows, holds: holds, atRisk: atRisk, rescued: rescued,
           expected: Math.round(sum), pr: pr, daysLeft: daysLeft,
           finish: new Date(Date.now() + daysLeft * 86400000) };
}

/* The vocabulary a conversation can be built from, best evidence first.
   Two tiers, and the distinction matters:
     earned — past the 21-day bar, the same bar the deck counter calls "sabes"
     met    — in rotation but not there yet
   The first gate here required 15 *earned* words, which was the wrong bar: 21
   days is what it takes to claim you know a word, not what it takes for that
   word to be usable in a sentence someone says to you. A word met last week is
   a perfectly good word to be spoken to in — and being spoken to in it is how

function conversaVocab(){
  var earned = [], met = [];

  earned.sort(byStrength); met.sort(byStrength);
  var pick = function(a){ return a.map(function(x){ return x.p; }); };
  return { earned: pick(earned), met: pick(met), all: pick(earned).concat(pick(met)) };

/* Send the thread and the learner's vocabulary; render whatever comes back. */
function convSend(learnerText){
  CONV.busy = true; CONV.err = "";
  renderConversa();
  var payload = {
    scene: CONV.scene,
    level: dailyLevel(),
    known: knownWords().slice(0, 600),
    due: dailyWords(),
    turns: CONV.turns.map(function(t){ return { role:t.role, text:t.text }; }),
  };
  window.MilSync.invoke("conversa", payload).then(function(r){
    if (r.error){
      var ctx = r.error.context;
      if (ctx && typeof ctx.json === "function")
        return ctx.json().then(function(b){ throw new Error((b && b.error) || "failed"); },
                               function(){ throw new Error("HTTP " + (ctx.status || "?")); });
      throw new Error(r.error.message || "failed");
    }
    var turn = r.data && r.data.turn;
    if (!turn) throw new Error((r.data && r.data.error) || "nothing came back");
    CONV.busy = false;
    CONV.turns.push({ role:"partner", text:turn.reply, en:turn.replyE,
                      correction:turn.correction || "", correctionWhy:turn.correctionWhy || "" });
    if (learnerText) convCredit(learnerText, !turn.correction);
    renderConversa();
    if (S.set.audio !== false) autoSay(turn.reply);
  }).catch(function(err){
    CONV.busy = false;
    CONV.err = convError(err);
    renderConversa();
  });
}

/* Using a due word correctly in a real sentence is retrieval, and the strongest
   kind the app can observe — so it reaches the scheduler like every other mode.
   Deliberately conservative: only words the scheduler already wanted today,
   only when the partner found nothing to correct, and never better than "Bom". */
function convCredit(text, clean){
  var hay = norm(text), n = 0;
  /* Activity, streak and save happen for EVERY turn. Only the word credit is
     gated on a clean turn. These used to sit together behind one early
     return, so a turn the partner corrected — the ones you learn most from —
     ticked no plan step, kept no streak and never saved. */
  if (!clean) { bumpAct("conversa"); markStudied(); save(); return; }
  WORDS.forEach(function(c){
    var p = S.prog[c.i];
    if (!p || p.d > dayNo()) return;               // not due — leave it alone
    var bare = norm(stripArticle(variants(c.p)[0]));
    if (bare.length < 4) return;                   // too short to match safely
    /* A whole word, both ends. Substring matching would credit "entre" for
       "entretanto" — and a credit the learner didn't earn is worse than a
       credit missed, because it pushes a real due date out. */
    if (!new RegExp("(^|[^0-9a-zà-ÿ])" + escapeRe(bare) + "([^0-9a-zà-ÿ]|$)").test(hay)) return;
    practiceGrade(c, "right"); n++;
  });
  /* A conversation is its own activity. studyBeat() infers the kind from
     SES.mode, and there is no session here, so it would have been filed as a
     drill. */
  bumpAct("conversa"); markStudied(); save();
}

function convError(err){
  var m = String(err && err.message || err);
  if (/not signed in/i.test(m)) return "Precisas de iniciar sessão. · You need to be signed in.";
  if (/not configured/i.test(m))
    return "Falta a chave no servidor. · The ANTHROPIC_API_KEY secret isn't set on the conversa function.";
  if (/Not enough known/i.test(m))
    return "Ainda não sabes palavras suficientes. · Not enough known words yet.";
  if (/Failed to send|NetworkError|fetch/i.test(m))
    return "Sem ligação. · No connection.";
  if (/404/.test(m)) return "A função conversa não existe. · The conversa function isn't deployed.";
  if (/^Rejected:/.test(m))
    return "O parceiro saiu das regras e a resposta foi recusada. Tenta outra vez. · " +
           "The partner broke the vocabulary rules, so the reply was rejected. Try again.";
  return m;
}

function escapeRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }

/* Compares the running build against what the server is serving and offers a
   reload. Service-worker updates are unreliable on iOS home-screen apps, and
   without this the user has no way to tell they're several versions behind —
   or to do anything about it. */
/* Dismissed for this launch only — a new version still matters, but not
   enough to keep interrupting a session you're in the middle of. */
var UPDATE_SNOOZED = false;
function checkForUpdate(){
  if (!navigator.onLine || UPDATE_SNOOZED) return;
  // Unique URL as well as no-store: belt and braces against both the HTTP
  // cache and any service worker that might answer for it.
  fetch("sw.js?check=" + Date.now(), { cache: "no-store" })
    .then(function(r){ return r.ok ? r.text() : ""; })
    .then(function(t){
      var m = /mil-palavras-v(\d+)/.exec(t || "");
      if (!m) return;
      var live = Number(m[1]), here = Number(String(APP_BUILD).replace(/\D/g, ""));
      if (!live || !here || live <= here) return;
      showUpdateBar(live);
    })
    .catch(function(){});
}
function showUpdateBar(live){
  if (document.getElementById("updbar")) return;
  var d = document.createElement("div");
  d.id = "updbar"; d.className = "updbar";
  /* The bar is fixed to the bottom, which is exactly where the grade buttons
     are. Without a way out it squatted on top of them for the rest of the
     session until you agreed to reload mid-review. */
  d.innerHTML = '<span>Nova versão disponível · update available (v' + live + ')</span>' +
    '<button data-upd="1">Atualizar · update</button>' +
    '<button data-updx="1" class="updx" aria-label="Mais tarde · later">×</button>';
  document.body.appendChild(d);
  d.querySelector("[data-updx]").addEventListener("click", function(){
    d.remove();
    UPDATE_SNOOZED = true;      // until the next launch, not for ever
  });
  d.querySelector("[data-upd]").addEventListener("click", function(){
    // Clear the shell cache and unregister, so the next load cannot be served
    // anything stale, then reload.
    var jobs = [];
    try {
      jobs.push(caches.keys().then(function(ks){
        return Promise.all(ks.filter(function(k){ return k.indexOf("audio") < 0; })
                             .map(function(k){ return caches.delete(k); }));
      }));
    } catch(e){}
    try {
      jobs.push(navigator.serviceWorker.getRegistrations().then(function(rs){
        return Promise.all(rs.map(function(r){ return r.unregister(); }));
      }));
    } catch(e){}
    Promise.all(jobs).catch(function(){}).then(function(){ location.reload(); });
  });
}

var CONTRACTIONS = {

  "do":"de + o","da":"de + a","dos":"de + os","das":"de + as",
  "no":"em + o","na":"em + a","nos":"em + os","nas":"em + as",
  "pelo":"por + o","pela":"por + a","pelos":"por + os","pelas":"por + as",
  "num":"em + um","numa":"em + uma","nuns":"em + uns","numas":"em + umas",
  "dum":"de + um","duma":"de + uma","duns":"de + uns","dumas":"de + umas",
  "dele":"de + ele","dela":"de + ela","deles":"de + eles","delas":"de + elas",
  "nele":"em + ele","nela":"em + ela","neles":"em + eles","nelas":"em + elas",
  "deste":"de + este","desta":"de + esta","destes":"de + estes","destas":"de + estas",
  "neste":"em + este","nesta":"em + esta","nestes":"em + estes","nestas":"em + estas",
  "disto":"de + isto","disso":"de + isso","daquilo":"de + aquilo",
  "nisto":"em + isto","nisso":"em + isso","naquilo":"em + aquilo",
  "daquele":"de + aquele","daquela":"de + aquela","naquele":"em + aquele","naquela":"em + aquela",
  "àquele":"a + aquele","àquela":"a + aquela","àquilo":"a + aquilo",
  "comigo":"com + mim","contigo":"com + ti","connosco":"com + nós","convosco":"com + vós"
};
function cleanWord(s){ return String(s).toLowerCase().replace(/^[^a-zà-ÿ]+/,"").replace(/[^a-zà-ÿ-]+$/,""); }
var _formMap = null, _vocabMap = null, _normMap = null;
/* Accent-stripped key, used ONLY as a last resort on a lemma guess — never on
   the word as typed, or "esta"/"está" would collide. */
function deacc(s){ return s.normalize ? s.normalize("NFD").replace(/[̀-ͯ]/g,"") : s; }
function buildLookups(){
  if (_formMap) return;
  _formMap = {}; _vocabMap = {}; _normMap = {};
  CARDS.forEach(function(c){
    if (c.c === "conjugacao"){ var k = cleanWord(c.p); if (k && !_formMap[k]) _formMap[k] = { inf:c.v, e:(c.w && c.w.e) || "" }; }
    else if (!c.k){
      var base = cleanWord(stripArticle(c.p)), full = cleanWord(c.p);
      if (base && !_vocabMap[base]) _vocabMap[base] = { p:c.p, e:c.e, ipa:c.ipa, cls:c.c };
      if (full && !_vocabMap[full]) _vocabMap[full] = { p:c.p, e:c.e, ipa:c.ipa, cls:c.c };
      if (base && !_normMap[deacc(base)]) _normMap[deacc(base)] = _vocabMap[base];
    }
  });
}
function wordInfo(raw){
  buildLookups();
  var w = cleanWord(raw);
  if (!w) return null;
  if (CONTRACTIONS[w]) return { tag:"contração · contraction", word:raw, detail:CONTRACTIONS[w] };
  if (_formMap[w]){ var f = _formMap[w]; return { tag:"verbo · verb", word:raw, detail:"infinitivo · infinitive: " + f.inf + (f.e ? " — " + f.e : "") }; }
  if (_vocabMap[w]){ var v = _vocabMap[w]; return { tag:(CLASS_LABEL[v.cls] || "palavra") + " · " + (CLASS_EN[v.cls] || "word"), word:v.p, detail:v.e + (v.ipa ? " · " + v.ipa : "") }; }
  // plural -> singular guesses: casas->casa, mares->mar, animais->animal
  var guesses = [];
  if (/s$/.test(w)) guesses.push(w.slice(0,-1));
  if (/es$/.test(w)) guesses.push(w.slice(0,-2));
  if (/ais$|eis$|ois$|uis$/.test(w)) guesses.push(w.slice(0,-2) + "l");
  if (/ões$|ães$/.test(w)) guesses.push(w.slice(0,-3) + "ão");
  for (var gi=0; gi<guesses.length; gi++){
    var g = guesses[gi];
    var v2 = _vocabMap[g] || _normMap[deacc(g)];
    if (v2) return { tag:(CLASS_LABEL[v2.cls] || "palavra") + " · " + (CLASS_EN[v2.cls] || "word"), word:raw, detail:"plural de · plural of " + v2.p + " — " + v2.e };
    if (_formMap[g]) return { tag:"verbo · verb", word:raw, detail:"infinitivo · infinitive: " + _formMap[g].inf };
  }

    detail:"Esta palavra não está nas 1000. · This word isn't in the 1000-word deck, so there's no entry for it yet." };

/* Tokenise BEFORE escaping, so the word regex can never match the letters

function tapWords(text){

      '<span class="wtap" data-w="' + esc(m[0]) + '">' + esc(m[0]) + '</span>';
    last = m.index + m[0].length;
  }
  return out + esc(s.slice(last));
}
function showWordInfo(raw){

  }
