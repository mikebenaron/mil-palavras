ry fast."],"você":["O senhor quer alguma coisa?","Would you like anything, sir?"],"nós":["Nós vamos de carro.","We're going by car."],"me":["Ele deu-me o livro.","He gave me the book."],"te":["Eu ligo-te logo.","I'll call you later."],"mim":["Isto é para mim?","Is this for me?"],"ti":["Estou a falar contigo, não com ele.","I'm talking to you, not to him."],"meu / minha":["A minha casa fica ali.","My house is over there."],"seu / sua":["O seu passaporte, por favor.","Your passport, please."],"este / esta":["Este é o meu irmão.","This is my brother."],"isto":["O que é isto?","What's this?"],"aquele / aquela":["Prefiro aquele ali.","I prefer that one over there."],"tudo":["Está tudo bem?","Is everything OK?"],"nada":["Não quero nada, obrigado.","I don't want anything, thanks."],"alguém":["Está aí alguém?","Is anyone there?"],"ninguém":["Não está cá ninguém.","There's nobody here."],"cada":["Cada pessoa paga a sua conta.","Each person pays their own bill."]},"notes":{"o problema":"Masculine despite the -a. Greek-derived words ending in -ema and -oblema are all masculine: <em>o problema, o sistema, o tema, o cinema</em>.","o sistema":"Masculine despite the -a — same Greek family as <em>o problema</em> and <em>o tema</em>.","o tema":"Masculine despite the -a, like <em>o problema</em> and <em>o sistema</em>.","o planeta":"Masculine despite the -a.","o dia":"Masculine despite the -a. So it's <em>bom dia</em> but <em>boa tarde</em> and <em>boa noite</em>.","a mão":"Feminine despite the -ão, and the plural is <em>as mãos</em>, not <em>as mões</em>. One of the most common gender mistakes there is.","o país":"Masculine. Note the accent — <em>país</em> (country) versus <em>pais</em> (parents) is only that í.","a razão":"Feminine. Nouns in <em>-ão</em> split: those from Latin <em>-tio</em> (razão, relação, ação) are feminine; concrete ones (o irmão, o coração, o chão) are masculine.","o coração":"Masculine, even though most <em>-ão</em> abstractions are feminine. Compare <em>a razão</em>.","a cor":"Feminine. Most -or nouns are masculine (<em>o valor, o amor, o calor</em>), so this one has to be learned.","a gente":"Takes a <em>third person singular</em> verb: <em>a gente vai</em>, never <em>a gente vamos</em>. It means <em>we</em> in casual speech but is grammatically an <em>it</em>.","as costas":"Always plural for the human back. <em>A costa</em> singular is the coastline — different word entirely.","a costa":"Coastline. Your back is <em>as costas</em>, always plural.","o pelo":"Body hair. Don't confuse with the contraction <em>pelo</em> (= por + o), which is far more common in text.","a pena":"Two lives: a feather, and a penalty. Also the everyday <em>vale a pena</em> (it's worth it) and <em>que pena!</em> (what a shame!).","a conta":"Restaurant bill, bank account, and a sum in maths. <em>A conta, por favor</em> is the one you'll use most.","o tempo":"Both time and weather. <em>Não tenho tempo</em> (no time); <em>está bom tempo</em> (nice weather).","a vez":"A time as in an occurrence or a turn — <em>três vezes</em>, <em>a tua vez</em>. Clock time is <em>a hora</em>; duration is <em>o tempo</em>.","o largo":"As a noun, a small town square. As an adjective it means wide. Portuguese addresses are full of them: <em>Largo do Carmo</em>.","a massa":"Dough, pasta, or mass. Portuguese doesn't borrow the Italian word.","o banco":"Bank and bench. Context sorts it out.","a secretária":"A desk, and also a female secretary. The furniture meaning is the common one.","assistir":"False friend: it means to attend or to watch, not to assist. To help someone is <em>ajudar</em>.","pretender":"False friend: to intend, not to pretend. To pretend is <em>fingir</em>.","realizar":"Usually to carry out or to hold (an event), not to realise mentally. That's <em>aperceber-se</em> or <em>dar-se conta</em>.","perceber":"In Portugal this is the ordinary word for <em>to understand</em>. In Brazil it leans towards <em>to notice</em> — a genuine dialect split.","esperar":"Covers both waiting and hoping: <em>espero que sim</em> means I hope so.","ficar":"Enormously useful and hard to pin down: to stay, to become, to be located, to suit. <em>Fico em casa. Fiquei doente. O banco fica ali. Fica-te bem.</em>","a casa de banho":"Portugal only. In Brazil it's <em>o banheiro</em>, which in Portugal would suggest a lifeguard.","a equipa":"Portuguese spelling. Brazil writes <em>a equipe</em>.","o frigorífico":"Portugal. Brazil says <em>a geladeira</em>.","a rapariga / a menina":"In Portugal <em>rapariga</em> is the neutral everyday word for a girl or young woman. In Brazil it is offensive — use <em>menina</em> or <em>moça</em> there.","o facto":"Portuguese spelling keeps the c. Brazil writes <em>fato</em> — which in Portugal means a suit.","o contacto":"Portuguese spelling keeps the c; Brazil writes <em>contato</em>.","a t-shirt":"Borrowed straight from English and used constantly in Portugal.","o telhado":"The roof from outside. The ceiling seen from inside is <em>o teto</em>.","gostar":"Always takes <em>de</em>: <em>gosto de café</em>, <em>gostas de mim?</em> Never <em>gosto café</em>.","precisar":"Takes <em>de</em>: <em>preciso de ajuda</em>, <em>precisas de alguma coisa?</em>","depender":"Takes <em>de</em>: <em>depende do tempo</em>.","pertencer":"Takes <em>a</em>: <em>este livro pertence-me</em> / <em>pertence ao João</em>.","casar":"Usually reflexive in practice: <em>casar-se com alguém</em>.","lembrar-se":"Reflexive and takes <em>de</em>: <em>lembro-me de ti</em>. Without the pronoun, <em>lembrar</em> means to remind.","esquecer":"Two patterns: <em>esqueci o livro</em> (plain) or <em>esqueci-me do livro</em> (reflexive + de). The second is more common in speech.","aperceber-se":"Reflexive and takes <em>de</em>: <em>aperceber-se de algo</em>. This is the real translation of <em>to realise</em>.","ser":"Permanent or defining: origin, profession, personality, time. <em>Sou inglês. É segunda-feira.</em> For states and locations, use <em>estar</em>.","estar":"Temporary states and, in Portugal, position: <em>estou cansado</em>, <em>está frio</em>. For a permanent location Portuguese often prefers <em>ficar</em>: <em>o banco fica ali</em>.","saber":"To know a fact or how to do something: <em>sei nadar</em>, <em>não sei</em>. To know a person or place is <em>conhecer</em>.","conhecer":"To know a person, place or thing by acquaintance: <em>conheço o Porto</em>. Knowing a fact is <em>saber</em>.","por":"Cause, route, exchange, agent — the <em>through/by/for the sake of</em> preposition. <em>Passei por Lisboa. Obrigado por tudo.</em> Contrast with <em>para</em>, which is destination and purpose.","para":"Destination and purpose: <em>vou para casa</em>, <em>isto é para ti</em>. If you could say <em>in order to</em>, it's <em>para</em>.","muito":"Invariable before adjectives and verbs (<em>muito bom</em>, <em>trabalho muito</em>), but agrees before nouns: <em>muitos livros</em>, <em>muitas pessoas</em>.","levar":"To take something away from here. To bring something towards here is <em>trazer</em> — Portuguese keeps the distinction strictly.","trazer":"To bring towards the speaker. Taking away is <em>levar</em>.","ouvir":"To hear, and in practice also to listen: <em>ouço música</em>. <em>Escutar</em> exists but is more deliberate.","olhar":"To look — takes <em>para</em>: <em>olha para mim</em>. To see is <em>ver</em>; to watch a film is <em>ver</em> too.","haver":"In practice you only need the third person <em>há</em>: <em>há uma farmácia ali</em> (there is), <em>há dois anos</em> (two years ago). The other forms are rare.","ir":"Followed by an infinitive it forms the everyday future: <em>vou comer</em> — I'm going to eat. Portuguese uses this far more than the true future tense.","dever":"Obligation or probability: <em>deves ir</em> (you should go), <em>deve estar em casa</em> (he's probably home). Also to owe money.","andar":"Beyond walking, it marks an ongoing state: <em>ando cansado</em> — I've been tired lately.","obrigado":"Agrees with <em>you</em>, the speaker — not with the person you're thanking. A man always says <em>obrigado</em>, whoever he's talking to.","obrigada":"Agrees with the speaker. A woman always says <em>obrigada</em>, whoever she's talking to.","boa noite":"Both a greeting on arrival after dark and a farewell. Portuguese doesn't split it into evening and night.","desculpe":"Formal, for strangers. <em>Desculpa</em> is what you say to friends and family. Same split as <em>tu</em> versus <em>você</em>.","desculpa":"Informal. Use <em>desculpe</em> with strangers, older people, or anyone you'd address formally.","com licença":"Used to get past someone or to excuse yourself from a room. To apologise, use <em>desculpe</em>.","tu":"The normal informal <em>you</em> in Portugal, used with friends, family and colleagues. Brazil mostly uses <em>você</em> here instead.","você":"Formal and oddly awkward in Portugal — it can sound distancing. With strangers the Portuguese often drop the pronoun altogether and use the third person: <em>Quer um café?</em>","vocês":"The standard plural <em>you</em> in both countries. There's no plural of <em>tu</em> in everyday use.","se":"Does a lot of work: reflexive (<em>chama-se</em>), impersonal (<em>vende-se</em>), and the conjunction <em>if</em>. Context separates them.","a":"Also the feminine article and a direct-object pronoun. Three common words share this one letter.","o":"Also the masculine article and a direct-object pronoun.","que":"The workhorse: <em>that</em>, <em>which</em>, <em>who</em>, and part of most questions (<em>o que é que…</em>). Portuguese rarely drops it the way English drops <em>that</em>.","de":"Contracts compulsorily with articles: de + o = <em>do</em>, de + a = <em>da</em>. You will almost never write <em>de o</em>.","em":"Contracts with both definite and indefinite articles: em + o = <em>no</em>, em + uma = <em>numa</em>.","mais":"Also forms comparatives: <em>mais rápido do que</em>. Note <em>do que</em>, not just <em>que</em>, in careful European Portuguese.","já":"Slippery: <em>already</em> in statements, <em>yet</em> in questions, and <em>right now</em> as an order. <em>Já comi. Já chegaste? Vem já!</em>","pois":"In Portugal often just a filler agreement noise, roughly <em>right</em> or <em>indeed</em>, as well as the conjunction <em>because</em>.","logo":"Later today, not immediately. <em>Até logo</em> means see you later — same day.","bem":"The adverb of <em>bom</em>. You say <em>o jantar foi bom</em> (adjective) but <em>corri bem</em> (adverb). Mixing them is the commonest slip."},"grammar":[{"id":"artigos","title":"Articles","intro":"Every Portuguese noun carries a gender, and the article tells you which. Learn nouns with their article attached — <em>a mesa</em>, never just <em>mesa</em>.","tables":[{"cols":["","Def. m.","Def. f.","Indef. m.","Indef. f."],"rows":[["Singular","o","a","um","uma"],["Plural","os","as","uns","umas"]]}],"notes":["Definite (o/a/os/as) = <em>the</em>. Indefinite (um/uma/uns/umas) = <em>a / an / some</em>."]},{"id":"contracoes","title":"Preposition contractions","intro":"Four prepositions fuse with the article that follows them. These are compulsory — you cannot say <em>de o</em>.","tables":[{"cols":["+","o","a","os","as"],"rows":[["a","ao","à","aos","às"],["de","do","da","dos","das"],["em","no","na","nos","nas"],["por","pelo","pela","pelos","pelas"]]},{"cols":["+","um","uma","uns","umas"],"rows":[["em","num","numa","nuns","numas"]]}],"notes":["<em>Vou ao mercado</em> — I'm going to the market. <em>Estou na cozinha</em> — I'm in the kitchen."]},{"id":"plurais","title":"Making nouns plural","intro":"Five rules cover almost everything.","tables":[{"cols":["Ending","Rule","Example"],"rows":[["vowel","add -s","o tempo → os tempos"],["consonant","add -es","a vez → as vezes"],["-m","becomes -ns","o homem → os homens"],["-l","becomes -is","o final → os finais"],["-ão","usually -ões","a relação → as relações"]]}],"notes":["-ão is the awkward one: some go to -ãos (o chão → os chãos) or -ães (o cão → os cães). Exceptions are flagged in square brackets on the cards."]},{"id":"presente","title":"Present tense","intro":"Verbs come in three families, named after their infinitive ending: -ar, -er, -ir. Drop the ending, add the one below. This single tense will carry most of your early conversations.","tables":[{"cols":["","falar","escrever","existir"],"rows":[["eu","falo","escrevo","existo"],["tu","falas","escreves","existes"],["ele / ela / você","fala","escreve","existe"],["nós","falamos","escrevemos","existimos"],["vocês / eles / elas","falam","escrevem","existem"]]}],"notes":["The highest-frequency verbs — <em>ser, ter, estar, ir, fazer, poder, dizer, ver, vir</em> — are all irregular. Learn those as whole shapes rather than trying to derive them.","In Portugal <em>tu</em> is the everyday informal <em>you</em>; <em>você</em> is formal and used less than in Brazil. With strangers, Portuguese often skips the pronoun entirely and uses the third person: <em>Quer um café?</em>"]},{"id":"serestar","title":"ser vs estar","intro":"Both mean <em>to be</em>. Roughly: ser is what something <em>is</em>, estar is how it <em>is right now</em>.","tables":[{"cols":["","ser (permanent)","estar (temporary)"],"rows":[["eu","sou","estou"],["tu","és","estás"],["ele / ela / você","é","está"],["nós","somos","estamos"],["vocês / eles / elas","são","estão"]]}],"notes":["<em>Ele é aborrecido</em> — he's a boring person. <em>Ele está aborrecido</em> — he's bored at the moment. Same adjective, different verb, very different insult."]},{"id":"pronomes","title":"Pronouns","intro":"Subject pronouns replace the doer. Clitic pronouns replace the object and never follow a preposition. Tonic pronouns always do.","tables":[{"cols":["","Subject","Clitic","After a preposition"],"rows":[["1st sing.","eu","me","mim"],["2nd sing.","tu","te","ti"],["3rd sing.","ele / ela / você","se, o, a, lhe","si, ele, ela"],["1st pl.","nós","nos","nós"],["2nd pl.","vocês","vos","vocês"],["3rd pl.","eles / elas","se, os, as, lhes","si, eles, elas"]]}],"notes":["European Portuguese usually puts the clitic <em>after</em> the verb, hyphenated: <em>chamo-me Mike</em>. Brazilian Portuguese puts it before. Negatives and questions flip it back to the front: <em>não me chamo Mike</em>."]},{"id":"possessivos","title":"Possessives","intro":"Possessives agree with the thing owned, not the owner. <em>A minha casa</em> stays feminine whether the owner is a man or a woman.","tables":[{"cols":["","m. sing.","m. pl.","f. sing.","f. pl."],"rows":[["eu","meu","meus","minha","minhas"],["tu","teu","teus","tua","tuas"],["você","seu","seus","sua","suas"],["ele / ela","dele / dela","dele / dela","dele / dela","dele / dela"],["nós","nosso","nossos","nossa","nossas"],["vocês","vosso","vossos","vossa","vossas"],["eles / elas","deles / delas","deles / delas","deles / delas","deles / delas"]]}],"notes":["Portuguese keeps the article: <em>o meu carro</em>, not <em>meu carro</em>. Dropping it sounds Brazilian."]},{"id":"demonstrativos","title":"Demonstratives","intro":"Three distances, not two. Near me, near you, near neither of us.","tables":[{"cols":["","m. sing.","m. pl.","f. sing.","f. pl.","Invariable"],"rows":[["near me","este","estes","esta","estas","isto"],["near you","esse","esses","essa","essas","isso"],["over there","aquele","aqueles","aquela","aquelas","aquilo"]]}],"notes":["The invariable forms are for things you can't or won't name: <em>O que é isto?</em> — what is this?"]},{"id":"adjetivos","title":"Adjectives","intro":"Adjectives agree with the noun in gender and number, and normally sit after it: <em>um carro vermelho</em>. Cards show the masculine singular.","tables":[{"cols":["Masculine ends in","Feminine"],"rows":[["-o","swap to -a — bonito → bonita"],["-dor","add -a — assustador → assustadora"],["anything else","no change — grande, feliz, fácil"]]}],"notes":["Two irregulars worth memorising now: <em>bom → boa</em> and <em>mau → má</em>.","Comparatives: <em>mais … do que</em> (more), <em>menos … do que</em> (less), <em>tão … como</em> (as … as). Superlative: <em>o mais / o menos …</em>","Shades of colour take a hyphen: <em>azul-escuro</em>, <em>castanho-claro</em>."]},{"id":"adverbios","title":"Adverbs","intro":"Most manner adverbs are built from an adjective: take the feminine form and add -mente.","tables":[{"cols":["Adjective","Adverb","English"],"rows":[["rápido","rapidamente","quickly"],["fácil","facilmente","easily"],["calmo","calmamente","calmly"],["infeliz","infelizmente","unfortunately"]]}],"notes":["Useful shortcut: a great many English -ly adverbs map straight onto Portuguese -mente. <em>frequently → frequentemente</em>."]}],"pron":[["ã, õ, -m, -ns","Nasal. Air goes through the nose and the consonant mostly disappears. <em>não</em>, <em>bem</em>, <em>manhã</em>."],["unstressed e","Often swallowed almost to nothing, which is why spoken European Portuguese sounds compressed. <em>de</em> ≈ \"duh\", <em>telefone</em> ≈ \"tlfon\"."],["s at the end / before a consonant","Sounds like <em>sh</em>. <em>os livros</em> ≈ \"oosh leevroosh\". This is the single biggest giveaway between Lisbon and São Paulo."],["r at the start, or rr","Guttural, back of the throat, close to a French r. <em>rua</em>, <em>carro</em>."],["lh / nh","Like the middle of <em>million</em> and <em>onion</em>. <em>filho</em>, <em>manhã</em>."],["ç","Always a soft s. <em>coração</em>, <em>almoço</em>."],["ão","Nasal \"ow\" — the vowel of <em>now</em>, sent through the nose. <em>não</em>, <em>pão</em>, <em>irmão</em>."]],"method":[["Do the review first, every day.","Twenty minutes today beats three hours on Sunday. The scheduler only works if you meet it roughly when it asks — the whole point is being tested just as you're about to forget."],["Answer honestly.","Again is not a failure, it's information. Marking something Good because you nearly had it is how a deck quietly fills with words you don't actually know."],["Recall before you flip.","Say the answer out loud, or at least commit to one in your head, before revealing. The effort of retrieval is what builds the memory — reading the answer does almost nothing."],["Go both ways.","PT → EN gets you reading and listening. EN → PT is what you need to actually speak, and it's much harder. Type it mode forces production, including the spelling and the accents."],["Learn the gender with the word.","Portuguese nouns are useless without their article, and retrofitting gender later is miserable. o or a? drills exactly this."],["Let it be a bit uncomfortable.","Cards that feel too easy aren't teaching you anything. The ones that make you pause are doing the work."],["Fifteen new words a day is plenty.","That's about 450 a month, and it keeps tomorrow's review pile survivable. Turn it up only if you're clearing your reviews comfortably."],["Deal with leeches.","A word you've failed six times won't be fixed by seeing it a seventh. Look it up in a real sentence, attach it to an image or a person, then reset it."]]};</script>

var KEY = "milpalavras.v1";
var Store = (function(){

/* ============================ state ============================ */
var S;
function freshState(){
  var classes = {};

  return {
    v:1, prog:{}, newToday:0, lastDay:0, streak:0, best:0, reviews:0, seenDays:0,
    /* dir defaults to "mix", not "pt". With PT→EN only, the one mode that
       feeds the scheduler is the receptive one, so every word in the deck can
       reach "known" without ever being produced under test. Mixed direction
       is the harder and far more transferable condition, and hiding it behind
       a setting meant it was never met. One tap in Definições reverts it. */
    set:{ perDay:15, dir:"mix", tips:true, audio:true, rate:"steady", classes:classes,
          tlvl:2, tlv:{ 1:true, 2:true, 3:false, 4:false } }

}
function save(){ S._updatedAt = Date.now(); Store.save(S); if (window.MilSync) window.MilSync.push(S); }

function dayNo(ts){ var d = ts ? new Date(ts) : new Date(); d.setHours(0,0,0,0); return Math.round(d.getTime()/86400000); }

/* What's been done today, per activity, so the plan can tick things off and
   tell you when you're actually finished. */
function act(){
  var t = dayNo();

  return S.act;
}
function bumpAct(kind, n){
  var a = act();

}
/* Days since a skill was last touched — big numbers pull it up the plan. */
function sinceAct(kind){
  var last = S.last && S.last[kind];
  return last == null ? 999 : (dayNo() - last);
}

function rollDay(){
  var t = dayNo();
  if (S.lastDay === t) return;
  if (S.lastDay === 0) { S.lastDay = t; S.newToday = 0; return; }
  if (t - S.lastDay === 1 && S.reviews > 0) { /* streak continues when they study */ }
  S.newToday = 0;
  S.lastDay = t;

function markStudied(){
  var t = dayNo();

  if (S.studiedDay === t - 1) S.streak = (S.streak||0) + 1; else S.streak = 1;
  S.studiedDay = t;

function known(id){ var p = S.prog[id]; return p && p.iv >= 21; }
/* A word you've forgotten this many times is "difícil" — one threshold used
   everywhere (the trouble tile, the weak-drill filters, the reset button), so
   the count you see and the cards you get are always the same set. */
var TROUBLE_AT = 4;
/* `l` only ever counts up, so "forgotten 4+ times" alone would mark a word
   difficult for life. It also has to be a word you haven't nailed yet — once
   the interval reaches the 21-day "known" mark, it leaves the list by itself. */
function leech(id){ var p = S.prog[id]; return p && (p.l||0) >= TROUBLE_AT && p.iv < 21; }
/* Trouble cards, worst first. */
function troubleList(){
  var out = [];
  for (var i=0;i<CARDS.length;i++){ var c = CARDS[i]; if (leech(c.i)) out.push(c); }
  out.sort(function(a,b){ return (S.prog[b.i].l||0) - (S.prog[a.i].l||0); });
  return out;
}

function dueList(){
  var t = dayNo(), out = [];
  for (var k in S.prog) {
    if (S.prog[k].d > t) continue;
    var c = BY_ID[k];
    /* A switched-off rung stops arriving in Rever, not just in the intake.
       Its schedule keeps ticking underneath — nothing is lost, it is simply
       not asked. */
    if (c && !tenseBlocked(c)) out.push(c);
  }
  return out;
}
/* Which rung of the tense ladder is being fed into the daily queue. Every
   tense is always drillable by hand from Conjugações — this only governs what
   arrives unasked, because all twelve tenses at once is 14,819 cards and would
   bury the vocabulary that the ladder is supposed to be supporting. */
function tenseLevel(){
  var n = S.set.tlvl;
  return (n >= 1 && n <= TMAX) ? n : 2;
}
/* Which CEFR rungs of the verb ladder are switched on, independently.
   This replaced a single "up to rung N" ladder, which had two problems: you
   could not have A1 and A2 without also accepting everything below whatever
   rung you picked (fine), and — the real one — it gated `newPool()` only.
   Turning the ladder down stopped *new* B2 cards arriving but did nothing
   about the several hundred already in rotation, which kept coming back for
   ever. These toggles are global: off means off in the daily queue too.

   Progress is never deleted. A rung switched off keeps its stability and its
   due dates; switch it back on and those cards return exactly where they were
   (overdue, most likely, which is honest — you did stop reviewing them). */
function tenseOn(lvl){
  var m = S && S.set && S.set.tlv;

}
function tensesOff(){
  var out = [];

}
/* Is this card gated by the ladder at all? Only conjugation cards are. */
function tenseBlocked(c){

}
/* Words, conjugations and grammar are drawn from three separate queues and
   interleaved, so drills start appearing on day one instead of waiting until
   all 990 words have been introduced. */
/* Which persons of a tense enter the daily queue first: eu, ele/ela/você and
   nós. FSRS treats falamos and falam as two independent memories when they are
   really one rule plus a person ending, so admitting all five cells of every
   tense of every verb inflates review debt with strongly correlated items.
   The other two unlock for a verb-tense once these three are known — nothing
   is hidden, and Conjugações still drills every cell on demand. */
var CORE_PERSONS = { 0:1, 2:1, 3:1 };
function conjCellReady(c){
  var parts = String(c.i).split("|");         // "c|<verb>|<tense>|<person>"
  var person = Number(parts[3]);
  if (!(person >= 0)) return true;            // single-form tenses have no person
  if (CORE_PERSONS[person]) return true;
  var prefix = parts[0] + "|" + parts[1] + "|" + parts[2] + "|";
  for (var k in CORE_PERSONS) {

}
function newPool(){
  var w = [], j = [], g = [], lvl = tenseLevel();
  for (var i=0;i<CARDS.length;i++){
    var c = CARDS[i];
    if (S.prog[c.i]) continue;
    if (!S.set.classes[c.c]) continue;
    if (c.c === "conjugacao") { if (tenseOn(c.lvl) && conjCellReady(c)) j.push(c); }
    else if (c.c === "gramatica") g.push(c);
    else w.push(c);
  }
  var out = [], iw = 0, ij = 0, ig = 0;
  while (iw < w.length || ij < j.length || ig < g.length){
    for (var n=0; n<3 && iw < w.length; n++) out.push(w[iw++]);

function newAllowance(){ return Math.max(0, S.set.perDay - (S.newToday||0)); }

/* ---------------------------- FSRS ----------------------------
   Replaces SM-2. SM-2 multiplies the last interval by an "ease" number, which
   is why grading a word Fácil could still bring it back in three days — the
   multiplier had nowhere to start from. FSRS models two separate things:
   how hard the word is for you (difficulty) and how long the memory currently
   lasts (stability), then schedules for a target recall probability.

   Published FSRS-4.5 default weights. Don't hand-tune these — they come from
   fitting millions of real reviews, and guessing at them is worse than useless.

   The card keeps its existing fields (iv, d, l, r) so everything built on them
   — "known" at iv >= 21, the review forecast, trouble words — keeps working
   unchanged. s/df/lr are added alongside. */
var FSRS_W = [0.4872, 1.4003, 3.7145, 13.8206, 5.1618, 1.2298, 0.8975, 0.031,
              1.6474, 0.1367, 1.0461, 2.1072, 0.0793, 0.3246, 1.587, 0.2272, 2.8755];

function fsrsRetention(){

  return (typeof r === "number" && r >= 0.8 && r <= 0.95) ? r : 0.9;
}
function fsrsMaxIv(){

function fsrsClampD(d){ return Math.min(10, Math.max(1, d)); }
function fsrsInitD(g){ return fsrsClampD(FSRS_W[4] - (g - 3) * FSRS_W[5]); }
/* Probability the word is still remembered, given days elapsed. */
function fsrsRecall(elapsed, stability){
  if (!(stability > 0)) return 0;
  return Math.pow(1 + FSRS_FACTOR * elapsed / stability, FSRS_DECAY);
}
/* Days until recall probability decays to the target. */
function fsrsInterval(stability){
  var i = stability / FSRS_FACTOR * (Math.pow(fsrsRetention(), 1 / FSRS_DECAY) - 1);
  if (!isFinite(i) || i < 1) i = 1;
  return Math.max(1, Math.min(fsrsMaxIv(), Math.round(i)));

/* Spread due dates so a big intake day doesn't come back as one huge pile
   months later. Anki randomises this; here it's derived from the card itself,
   so the same card+grade+interval always lands on the same day — which means
   the number printed on the grade button is still exactly what you get. */
function fsrsFuzz(iv, id, g){
  if (iv < 3) return iv;
  var span = Math.max(1, Math.round(iv * 0.05));
  var str = String(id) + ":" + g + ":" + iv, h = 0;
  for (var i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0;

/* Every review, kept so the FSRS weights can later be fitted to how *you*

   rides along in the synced state. */
function logReview(id, g, t, elapsed, sBefore){
  if (!S.rlog) S.rlog = [];
  S.rlog.push([id, g, t, elapsed, Math.round((sBefore || 0) * 100) / 100]);
  if (S.rlog.length > 1200) S.rlog.splice(0, S.rlog.length - 1200);
}

/* Bring an SM-2 card across without disturbing when it is next due: the
   interval that was working becomes the stability estimate, and the ease
   number (plus how often it's been forgotten) becomes the difficulty. */
function fsrsMigrate(p, t){
  p.s = Math.max(0.5, p.iv || 1);
  var e = Math.min(2.5, Math.max(1.3, p.e || 2.5));
  var d = 10 - ((e - 1.3) / 1.2) * 5;
  d += Math.min(4, p.l || 0) * 0.4;
  p.df = fsrsClampD(d);
  p.lr = (p.d != null && p.iv) ? (p.d - p.iv) : t;
}

function fsrsApply(p, g, t, id){
  // Decide this BEFORE migrating: migration invents a stability, which would
  // otherwise disguise a brand-new card as one with history.
  var firstEver = (p.s == null && !p.r && !p.iv);
  if (p.s == null || p.df == null) fsrsMigrate(p, t);

  if (firstEver) {
    p.s = FSRS_W[g - 1];
    p.df = fsrsInitD(g);
  } else {
    var elapsed = Math.max(0, t - (p.lr != null ? p.lr : t));
    var R = fsrsRecall(elapsed, p.s);
    var D = p.df;
    var nd = D - FSRS_W[6] * (g - 3);
    nd = FSRS_W[7] * fsrsInitD(4) + (1 - FSRS_W[7]) * nd;   // drift back toward average
    p.df = fsrsClampD(nd);

    if (g === 1) {
      p.s = FSRS_W[11] * Math.pow(D, -FSRS_W[12]) *
            (Math.pow(p.s + 1, FSRS_W[13]) - 1) * Math.exp(FSRS_W[14] * (1 - R));
    } else {
      var hard = g === 2 ? FSRS_W[15] : 1;
      var easy = g === 4 ? FSRS_W[16] : 1;
      p.s = p.s * (1 + Math.exp(FSRS_W[8]) * (11 - D) * Math.pow(p.s, -FSRS_W[9]) *

    }
    if (!isFinite(p.s) || p.s <= 0) p.s = 0.5;      // never let the maths poison a card
    p.s = Math.max(0.1, Math.min(36500, p.s));

  p.lr = t;

    // Forgotten: back in today's pile, as before. (A same-day repeat scores
    // R = 1, so the maths leaves stability alone — you can't inflate a card's
    // interval by grading it repeatedly in one sitting.)
    p.l = (p.l || 0) + 1; p.r = 0; p.iv = 0; p.d = t;
  } else {
    p.r = (p.r || 0) + 1;

}

function grade(id, g){
  var t = dayNo();
  var p = S.prog[id] || { r:0, e:2.5, iv:0, d:t, l:0 };
  var isNew = !S.prog[id];
  if (isNew) { S.newToday = (S.newToday||0) + 1; }
  var sBefore = p.s || 0;
  var elapsed = p.lr != null ? Math.max(0, t - p.lr) : 0;
  fsrsApply(p, g, t, id);
  logReview(id, g, t, elapsed, sBefore);
  S.prog[id] = p;
  S.reviews = (S.reviews||0) + 1;

/* Which plan activity the current session feeds. Review is the scheduler's
   own queue; dictation is ear training; speaking is its own thing; the rest
   is practice. */
function actKind(){
  if (!SES) return "drill";
  if (SES.mode === "listen") return "listen";
  if (SES.mode === "review") return "review";
  if (SES.mode === "speak") return "speak";
  return "drill";
}
/* Called once per answered card, in every mode.
   This used to live inside grade(), which — despite what the docs claimed —
   only ever ran for review-mode flip cards. So a.listen and a.drill never
   incremented: the Ditado and Escolha steps of the daily plan could never be
   ticked off, sinceAct("listen") was pinned at 999 so the plan nagged "ainda
   não treinaste o ouvido" forever, and doneAll — the condition for the app's
   "Já chega por hoje" message — was unreachable. */
function studyBeat(){

/* Practice modes are retrieval tests too, and the scheduler should hear about

   its richest evidence, because a production failure predicts forgetting far
   better than a recognition hit does.

   Two rules keep this honest:
   - Grades are compressed. A drill can push a card back (Outra), hold it
     (Difícil) or advance it normally (Bom), but never award Fácil: spotting
     the right option in a list of four is weaker evidence than a considered
     self-grade on a flip card.

     not quietly consume the day's new-word allowance or introduce words out
     of the scheduler's chosen order. */
function practiceGrade(c, verdict){
  if (!c || c.i == null) return;
  if (!S.prog[c.i]) return;
  grade(c.i, verdict === "wrong" ? 1 : verdict === "near" ? 2 : 3);
}
/* What each grade button promises. Runs the real scheduler on a copy, so the
   number on the button can never drift from what actually happens. */
function previewIv(id, g){
  if (g === 1) return "now";
  var src = S.prog[id] || { r:0, e:2.5, iv:0, d:dayNo(), l:0 };
  var p = {};
  for (var k in src) p[k] = src[k];
  fsrsApply(p, g, dayNo(), id);
  var iv = p.iv;
  if (iv < 30) return iv + "d";
  if (iv < 365) return Math.round(iv/30) + "mo";

function esc(s){ return String(s).replace(/[&<>"]/g, function(m){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]; }); }

/* back link to Home in the book style */
/* ------------------------- places and sessions -------------------------

/* Render the bar into its own node, outside #app. */

/* ---------------------------- navigation ----------------------------

    (sub ? '<span class="bs">' + esc(sub) + '</span>' : '') +
    '</span>' + (tail !== "" && tail != null ? '<span class="tail">' + esc(String(tail)) + '</span>' : '') + '</button>';
}

/* ============================ speech ============================ */
/* Uses the voice already installed on the device, so it works with no connection.
   The whole point is European Portuguese, so a pt-BR voice is treated as a
   fallback and flagged rather than passed off as the real thing. */
/* Pre-generated European Portuguese (Azure pt-PT Duarte, native pace).
   Files are matched by the exact text the generator spoke, so nothing at the
   call sites has to change — and anything not yet generated falls straight
   through to speechSynthesis. Slower speeds use playbackRate, which preserves
   pitch, so one file serves every speed. */
var Recorded = (function(){
  var byText = null, cur = null, manifest = null;

  function norm(t){
    return String(t).replace(/\s*\/\s*/g, ", ").replace(/…/g, ", ")
      .replace(/\[[^\]]*\]/g, "").replace(/\s+/g, " ").trim();
  }
  function index(){
    if (byText || !manifest) return;
    byText = {};
    var w = {}; (manifest.words || []).forEach(function(i){ w[i] = 1; });
    (typeof WORDS !== "undefined" ? WORDS : []).forEach(function(c){
      if (w[c.i]) byText[norm(c.p)] = "audio/w/" + c.i + ".mp3";
    });
    // Conjugation and grammar drills, keyed by position in the manifest array.
    (manifest.drills || []).forEach(function(t, i){
      if (t) byText[norm(t)] = "audio/d/" + i + ".mp3";
    });
    // Individual words from the passages, so any tapped word can be heard.
    (manifest.passage || []).forEach(function(t, i){
      if (t) byText[norm(t)] = "audio/p/" + i + ".mp3";
    });
    // The "Numa frase" example on each card.
    (manifest.examples || []).forEach(function(t, i){
      if (t) byText[norm(t)] = "audio/x/" + i + ".mp3";
    });
    var r = {}; (manifest.readings || []).forEach(function(k){ r[k] = 1; });
    (typeof READINGS !== "undefined" ? READINGS : []).forEach(function(p){
      (p.lines || []).forEach(function(l, i){
        var k = p.id + "__" + i;
        if (r[k]) byText[norm(l.pt)] = "audio/r/" + k + ".mp3";
      });
    });
  }
  /* Warming now means only "pull the bytes into cache". Playback happens on a
     single shared element (see play), so extra Audio objects would add iOS
     media-element pressure for no gain — that churn is what we think caused
     the occasional multi-second stall. */
  var warmed = {};
  function warm(text){ warmSrc(lookup(text)); }
  function warmSrc(src){
    if (!src || warmed[src]) return;
    warmed[src] = 1;
    try { fetch(src).catch(function(){ delete warmed[src]; }); }
    catch(e){ delete warmed[src]; }
  }

  function speedFor(){
    var s = (S && S.set) ? S.set.rate : "steady";
    return s === "slow" ? 0.7 : (s === "natural" ? 1 : 0.85);
  }
  /* Returns true once it has taken responsibility for speaking. If the clip
     then fails — offline with that file uncached, or autoplay blocked — it
     calls onFail so the device synth still gets a turn, rather than the word
     silently doing nothing. */
  /* Exact match first, then lower-cased: passage words are stored lower case,
     but a tapped token is often capitalised ("Oeiras", "Chama"). */
  function lookup(text){
    index();
    if (!byText) return null;
    var k = norm(text);
    return byText[k] || byText[k.toLowerCase()] || null;
  }
  /* ONE element for every clip, for the life of the page.
     iOS activates the audio session per media element, and that activation can
     stall for seconds — which is why five taps were instant and the sixth took
     7.5s with identical cache, warmth and rate. A single element is activated
     once and stays activated; swapping .src costs nothing.
     The warm pool still exists, but only to pull bytes into cache. */
  var player = null, playToken = 0;
  function getPlayer(){
    if (!player) {
      player = new Audio();
      player.preload = "auto";
    }
    return player;
  }
  function play(text, btn, onFail, onStart){
    var src = lookup(text);
    if (!src) return false;
    try {
      var a = getPlayer();
      var token = ++playToken;            // ignore events from a previous clip
      var handed = false;
      var wasWarm = !!warmed[src];
      if (onStart) onStart.detail = { warm: wasWarm, rate: speedFor() };

      try { a.pause(); } catch(e){}
      if (a.src !== new URL(src, location.href).href) a.src = src;
      else { try { a.currentTime = 0; } catch(e){} }

      if (btn) btn.classList.add("busy");
      function done(){ if (token === playToken && btn) btn.classList.remove("busy"); }
      function fail(){
        if (handed || token !== playToken) return;
        handed = true; done();
        if (onFail) onFail();
      }
      a.onended = done;
      a.onerror = fail;
      // Rate applied once sound exists, so a lazy time-stretcher can never
      // delay the first sample.
      var wantRate = speedFor();
      a.playbackRate = 1;
      if ("preservesPitch" in a) a.preservesPitch = true;
      a.webkitPreservesPitch = true;
      a.onplaying = function(){
        if (token !== playToken) return;
        if (onStart) onStart();
        if (wantRate !== 1) { try { a.playbackRate = wantRate; } catch(e){} }
      };
      var p = a.play();
      if (p && p.catch) p.catch(fail);
      cur = a;
      return true;
    } catch(e){ return false; }
  }
  fetch("audio/manifest.json?v=68")
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(m){
      if (!m) return;
      manifest = m; byText = null;
      // The home plan asks whether recordings exist. If the manifest lands
      // after that first render, redraw — otherwise Ditado silently goes
      // missing from the plan until the next navigation.
      try {
        if (app && app.getAttribute("data-screen") === "home") renderHome();
      } catch(e){}
    })
    .catch(function(){});

  return {
    play: play,
    srcFor: lookup,
    /* Pull a clip into the cache before it's needed. Playing a clip for the
       first time otherwise costs a network round trip, which on a phone is a
       very noticeable pause before anything is heard. */
    /* Pull a clip into the HTTP/service-worker cache. Cheap, but only half the
       job: a cached clip still has to be decoded before it makes a sound. */
    prefetch: function(text){
      var src = lookup(text);
      if (!src) return;
      try { fetch(src).catch(function(){}); } catch(e){}
    },
    /* Fully prepare a clip — fetched AND decoded — so play() is instant.
       This is what actually removes the pause; prefetch alone doesn't. */
    warm: warm,
    /* Same, but for a src we already resolved (read-along works in srcs). */
    warmSrc: warmSrc,
    /* Play an already-resolved src through the shared player. */
    playSrc: function(src, onEnd, onError){
      var a = getPlayer(), token = ++playToken;
      try { a.pause(); } catch(e){}
      a.src = src;
      a.playbackRate = 1;
      if ("preservesPitch" in a) a.preservesPitch = true;
      a.webkitPreservesPitch = true;
      var want = speedFor();
      a.onplaying = function(){ if (token === playToken && want !== 1) { try { a.playbackRate = want; } catch(e){} } };
      a.onended = function(){ if (token === playToken && onEnd) onEnd(); };
      a.onerror = function(){ if (token === playToken && onError) onError(); };
      var p = a.play();
      if (p && p.catch) p.catch(function(){ if (token === playToken && onError) onError(); });
      return a;
    },
    allSources: function(){
      if (!manifest) return [];
      var out = [];
      (manifest.words || []).forEach(function(i){ out.push("audio/w/" + i + ".mp3"); });
      (manifest.readings || []).forEach(function(k){ out.push("audio/r/" + k + ".mp3"); });
      (manifest.drills || []).forEach(function(t, i){ if (t) out.push("audio/d/" + i + ".mp3"); });
      (manifest.passage || []).forEach(function(t, i){ if (t) out.push("audio/p/" + i + ".mp3"); });
      (manifest.examples || []).forEach(function(t, i){ if (t) out.push("audio/x/" + i + ".mp3"); });
      return out;
    },
    speed: speedFor,
    ready: function(){ index(); return !!(byText && Object.keys(byText).length); },
    count: function(){ index(); return byText ? Object.keys(byText).length : 0; },
    voice: function(){ return manifest ? manifest.voice : null; },
    bytes: function(){ return manifest && manifest.bytes ? manifest.bytes : 0; },
    sizeLabel: function(){
      var b = manifest && manifest.bytes;
      return b ? " — about " + Math.round(b / 1048576) + " MB" : "";
    }
  };
})();

/* Pronunciation assessment — say a word, hear how close you were.
   The Azure key never reaches the browser: a Supabase Edge Function mints a
   10-minute authorization token, and the SDK (454KB) is fetched only when you
   first use the feature rather than loaded on every visit. */
var Pronounce = (function(){
  var sdkLoading = null, tok = null, tokAt = 0;

  /* Diagnostics. Speech failures are invisible from the outside — you can't
     tell "no permission" from "no audio reaching the service" from "the
     service heard nothing" without seeing the events. Kept in memory only. */
  var LOG = [], t0 = 0;
  function log(msg){
    if (!t0) t0 = Date.now();
    LOG.push(((Date.now() - t0) / 1000).toFixed(2).padStart(5) + "s  " + msg);
    if (LOG.length > 60) LOG.shift();
    var el = document.getElementById("speakLog");
    if (el) el.textContent = LOG.join("\n");
  }
  function resetLog(){ LOG = []; t0 = 0; log("--- new attempt ---"); }

  function available(){
    return !!(window.MilSync && window.MilSync.signedIn && window.MilSync.signedIn() &&
      navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
  }

  function loadSDK(){
    if (window.SpeechSDK) return Promise.resolve(window.SpeechSDK);
    if (sdkLoading) return sdkLoading;
    sdkLoading = new Promise(function(res, rej){
      var s = document.createElement("script");
      s.src = "vendor/speech-sdk.js";
      s.onload = function(){ log("sdk loaded"); window.SpeechSDK ? res(window.SpeechSDK) : rej(new Error("SDK did not initialise")); };
      s.onerror = function(){ log("sdk FAILED to load"); sdkLoading = null; rej(new Error("Could not load the speech engine")); };
      document.head.appendChild(s);
    });
    return sdkLoading;
  }

  function token(){
    if (tok && Date.now() - tokAt < 540000) return Promise.resolve(tok);
    return window.MilSync.invoke("speech-token").then(function(r){
      if (r.error) {
        /* supabase-js reports every non-2xx as the same generic error, so its
           message says nothing useful. The function's own explanation is in the
           Response it carries — read that, or we end up blaming the wrong thing. */
        var ctx = r.error.context;
        if (ctx && typeof ctx.json === "function") {
          return ctx.json().then(function(body){
            throw new Error((body && body.error ? body.error : "request failed") + " [" + ctx.status + "]");
          }, function(){
            throw new Error("request failed [" + (ctx.status || "?") + "]");
          });

        throw new Error(r.error.message || "token request failed");
      }
      var d = r.data;
      if (!d || !d.token) throw new Error(d && d.error ? d.error : "no token returned");

    });

     screen opens means the hardware is already awake by the time someone taps
     record, instead of swallowing the first half of a one-second word. */
  /* Ask for permission once, then release the device immediately. Holding a
     stream open here competed with the SDK's own capture: the first attempt
     worked and every one after it got silence. Exactly one thing may own the
     microphone, and that thing is the recogniser. */
  var permissionAsked = false;

      .then(function(s){

        log("mic permission ok" + (tr ? " · " + (tr.label || "unnamed device") : " · no track!"));

     recognizeOnce, because that one decides for itself when you've finished —
     which means waiting out a silence timeout on every single word.

  var activeRec = null;

    // the device is what made every attempt after the first hear nothing.

      .then(function(r){ return new Promise(function(go){ setTimeout(function(){ go(r); }, 150); }); })

        reference,
        SDK.PronunciationAssessmentGradingSystem.HundredMark,
        SDK.PronunciationAssessmentGranularity.Phoneme,

      rec.sessionStarted = function(){ log("sessionStarted (mic open)"); if (onListening) onListening(false); };
      rec.speechStartDetected = function(){ log("speechStartDetected (audio arriving)"); if (onListening) onListening(true); };
      rec.speechEndDetected = function(){ log("speechEndDetected"); };

      // reaching the service, whatever the microphone says it is doing.

      }

      return new Promise(function(ready, fail){
        log("starting recogniser…");
        rec.startContinuousRecognitionAsync(function(){
          log("recogniser started");
          ready({
            stop: function(){
              return new Promise(function(resolve, reject){
                log("stop requested");
                rec.stopContinuousRecognitionAsync(function(){
                  // The final segment is recognised as the stream closes; give
                  // that event a moment to land before deciding we heard nothing.
                  setTimeout(function(){
                    shutdown();
                    log(best ? "result: overall " + Math.round(best.overall || 0) : "no result to score");
                    best ? resolve(best) : reject(new Error("didn't catch that"));
                  }, 400);
                }, function(err){ shutdown(); reject(new Error(String(err))); });
              });
            },
            cancel: shutdown
          });
        }, function(err){ shutdown(); fail(new Error(String(err))); });

  /* Kept for anything that wants the old fire-and-forget behaviour. */
  function assess(reference, onListening){
    return Promise.all([loadSDK(), token(), warmMic()]).then(function(r){
      var SDK = r[0], t = r[1];
      var cfg = SDK.SpeechConfig.fromAuthorizationToken(t.token, t.region);
      cfg.speechRecognitionLanguage = "pt-PT";
      // Defaults are tuned for dictation, not for someone reading one word off
      // a card: give them time to start, and don't cut the word off at the end.
      cfg.setProperty(SDK.PropertyId.SpeechServiceConnection_InitialSilenceTimeoutMs, "12000");
      cfg.setProperty(SDK.PropertyId.SpeechServiceConnection_EndSilenceTimeoutMs, "1500");
      var pa = new SDK.PronunciationAssessmentConfig(
        reference,
        SDK.PronunciationAssessmentGradingSystem.HundredMark,
        SDK.PronunciationAssessmentGranularity.Phoneme,
        true                                  // enable miscue: catches skipped words
      );

      var rec = new SDK.SpeechRecognizer(cfg, audio);

      return new Promise(function(resolve, reject){
        pa.applyTo(rec);
        var settled = false;
        function done(fn, arg){ if (settled) return; settled = true; try { rec.close(); } catch(e){} fn(arg); }

        // Don't say "speak now" until the service actually says it's listening.
        if (onListening){
          rec.sessionStarted = function(){ onListening(); };
          rec.speechStartDetected = function(){ onListening(true); };
        }

        rec.recognizeOnceAsync(function(result){
          if (!result || result.reason === SDK.ResultReason.NoMatch) {
            return done(reject, new Error("Não te ouvi · didn't catch that"));
          }
          try {
            var pr = SDK.PronunciationAssessmentResult.fromResult(result);
            done(resolve, {
              text: result.text || "",
              accuracy: pr.accuracyScore,
              fluency: pr.fluencyScore,
              completeness: pr.completenessScore,
              overall: pr.pronunciationScore,
              // detailResult carries per-word ErrorType and per-phoneme scores —
              // that detail is what turns a number into actual feedback.
              words: (pr.detailResult && pr.detailResult.Words) || []
            });
          } catch(e){ done(reject, new Error("Não consegui avaliar · couldn't score that")); }
        }, function(err){
          done(reject, new Error(String(err || "recognition failed")));
        });

    });

     permission prompt out of the way before the first attempt. */
  function prepare(){

  }
  return { available: available, start: start, assess: assess, prepare: prepare, release: release,
    logText: function(){ return LOG.join("\n"); } };
})();

/* Bulk download of the recorded audio, so the app is genuinely usable with no
   signal. Writes into the same durable cache the service worker reads from
   (AUDIO_CACHE in sw.js), so clips pulled down here are the very ones served
   later, and an app update never touches them. */
var AudioStore = (function(){
  var CACHE = "mil-palavras-audio-v1";
  var running = false, abort = false;

  function ok(){ return !!(window.caches && Recorded.allSources().length); }

  function status(){
    if (!ok()) return Promise.resolve({ total:0, have:0 });
    var all = Recorded.allSources();
    return caches.open(CACHE).then(function(c){ return c.keys(); }).then(function(keys){
      var have = {};
      keys.forEach(function(rq){ have[new URL(rq.url).pathname.replace(/^.*\/audio\//, "audio/")] = 1; });
      var n = 0;
      all.forEach(function(u){ if (have[u]) n++; });
      return { total: all.length, have: n };
    }).catch(function(){ return { total: all.length, have: 0 }; });
  }

  /* A hung request is the enemy here. We already know a clip can stall for
     eight seconds; one that never settles takes its lane down permanently, and
     when every lane is stuck the download simply stops — which is exactly what
     "gets so far and freezes" looks like. Every fetch is now on a leash. */
  function fetchClip(url, ms){
    if (!window.AbortController) return fetch(url, { cache: "no-store" });
    var ctl = new AbortController();
    var timer = setTimeout(function(){ try { ctl.abort(); } catch(e){} }, ms);
    return fetch(url, { cache: "no-store", signal: ctl.signal }).then(
      function(r){ clearTimeout(timer); return r; },
      function(e){ clearTimeout(timer); throw e; }
    );
  }

  function downloadAll(onProgress){
    if (running) return Promise.resolve();
    running = true; abort = false;
    var all = Recorded.allSources(), done = 0, failed = 0, fails = [];

    // Ask the browser not to evict this — otherwise a big download can vanish.
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e){}

    return caches.open(CACHE).then(function(cache){
      return cache.keys().then(function(keys){
        var have = {};
        keys.forEach(function(rq){ have[new URL(rq.url).pathname.replace(/^.*\/audio\//, "audio/")] = 1; });
        var todo = all.filter(function(u){ return !have[u]; });
        done = all.length - todo.length;
        onProgress({ done:done, total:all.length, failed:0 });

        var i = 0, LANES = 4;

        function runList(list, timeout){
          var j = 0;
          function worker(){
            return new Promise(function(resolve){
              function next(){
                if (abort || j >= list.length) return resolve();
                var url = list[j++];
                fetchClip(url, timeout)
                  .then(function(res){
                    if (!res || !res.ok) throw new Error("http " + (res && res.status));
                    return cache.put(url, res);
                  })
                  .then(function(){ done++; }, function(e){
                    failed++; fails.push(url);
                    // Out of space is fatal for the whole run — stop and report.
                    if (e && /quota|space/i.test(String(e.name) + String(e.message))) abort = true;
                  })
                  .then(function(){
                    onProgress({ done:done, total:all.length, failed:failed });
                    // Yield between items: a 1,400-deep promise chain per lane
                    // grew memory until the tab gave up.
                    setTimeout(next, 0);
                  });
              }
              next();
            });
          }
          var lanes = [];
          for (var L = 0; L < LANES; L++) lanes.push(worker());
          return Promise.all(lanes);
        }

        return runList(todo, 20000).then(function(){
          // One patient retry for whatever timed out — a stalled clip usually
          // succeeds second time, and leaving gaps defeats the whole point.
          if (abort || !fails.length) return;
          var retry = fails.slice();
          fails = []; failed = 0;
          done -= retry.length;
          onProgress({ done:done, total:all.length, failed:0 });
          return runList(retry, 30000);
        });
      });
    }).then(function(){
      running = false;
      return { done:done, failed:failed, aborted:abort, fails:fails.length };
    }).catch(function(e){
      running = false;
      return { done:done, failed:failed, aborted:true, error:e && (e.message || String(e)) };
    });
  }

  return {
    ok: ok,
    status: status,
    downloadAll: downloadAll,
    stop: function(){ abort = true; },
    running: function(){ return running; },
    remove: function(){ return caches.delete(CACHE); }
  };
})();

/* Reads a passage line by line, highlighting each as it is spoken. Only offered
   when every line of that passage has a recorded clip — a story that stops
   halfway, or lurches into a robot voice mid-sentence, is worse than no button
   at all. */

  function clips(r){
    if (!r || !r.lines || !Recorded.ready()) return null;
    var out = [];
    for (var i=0;i<r.lines.length;i++){
      var src = Recorded.srcFor(r.lines[i].pt);
      if (!src) return null;              // all or nothing
      out.push(src);
    }
    return out;
  }
  function available(r){ return !!clips(r); }

  function stop(){
    if (audio){ try { audio.pause(); } catch(e){} audio = null; }
    playing = null;
    var b = app.querySelector("[data-listen]"); if (b) b.classList.remove("on");
    var n = app.querySelectorAll(".rline.reading");
    for (var i=0;i<n.length;i++) n[i].classList.remove("reading");
  }
  function start(r){
    var srcs = clips(r);
    if (!srcs) return;
    stop();

var CONJ = DATA.conj, WHY = DATA.why, STEMSHIFT = DATA.stem, EXS = DATA.ex, NOTES = DATA.notes;

var PRES = { ar:["o","as","a","amos","am"], er:["o","es","e","emos","em"], ir:["o","es","e","imos","em"] };

/* Some drill answers are notation rather than language: contraction formulas
   ("a + os") and bare endings ("-am"). tools/audio/drills.mjs excludes exactly
   these from the recordings, so asking for them found no clip and fell through
   to the device voice, which reads "a + os" aloud as "a plus os". The app has
   to know the same rule the recorder knows. */

  t = String(t == null ? "" : t).replace(/\([^)]*\)/g, "").trim();
  return !!t && !/^-/.test(t) && t.indexOf("+") < 0;

function bareVerb(p){ return p.replace(/-se$/,""); }

  if (group !== "ar" || i !== 0) return stem;
  if (/c$/.test(stem)) return stem.slice(0,-1) + "qu";   // ficar → fiquei
  if (/g$/.test(stem)) return stem.slice(0,-1) + "gu";   // chegar → cheguei

  var stem = group ? v.slice(0,-2) : null;
  var out = { group:group, regular:!explicit, pres:null, pret:null, presReg:true, pretReg:true };

  if (explicit && explicit.p) { out.pres = explicit.p; out.presReg = false; }
  else if (group) out.pres = PRES[group].map(function(e){ return stem + e; });

  if (explicit && explicit.t) { out.pret = explicit.t; out.pretReg = false; }

/* ============================ every tense ============================
   Twelve tenses looks like twelve tables to memorise. It isn't. Portuguese
   builds almost all of them from three principal parts, and the drills are
   built to teach that rather than the tables:

     • the infinitive  → futuro, condicional, infinitivo pessoal
     • the eu form     → conjuntivo presente, and the imperative from that
     • the eles past   → conjuntivo imperfeito, conjuntivo futuro, mais-que-perfeito

   three future stems, four imperfects, seven present subjunctives and a list
   of participles. Everything else falls out of the three parts above, which is
   also why adding these tenses did not need a second irregular-verb dataset. */

var FUT_E    = ["ei","ás","á","emos","ão"];

var MQP_E    = ["ra","ras","ra","ramos","ram"];

  "ser":  ["era","eras","era","éramos","eram"],
  "ter":  ["tinha","tinhas","tinha","tínhamos","tinham"],
  "vir":  ["vinha","vinhas","vinha","vínhamos","vinham"],

  "ser":   ["seja","sejas","seja","sejamos","sejam"],

  "saber": ["saiba","saibas","saiba","saibamos","saibam"],
  "querer":["queira","queiras","queira","queiramos","queiram"],

  "pôr":  ["compor","propor","dispor","supor","impor","expor","repor","depor","opor","transpor"],

  var hiatus = group === "ir" && stem && /[aeiou]$/.test(stem) && !/[gq]u$/.test(stem);
  var is = infStem(v);

/* Full paradigm. Returns { group, reg:{id:bool}, f:{id:[forms]} }, with a
   tense simply absent when it cannot be built (haver has no plural past, so it
   has no imperfect subjunctive either). */
function conjugateAll(word){
  var v = bareVerb(word);
  var base = conjugate(v);
  var group = base.group, stem = group ? v.slice(0,-2) : null;
  var out = { group:group, v:v, f:{}, reg:{} };
  function put(id, forms, regular){
    if (!forms) return;
    if (typeof forms !== "string" && forms.some(function(f){ return !f || f === "—"; })) {
      /* a defective verb: keep the cells it does have, drop the rest */
      forms = forms.map(function(f){ return (!f || f === "—") ? null : f; });
      if (!forms.some(Boolean)) return;
    }
    out.f[id] = forms; out.reg[id] = !!regular;
  }

  put("p", base.pres, base.presReg);
  put("t", base.pret, base.pretReg);

  /* imperfeito — four exceptions, then a single ending set */
  var impf = irrForms(IMPF_IRR, v);
  if (impf) put("im", impf, false);
  else if (group) put("im", IMPF_E[group].map(function(e){ return stem + e; }), true);

  /* futuro and condicional — same stem, always the infinitive bar three verbs */
  var fs = futStem(v), fReg = (fs === infStem(v));
  put("fu", FUT_E.map(function(e){ return fs + e; }), fReg);
  put("co", COND_E.map(function(e){ return fs + e; }), fReg);

  /* infinitivo pessoal — no irregulars at all, in any verb */
  put("ip", infpForms(v, group, stem), true);

  /* conjuntivo presente — from the eu form, bar seven */
  var subp = irrForms(SUBP_IRR, v), subpReg = false;
  if (!subp && group === "ar") { subp = SUBP_E.ar.map(function(e){ return subpStem(stem) + e; }); subpReg = true; }
  else if (!subp && base.pres && /o$/.test(base.pres[0])) {
    var es = base.pres[0].slice(0,-1);
    subp = SUBP_E[group || "er"].map(function(e){ return es + e; });
    subpReg = base.presReg;
  }
  put("sp", subp, subpReg);

  /* the eles-past stem carries three more tenses */
  var eles = base.pret && base.pret[4];
  if (eles && eles !== "—") {
    var ps = eles.replace(/ram$/, "");                       /* fala- fize- fo- */
    var acc = stressStem(ps, v, group);
    put("si", SUBI_E.map(function(e, i){ return (i === 3 ? acc : ps) + e; }), base.pretReg);
    put("mq", MQP_E.map(function(e, i){ return (i === 3 ? acc : ps) + e; }), base.pretReg);
    /* futuro do conjuntivo. Where the past stem is the infinitive in disguise
       this tense simply is the personal infinitive, so take it from there —
       deriving it from the past would carry across an accent that only belongs
       to the past (saíram gives saír, but the tense is sair). A genuinely
       strong stem — fizer-, tiver-, for-, der-, vir- — has no such accent and
       is used directly. Note that this is not the same test as pretReg: sair
       is listed as irregular yet its past stem is regularly shaped. */
    var sfStem = eles.replace(/am$/, "");
    if (deaccent(sfStem) === deaccent(infStem(v))) put("sf", out.f.ip ? out.f.ip.slice() : null, true);
    else put("sf", INFP_E.map(function(e){ return sfStem + e; }), false);
  }

  /* imperativo — tu is the third person present, everything else is the
     subjunctive, and the negative is always the subjunctive */
  if (base.pres && subp) {
    var tuAff = (v === "ser") ? "sê" : base.pres[2];
    put("mp", [tuAff, "não " + subp[1], subp[2], subp[4]], base.presReg && subpReg);
  }

  /* particípio */
  var part = irrForms(PART_IRR, v);
  if (part) put("pp", part, false);
  /* A participle in -ido takes the hiatus accent when the stem ends in a
     vowel: sair → saído, cair → caído, construir → construído, possuir →
     possuído. Without it the app was teaching "saido", which is simply
     misspelt — the i is a syllable of its own and must carry the accent. */
  else if (group) put("pp", stem + (group === "ar" ? "ado"
    : (/[aeou]$/.test(stem) ? "ído" : "ido")), true);

  return out;
}

/* ---- noun morphology ---- */
function pluralOf(w){
  if (/ão$/.test(w))  return w.slice(0,-2) + "ões";
  if (/m$/.test(w))   return w.slice(0,-1) + "ns";
  if (/vel$/.test(w)) return w.slice(0,-3) + "veis";
  if (/al$/.test(w))  return w.slice(0,-2) + "ais";
  if (/el$/.test(w))  return w.slice(0,-2) + "éis";
  if (/ol$/.test(w))  return w.slice(0,-2) + "óis";
  if (/ul$/.test(w))  return w.slice(0,-2) + "uis";
  if (/il$/.test(w))  return w.slice(0,-2) + "is";
  if (/ês$/.test(w))  return w.slice(0,-2) + "eses";
  if (/[sxz]$/.test(w)) return w + "es";
  if (/r$/.test(w))   return w + "es";
  if (/n$/.test(w))   return w + "es";
  return w + "s";
}
function pluralRule(w){
  if (/ão$/.test(w))  return "ends in <em>-ão</em>, so the plural is normally <em>-ões</em> — but this is the one ending with real exceptions (<em>-ãos</em>, <em>-ães</em>)";
  if (/m$/.test(w))   return "ends in <em>-m</em>, which becomes <em>-ns</em> in the plural";
  if (/vel$/.test(w)) return "ends in <em>-vel</em>, which becomes <em>-veis</em>";
  if (/l$/.test(w))   return "ends in <em>-l</em>, which is replaced by <em>-is</em>";
  if (/[sxzrn]$/.test(w)) return "ends in a consonant, so the plural adds <em>-es</em>";
  return "ends in a vowel, so the plural just adds <em>-s</em>";
}
/* the deck flags real exceptions in the English side: "[pl. as mãos]" */
function statedPlural(en){
  var m = /\[pl\.\s*([^\]]+)\]/.exec(en);
  return m ? m[1].trim() : null;
}

/* ---- adjective morphology ---- */
var ADJ_IRREG = { "bom":"boa", "mau":"má" };
var ADV_IRREG = { "bom":"bem", "mau":"mal" };
var DEACCENT = { "á":"a","é":"e","í":"i","ó":"o","ú":"u","â":"a","ê":"e","ô":"o" };
function feminineOf(w){
  if (ADJ_IRREG[w]) return ADJ_IRREG[w];
  if (/o$/.test(w))   return w.slice(0,-1) + "a";
  if (/dor$/.test(w)) return w + "a";
  if (/ês$/.test(w))  return w.slice(0,-2) + "esa";
  if (/eu$/.test(w))  return w.slice(0,-2) + "eia";
  return w;
}
function adverbOf(w){
  if (ADV_IRREG[w]) return ADV_IRREG[w];
  // adding -mente moves the stress, so the original acute/circumflex is dropped
  var f = feminineOf(w).replace(/[áéíóúâêô]/g, function(x){ return DEACCENT[x]; });
  return f + "mente";
}

/* What this tense is for. Knowing when to reach for the imperfect matters more

var TUSE = {

  t:  "A finished action at a definite moment — <em>ontem falei com ela</em>.",
  im: "The background of a past scene: what used to happen, what was going on, what things were like. <em>Falava</em> = <em>I used to speak</em> or <em>I was speaking</em>. Pair it with the pretérito, which supplies the events that interrupt it.",

  sp: "After anything that is a wish, a doubt, an emotion or a command aimed at someone else: <em>quero que fales</em>, <em>talvez fale</em>, <em>é possível que fale</em>. The trigger sits in the other half of the sentence.",

function conjWhy(v, cj, tid, irr){
  var g = cj.group, bits = [];
  if (tid === "p") {
    if (!irr && g) bits.push("Regular <em>-" + g + "</em> verb: drop the <em>-" + g +
      "</em> and add <em>" + PRES[g].join(" / ") + "</em>. That is the whole rule for this tense.");
    else {
      bits.push("Irregular in the present — this form has to be learned as a shape, not derived.");
      var w = whyIrregular(v); if (w) bits.push(w);
    }
  } else if (tid === "t") {
    if (!irr && g) bits.push("Regular past (<em>pretérito perfeito</em>): <em>" + PRET[g].join(" / ") + "</em>." +
      (g === "ar" ? " The accent on <em>-ámos</em> is what separates past from present in Portugal." : ""));
    else bits.push("Irregular past. The stems (<em>fiz-, disse-, tive-, pus-</em> and friends) are shared across the commonest verbs, so learning one helps with the rest.");
  } else if (tid === "im") {
    if (!irr && g) bits.push("The most regular tense in the language: <em>-" + g + "</em> verbs take <em>" +
      IMPF_E[g].join(" / ") + "</em>, with no exceptions to worry about here.");
    else bits.push("One of only four irregular imperfects in the whole language — <em>era, tinha, vinha, punha</em>. Everything else is regular, so this is a short list worth simply memorising.");
  } else if (tid === "fu" || tid === "co") {
    var endings = (tid === "fu" ? FUT_E : COND_E).join(" / ");
    if (!irr) bits.push("Built on the <b>whole infinitive</b>, not a stem: <em>" + esc(infStem(v)) + "</em> + <em>" +
      endings + "</em>. Nothing is dropped, which makes this the easiest tense in Portuguese.");
    else bits.push("One of the only three verbs with an irregular future stem — <em>dizer → dir-, fazer → far-, trazer → trar-</em>. The conditional always uses that same stem, so learning it once covers both tenses.");
  } else if (tid === "sp") {
    if (irr) bits.push("One of the seven subjunctives the <em>eu</em> form does not predict: <em>seja, esteja, vá, dê, saiba, queira, haja</em>. Learn those seven and the rest of the language follows the rule below.");
    else if (g === "ar") bits.push("Take the <em>eu</em> form, drop the <em>-o</em>, and swap the vowel: an <em>-ar</em> verb takes <em>e</em> endings. The spelling follows the sound, so <em>ficar</em> gives <em>fique</em>, not <em>fice</em>.");
    else bits.push("Take the <em>eu</em> form of the present, drop the <em>-o</em>, add <em>a / as / a / amos / am</em>. That is why <em>faço</em> gives <em>faça</em> and <em>venho</em> gives <em>venha</em> — the irregularity is already paid for.");
  } else if (tid === "si" || tid === "mq") {
    bits.push("From the <em>eles</em> past, minus <em>-ram</em>: <em>" + esc((cj.pret && cj.pret[4]) || "") +
      "</em> → <em>" + esc(((cj.pret && cj.pret[4]) || "").replace(/ram$/, "")) + "-</em>, then <em>" +
      (tid === "si" ? SUBI_E.join(" / ") : MQP_E.join(" / ")) +
      "</em>. Every irregularity you already learned in the past comes along for free.");
  } else if (tid === "sf") {
    if (!irr) bits.push("For a verb with a regular past, this is identical to the infinitive with personal endings — <em>" +
      esc(infStem(v)) + " / " + esc(infStem(v)) + "es / " + esc(infStem(v)) + "mos / " + esc(infStem(v)) + "em</em>. Two tenses for the price of one.");
    else bits.push("From the <em>eles</em> past minus <em>-am</em>: <em>" + esc((cj.pret && cj.pret[4]) || "") +
      "</em> → <em>" + esc(((cj.pret && cj.pret[4]) || "").replace(/am$/, "")) +
      "</em>. This is where the strong past stems earn their keep a second time.");
  } else if (tid === "ip") {
    bits.push("The infinitive itself, plus <em>-es / -mos / -em</em> for the persons that need marking. <em>eu</em> and <em>ele</em> add nothing at all, so two of the five cells are just the dictionary form.");
  } else if (tid === "mp") {
    bits.push("<em>tu</em> borrows the <em>ele</em> form of the present (<em>" + esc((cj.pres && cj.pres[2]) || "") +
      "</em>), and <em>você</em> and <em>vocês</em> borrow the subjunctive. The negative always uses the subjunctive, which is why the <em>tu</em> form changes shape the moment you put <em>não</em> in front of it.");
  } else if (tid === "pp") {
    if (irr) bits.push("Irregular participle — it has to be learned with the verb. Portugal writes <em>aceite</em>, not <em>aceito</em>.");
    else bits.push("Regular: <em>-ar</em> verbs give <em>-ado</em>, <em>-er</em> and <em>-ir</em> verbs give <em>-ido</em>. It does not change for person, only for gender and number when it acts as an adjective.");
  }

/* Reflexive pronoun placement, which is tense-dependent and one of the things
   that most obviously separates European from Brazilian Portuguese. */
var CLITIC_BARE = ["me","te","se","nos","se"];
var IMP_CLITIC  = ["te","te","se","se"];
var REFLEX_WHY = {
  enc: "Reflexive: the pronoun hooks onto the end with a hyphen, and <em>nós</em> drops its final <em>-s</em> before <em>-nos</em>. Put a negative or a question word in front and the pronoun jumps ahead of the verb instead.",
  pro: "Reflexive: here the pronoun goes <b>in front</b>. The subjunctive is always introduced by something — <em>que</em>, <em>se</em>, <em>quando</em> — and that word pulls the pronoun forward with it.",
  mes: "Reflexive, and this is the one that startles people: in the future and conditional the pronoun goes <b>inside</b> the verb, between the infinitive and the ending. Portugal still writes <em>lavar-me-ei</em>; Brazil never does. In speech you will more often hear <em>vou lavar-me</em>.",
  imp: "Reflexive: a command hooks the pronoun on with a hyphen (<em>deita-te</em>), but the negative sends it in front (<em>não te deites</em>).",
  none: "The participle takes no pronoun — it belongs to <em>ter</em>, which carries it instead."
};
function placeClitic(t, form, i, cj){
  if (!form) return form;
  if (t.clitic === "none") return form;
  if (t.clitic === "pro") return CLITIC_BARE[i] + " " + form;
  if (t.clitic === "mes") {
    /* mesoclisis: the pronoun goes inside the word, between the infinitive and
       the ending — lavar-me-ei. Portugal still writes this; Brazil never does. */
    var endings = (t.id === "fu" ? FUT_E : COND_E);
    return futStem(cj.v) + "-" + CLITIC_BARE[i] + "-" + endings[i];
  }
  if (t.clitic === "imp") {
    if (i === 1) return form.replace(/^não /, "não " + IMP_CLITIC[i] + " ");   /* não te deites */
    return form + "-" + IMP_CLITIC[i];
  }
  var base = (i === 3) ? form.replace(/s$/, "") : form;   /* nós loses its -s before -nos */
  return base + CLITIC[i];
}

(function buildConjugation(){
  var out = [];
  WORDS.forEach(function(c){
    if (c.c !== "verbo") return;
    var v = bareVerb(c.p), rfx = reflexive(c.p);
    var cj = conjugate(v);
    var all = conjugateAll(v);
    if (!cj.pres) return;
    TENSES.forEach(function(t){
      var raw = all.f[t.id];
      if (!raw) return;
      var irr = !all.reg[t.id];
      var people = t.people || PLABEL;
      var forms = t.single ? [raw]
                           : raw.map(function(f, i){ return rfx ? placeClitic(t, f, i, all) : f; });
      forms.forEach(function(f, i){
        if (!f) return;
        var others = [];
        forms.forEach(function(g, gi){
          if (!g || gi === i || g === f || others.indexOf(g) >= 0) return;
          others.push(g);
        });
        var who = t.single ? t.pt : ((t.cue ? t.cue + " " : "") + people[i]);
        out.push({
          /* "p" and "t" keep the ids they have always had, so every present and
             past card already in someone's schedule stays exactly where it is. */
          i: "c|" + c.p + "|" + t.id + "|" + i,
          k: 1, c: "conjugacao", v: v, w: c, rf: rfx ? 1 : 0,
          tn: t.id, lvl: t.lvl,
          s: t.lab + " · " + (irr ? "irregular" : "regular"),
          q: who,
          qs: v + " · " + t.en + " · " + c.e,
          e: v + " (" + c.e + ") — " + who + ", " + t.en,
          p: f,
          x: others,
          a: rfx ? [f, f.replace(/-/g, " ")] : [f],
          t: conjWhy(v, cj, t.id, irr) +
             (rfx ? " " + REFLEX_WHY[t.clitic] : ""),
          /* irregulars first, then up the ladder, with the nine verbs that
             carry the language pulled to the very front */
          rank: (irr ? 0 : 2) + t.lvl * 3 + TENSES.indexOf(t) +
                (BIGNINE.indexOf(v) >= 0 ? -20 : 0)
        });
      });
    });
  });
  out.sort(function(a, b){ return a.rank - b.rank; });
  DRILLS = DRILLS.concat(out);
})();

var GTOPIC = {
  "articles":"Articles",
  "contractions":"Preposition contractions",

   ["A casa ___ meu pai.","do","My father's house","de + o"],
   ["O livro está ___ mesa.","na","The book is on the table","em + a"],

/* ============================ verb mastery ============================
   "Do I know falar?" is two questions, and they are answered separately on
   purpose.

   The vocabulary card answers the first — what does falar mean — and that is
   the question the 990 counter on the home screen is counting. Conjugation is
   the second, and it is not one more fact but sixty: twelve tenses by five
   persons. Folding those into the word count is exactly what turns a 990-word
   deck into a 16,000-card one and makes the headline number meaningless, so
   the two never share a total.

   A verb is conjugated "to rung N" when the lemma is known and every cell of
   every tense up to N is known — the same 21-day bar used everywhere else,

   a percentage: you do not know the present of falar if falamos is the single
   cell you keep missing. */
var VERB_INDEX = null, VERB_LIST = null;
function verbIndex(){
  if (VERB_INDEX) return VERB_INDEX;

  CARDS.forEach(function(c){
    if (c.c !== "conjugacao") return;

  WORDS.forEach(function(c){
    if (c.c !== "verbo") return;
    var v = bareVerb(c.p);

function verbMastery(v){
  var cards = verbIndex()[v] || [];

  cards.forEach(function(c){ if (c.w && !seenL[c.w.i]) { seenL[c.w.i] = 1; lemmas.push(c.w); } });
  var lemmaKnown = lemmas.length > 0 && lemmas.every(function(w){ return !!known(w.i); });
  var lemmaStarted = lemmas.some(function(w){ return !!S.prog[w.i]; });

  var byTense = {}, total = 0, kn = 0, started = 0;
  cards.forEach(function(c){
    var b = byTense[c.tn] || (byTense[c.tn] = { total:0, known:0, started:0 });
    b.total++; total++;
    if (S.prog[c.i]) { b.started++; started++; }
    if (known(c.i)) { b.known++; kn++; }
  });
  /* A tense counts as done at 95% of its cells, not all of them. Requiring
     every cell meant a single lapsed "falas" — one bad day — demoted the whole
     verb and wiped its visible ladder, which is a noisy, discouraging signal
     for something the learner has demonstrably got. */

  var tenses = TENSES.filter(function(t){ return byTense[t.id]; }).map(function(t){

var GDRILL = {

  var topics = GDRILL[id] || [];

/* --------------------- the day's own passage ---------------------
   A short text written around the words the scheduler says are due, so
   revision stops being a list of isolated cards. Generated once a day and
   kept in state, so re-opening it costs nothing and it works offline after
   the first fetch. Always carries ai:true — it is machine-written and the
   app says so. */
function dailyLevel(){
  var known = deckProgress().known;
  return known < 80 ? "A1" : known < 250 ? "A2" : known < 550 ? "B1" : "B2";
}
/* Words due today, worst-remembered first, then anything recently started —
   a text about words you already know cold teaches nothing. */
function dailyWords(){
  var t = dayNo(), out = [];
  WORDS.forEach(function(c){
    var p = S.prog[c.i];
    if (!p) return;
    out.push({ p:c.p, due: p.d <= t, weak: (p.l || 0), iv: p.iv || 0 });
  });
  out.sort(function(a, b){
    if (a.due !== b.due) return a.due ? -1 : 1;
    if (b.weak !== a.weak) return b.weak - a.weak;
    return a.iv - b.iv;
  });
  return out.slice(0, 12).map(function(x){ return x.p; });
}

/* Call the passage writer, whatever slug it ended up deployed under.
   A 404 means "that name doesn't exist" — anything else is a real answer and
   must be returned as-is, so a missing key or a rejected passage still reports
   its own reason instead of being retried under another name. */
var DAILY_SLUGS = ["daily-text", "quick-endpoint"];
function invokeDailyText(body){
  var i = 0;
  function attempt(){
    return window.MilSync.invoke(DAILY_SLUGS[i], body).then(function(r){
      var status = r.error && r.error.context && r.error.context.status;
      if (status === 404 && i + 1 < DAILY_SLUGS.length) { i++; return attempt(); }
      return r;
    });
  }
  return attempt();
}
function dailyError(err){
  var m = String((err && err.message) || err || "");
  if (/not configured/i.test(m))
    return "Falta a chave no servidor. · The ANTHROPIC_API_KEY secret isn't set on the daily-text function.";
  if (/\[?404\]?|not found/i.test(m))
    return "A função daily-text não existe. · The daily-text function isn't deployed.";
  if (/Rejected:/i.test(m))
    // Say which check failed. "It failed a check" sends you hunting; naming the
    // marker tells us in one glance whether the writer slipped or the checker
    // is wrong — that distinction has cost us hours before.
    return "Recusado · rejected — " + m.replace(/^Rejected:\s*/i, "") +
      ". Tenta outra vez · try again.";
  if (/malformed/i.test(m))
    return "A resposta veio estragada — tenta outra vez. · The response came back malformed. Try again.";
  return m || "Algo correu mal · something went wrong";
}
/* Drop a generated passage into the normal reading screen, so it gets the same
