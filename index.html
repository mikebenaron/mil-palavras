<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<!-- No maximum-scale: locking zoom fails WCAG 1.4.4 and is indefensible in an
     app for adult learners reading small Portuguese type. -->
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F6F0E4">
<title>Mil Palavras — European Portuguese</title>

<link rel="manifest" href="manifest.webmanifest">

<meta name="apple-mobile-web-app-title" content="Mil Palavras">
<style>
/* ============================================================
   Mil Palavras — "Reading Room" design system
   A bilingual language book: ivory paper, Newsreader serif for the
   language, Karla for chrome, IBM Plex Mono for data. Radius 0,
   rules and inset shadows instead of cards-on-cards.
   ============================================================ */
:root{
  --paper:oklch(96.5% .018 85);
  --card:#FFFDF9;
  --ink:oklch(23% .025 45);
  --slate:oklch(50% .02 50);
  --slate-en:oklch(58% .02 50);
  --slate-en2:oklch(54% .02 50);
  --terracotta:oklch(55% .16 40);
  --terracotta-d:oklch(45% .16 40);
  --teal:oklch(45% .07 195);
  --ochre:oklch(60% .12 70);
  --vinho:oklch(48% .16 20);

  --rule:oklch(23% .025 45 / .14);
  --rule-2:oklch(23% .025 45 / .18);
  --rule-3:oklch(23% .025 45 / .25);
  --ring:oklch(23% .025 45 / .18);

  --serif:'Newsreader',Georgia,'Times New Roman',serif;
  --sans:'Karla',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;

  --pad:26px;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);

  /* ---- redesign tokens ----
     Added alongside the originals rather than replacing them, so every
     existing rule keeps working while new screens use the new names.
     --panel is the inverted surface the session block and end screen sit on;
     --btn/--onbtn is the primary button pair, which inverts in dark. */
  --panel:oklch(23% .025 45);
  --onpanel:oklch(96.5% .018 85);
  --onpaneldim:oklch(96.5% .018 85 / .68);
  --onpanelac:oklch(78% .09 190);
  --onpanelrule:oklch(96.5% .018 85 / .26);
  --btn:oklch(23% .025 45);
  --onbtn:oklch(96.5% .018 85);
  --terra:var(--terracotta);
  --slate2:var(--slate-en2);
  --rule2:var(--rule-2);
  --rule3:var(--rule-3);
}

/* ---------- dark and night ----------
   The old dark theme put paper at 19% L and card at 23% — four points apart,
   which is why nothing read as a separate surface. Paper drops to 16% and
   card sits at 22%, six clear points, with --panel above both so an inverted
   block still reads as raised. Hairlines move to a light ink at higher alpha,
   because a dark rule on a dark ground is invisible.

   Night is not a dimmed dark: the hue shifts warm (60–78) and contrast drops,
   for reading in bed. It is never chosen by "auto".

   Both the media query and the explicit attribute are needed, and the
   attribute must win in both directions — the toggle has to force light on a
   device set to dark, and night on one set to light. */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not([data-theme="night"]):not([data-theme="dark"]){
    --paper:oklch(16% .01 75);
    --card:oklch(22% .012 75);
    --panel:oklch(26% .014 75);
    --ink:oklch(94% .01 85);
    --slate:oklch(74% .014 60);
    --slate-en:oklch(70% .014 60);
    --slate-en2:oklch(68% .014 60);
    --terracotta:oklch(76% .13 42);
    --terracotta-d:oklch(82% .13 42);
    --teal:oklch(80% .085 190);
    --ochre:oklch(80% .11 75);
    --vinho:oklch(70% .15 22);
    --rule:oklch(94% .01 85 / .2);
    --rule-2:oklch(94% .01 85 / .26);
    --rule-3:oklch(94% .01 85 / .32);
    --ring:oklch(94% .01 85 / .26);
    --btn:oklch(94% .01 85);
    --onbtn:oklch(16% .01 75);
    --onpanel:oklch(94% .01 85);
    --onpaneldim:oklch(94% .01 85 / .7);
    --onpanelac:oklch(80% .085 190);
    --onpanelrule:oklch(94% .01 85 / .3);
  }
}
:root[data-theme="dark"]{
    --paper:oklch(16% .01 75);
    --card:oklch(22% .012 75);
    --panel:oklch(26% .014 75);
    --ink:oklch(94% .01 85);
    --slate:oklch(74% .014 60);
    --slate-en:oklch(70% .014 60);
    --slate-en2:oklch(68% .014 60);
    --terracotta:oklch(76% .13 42);
    --terracotta-d:oklch(82% .13 42);
    --teal:oklch(80% .085 190);
    --ochre:oklch(80% .11 75);
    --vinho:oklch(70% .15 22);
    --rule:oklch(94% .01 85 / .2);
    --rule-2:oklch(94% .01 85 / .26);
    --rule-3:oklch(94% .01 85 / .32);
    --ring:oklch(94% .01 85 / .26);
    --btn:oklch(94% .01 85);
    --onbtn:oklch(16% .01 75);
    --onpanel:oklch(94% .01 85);
    --onpaneldim:oklch(94% .01 85 / .7);
    --onpanelac:oklch(80% .085 190);
    --onpanelrule:oklch(94% .01 85 / .3);
}
:root[data-theme="night"]{
    --paper:oklch(24% .022 60);
    --card:oklch(28% .024 60);
    --panel:oklch(32% .026 60);
    --ink:oklch(86% .022 75);
    --slate:oklch(70% .02 65);
    --slate-en:oklch(66% .02 65);
    --slate-en2:oklch(64% .02 65);
    --terracotta:oklch(72% .11 45);
    --terracotta-d:oklch(78% .11 45);
    --teal:oklch(74% .07 190);
    --ochre:oklch(76% .1 78);
    --vinho:oklch(66% .13 25);
    --rule:oklch(88% .02 70 / .16);
    --rule-2:oklch(88% .02 70 / .22);
    --rule-3:oklch(88% .02 70 / .28);
    --ring:oklch(88% .02 70 / .22);
    --btn:oklch(86% .022 75);
    --onbtn:oklch(24% .022 60);
    --onpanel:oklch(88% .02 70);
    --onpaneldim:oklch(88% .02 70 / .7);
    --onpanelac:oklch(76% .07 190);
    --onpanelrule:oklch(88% .02 70 / .24);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  overscroll-behavior-y:none;
}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;padding:0;margin:0;cursor:pointer;text-align:left}
input{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;outline:none}
::-webkit-scrollbar{width:0;height:0}

#app{
  max-width:430px;margin:0 auto;
  padding:calc(var(--safe-t) + 22px) var(--pad) calc(var(--safe-b) + 56px);
}

/* ---------- shared type primitives ---------- */
.serif{font-family:var(--serif)}
.mono{font-family:var(--mono)}
.eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;font-weight:700;color:var(--terracotta)}
.eyebrow.teal{color:var(--teal)}
.eyebrow.slate{color:var(--slate)}
.en{color:var(--slate-en)}
.rule{height:0;border:0;border-top:1px solid var(--rule);margin:0}
.rule.strong{border-top:2px solid var(--ink)}
.rule.q{border-top-color:var(--rule-3)}

/* ---------- back link / screen top ---------- */
.backlink{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;letter-spacing:.18em;
  text-transform:uppercase;font-weight:700;color:var(--terracotta);padding:2px 0;margin-bottom:20px}
.backlink svg{width:11px;height:11px}
.screentitle{font-family:var(--serif);font-size:34px;font-weight:400;line-height:1.05;color:var(--ink);margin:0}
.screentitle .en{display:block;font-family:var(--sans);font-size:12px;letter-spacing:.02em;
  text-transform:none;color:var(--slate-en);margin-top:5px;font-weight:500}
.introp{font-family:var(--serif);font-style:italic;font-size:15px;color:var(--slate);margin:14px 0 2px;line-height:1.5}
.introp + .introe{font-size:12.5px;color:var(--slate-en2);line-height:1.5;margin-bottom:4px}

/* ---------- home: masthead ---------- */
.masthead{text-align:center;padding-bottom:16px;border-bottom:1px solid var(--rule-3)}
.wordmark{font-family:var(--serif);font-style:italic;font-weight:400;font-size:34px;line-height:1;color:var(--ink)}
.caderno{margin-top:9px;font-size:11px;letter-spacing:.28em;text-transform:uppercase;font-weight:700;color:var(--terracotta)}
/* compact word of the day, sitting in the header */
.wodhead{display:block;width:100%;text-align:center;padding-top:16px;margin-top:14px;border-top:1px solid var(--rule)}
.wodhead-k{font-size:11px;letter-spacing:.22em;text-transform:uppercase;font-weight:700;color:var(--teal)}
.wodhead-w{font-family:var(--serif);font-size:30px;color:var(--ink);line-height:1.05;margin-top:8px}
.wodhead-w.answer{color:var(--terracotta)}
.wodhead-ipa{font-family:var(--mono);font-size:11px;color:var(--slate);margin-top:8px}
/* home navigation tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.tile-nav{display:block;padding:15px 14px;background:var(--card);box-shadow:inset 0 0 0 1px var(--rule-2);text-align:left}
.tile-nav .tno{font-family:var(--mono);font-size:11.5px;color:var(--terracotta)}
.tile-nav .tct{font-family:var(--serif);font-size:19px;color:var(--ink);margin-top:7px;line-height:1.1}
.tile-nav .tcs{font-size:11.5px;letter-spacing:.02em;color:var(--slate);margin-top:3px;text-transform:capitalize}
.tile-nav:active{box-shadow:inset 0 0 0 1.5px var(--ink)}
@media(hover:hover){.tile-nav:hover{box-shadow:inset 0 0 0 1.5px var(--ink)}}
/* home progress + review forecast */
.progblock{margin-top:4px;padding-top:16px;border-top:1px solid var(--rule-3)}
.progrow{display:flex;margin:12px 0 10px}
.progstat{flex:1;text-align:center}
.progstat .pn{font-family:var(--serif);font-size:26px;line-height:1;color:var(--ink)}
.progstat .pn.teal{color:var(--teal)}.progstat .pn.terra{color:var(--terracotta)}
.progstat .plab{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--slate);margin-top:7px}
.progstat .plabe{font-size:11.5px;color:var(--slate-en);margin-top:1px}
.pbar{display:flex;height:6px;background:var(--rule);overflow:hidden}
.pbar span{display:block;height:100%}
.pbar .pk{background:var(--teal)}.pbar .pl2{background:var(--terracotta)}
.pcap{font-size:11.5px;color:var(--slate-en);margin-top:8px;line-height:1.45}
/* verb-by-verb progress */
.vrow .bs{display:block;margin-top:5px}
.vbar{display:inline-flex;height:4px;width:104px;background:var(--rule);overflow:hidden;vertical-align:middle;margin-right:8px}
.vbar span{display:block;height:100%}
.vbar .vk{background:var(--teal)}.vbar .vs{background:var(--terracotta)}
.vlvl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--slate);font-weight:600;white-space:nowrap}
.vlvl.vdone{color:var(--teal)}
.lrungs{margin-top:16px;border-top:1px solid var(--rule-3)}
.lrung{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--rule-3)}
.lrung .lct{font-family:var(--mono);font-size:11px;color:var(--slate-en)}
/* conjugation tables in tips can now be several tenses wide, so they scroll
   inside their own box instead of stretching the page sideways */
.tip.conj-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.conj{border-collapse:collapse;font-size:12.5px;margin-top:8px}
table.conj th{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--slate);
  font-weight:700;text-align:left;padding:0 14px 6px 0;white-space:nowrap}
table.conj td{padding:3px 14px 3px 0;color:var(--ink);white-space:nowrap}
table.conj td:first-child{color:var(--slate-en)}
table.conj + table.conj{margin-top:14px}
.fcrow{display:flex;gap:5px;margin:14px 0 0;align-items:flex-end}
.fccol{flex:1;text-align:center}
.fccol .fcn{font-family:var(--mono);font-size:11px;color:var(--ink)}
.fccol .fcbarwrap{height:44px;display:flex;align-items:flex-end;justify-content:center;margin:4px 0}
.fccol .fcbar{display:block;width:64%;background:oklch(23% .025 45 / .16);min-height:2px}
.fccol .fcbar.today{background:var(--terracotta)}
.fccol .fcday{font-size:10px;letter-spacing:.02em;color:var(--slate)}

/* ---------- word of the day / card face ---------- */
.wod{display:block;width:100%;text-align:center;padding:26px 0 22px;border-bottom:1px solid var(--rule-3)}
.wod .kicker{font-size:11px;letter-spacing:.22em;text-transform:uppercase;font-weight:700;color:var(--teal);margin-bottom:16px}
.wod .word{font-family:var(--serif);font-size:46px;line-height:1.0;color:var(--ink);font-weight:400}
.wod .ipa{font-family:var(--mono);font-size:11.5px;color:var(--slate);margin-top:14px;letter-spacing:.01em}
.wod .answer{font-family:var(--serif);font-size:30px;line-height:1.1;color:var(--terracotta);font-weight:400}
.wod .ex{font-family:var(--serif);font-style:italic;font-size:17px;color:var(--slate);margin-top:12px;line-height:1.45}
.wod .exe{font-size:12px;color:var(--slate-en2);margin-top:3px}
.wod .hint{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--slate-en2);margin-top:18px}
.fade-in{animation:fadein .16s ease both}
@keyframes fadein{from{opacity:0}to{opacity:1}}

/* ---------- KPI columns ---------- */
.kpis{display:flex;padding:18px 0;border-bottom:1px solid var(--rule-3)}
.kpi{flex:1;text-align:center;padding:0 6px}
.kpi + .kpi{border-left:1px solid var(--rule-2)}
.kpi .n{font-family:var(--serif);font-size:28px;line-height:1;color:var(--ink);font-weight:400}
.kpi.terra .n{color:var(--terracotta)}
.kpi.teal .n{color:var(--teal)}
.kpi .lp{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--slate);margin-top:9px;font-weight:600}
.kpi .le{font-size:11.5px;color:var(--slate-en);margin-top:2px}

/* ---------- numbered contents list ---------- */
.contents{margin-top:4px}
.citem{display:flex;align-items:baseline;gap:14px;width:100%;padding:15px 0;border-bottom:1px solid var(--rule)}
.citem .no{font-family:var(--mono);font-size:11.5px;color:var(--terracotta);flex:none}
.citem .ctbody{flex:1;min-width:0}
.citem .ct{display:block;font-family:var(--serif);font-size:20px;color:var(--ink);line-height:1.15}
.citem .cs{display:block;font-size:11.5px;color:var(--slate);margin-top:2px}
.citem .tail{font-family:var(--mono);font-size:11px;color:var(--slate);flex:none;align-self:center}
.citem:active .ct{color:var(--terracotta)}
@media(hover:hover){.citem:hover .ct{color:var(--terracotta)}.citem:hover{border-bottom-color:var(--rule-3)}}

/* ---------- footer ---------- */
.footer{margin-top:26px;padding-top:4px}
.footer .fp{font-family:var(--serif);font-style:italic;font-size:14.5px;color:var(--slate);line-height:1.5}
.footer .fe{font-size:12px;color:var(--slate-en2);margin-top:5px;line-height:1.5}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:14px 18px;font-family:var(--sans);font-size:13.5px;font-weight:700;
  letter-spacing:.02em;border-radius:0;transition:background .12s,color .12s,box-shadow .12s}
.btn.block{display:flex;width:100%}
/* [hidden] loses to .btn.block's display, so the download and stop buttons
   were both visible at once. Make the attribute win. */
[hidden]{display:none !important}
.btn.fill{background:var(--ink);color:var(--paper)}
.btn.outline{box-shadow:inset 0 0 0 1.4px var(--ink);color:var(--ink)}
.btn.terra{background:var(--terracotta);color:var(--paper)}
@media(hover:hover){
  .btn.fill:hover{background:var(--terracotta)}
  .btn.outline:hover{background:var(--ink);color:var(--paper)}
}
.btnrow{display:flex;gap:10px;margin-top:20px}
.btnrow .btn{flex:1}

/* small text button (audio, etc.) */
.txtbtn{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;letter-spacing:.16em;
  text-transform:uppercase;font-weight:700;color:var(--teal);padding:6px 0}
.txtbtn svg{width:13px;height:13px}

/* ---------- progress track ---------- */
.progresshead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.progresshead .pl{font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:var(--terracotta)}
.progresshead .pc{font-family:var(--mono);font-size:11.5px;color:var(--slate)}
.track{height:2px;background:var(--rule);position:relative;overflow:hidden}
.track>span{display:block;height:100%;background:var(--terracotta)}

/* ---------- review / card face on paper ---------- */
.cardface{text-align:center;padding:28px 4px 8px}
.cardface .klass{font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:var(--teal);margin-bottom:16px}
.cardface .word{font-family:var(--serif);font-size:46px;line-height:1.05;color:var(--ink)}
.cardface .ipa{font-family:var(--mono);font-size:11.5px;color:var(--slate);margin-top:14px}
.cardface .hr{height:0;border-top:1px solid var(--rule);width:60%;margin:22px auto}
.cardface .answer{font-family:var(--serif);font-size:28px;color:var(--terracotta);line-height:1.15}
.cardtap{display:block;width:100%;text-align:center;padding:0}
.tap-reveal{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--slate-en2);margin-top:26px}
.conjmeaning{font-size:12.5px;color:var(--slate-en);margin-top:5px}
.conjcue{font-family:var(--serif);font-size:26px;color:var(--terracotta);margin-top:20px;line-height:1.1}
.conjcue .cuelabel{display:block;font-family:var(--sans);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--slate);font-weight:700;margin-bottom:7px}

/* note + footnote cards */
.note{background:var(--card);box-shadow:inset 0 0 0 1px oklch(23% .025 45 / .12);padding:15px 16px;margin-top:14px}
.note .nl{font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;color:var(--slate);margin-bottom:9px}
.note .np{font-family:var(--serif);font-size:19px;color:var(--ink);line-height:1.4}
.note .ne{font-size:12.5px;color:var(--slate-en);margin-top:4px;line-height:1.45}
.footnote{background:var(--card);box-shadow:inset 3px 0 0 var(--teal);padding:14px 16px 14px 18px;margin-top:14px}
.footnote .np{font-family:var(--serif);font-size:15.5px;color:var(--ink);line-height:1.45}
.footnote .ne{font-size:12.5px;color:var(--slate-en);margin-top:4px;line-height:1.45}

/* grade buttons */
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:22px}
.grade{display:flex;flex-direction:column;align-items:center;gap:5px;padding:13px 4px;
  box-shadow:inset 0 0 0 1.4px var(--ring);background:var(--card)}
.grade .gl{font-size:13.5px;font-weight:700}
.grade .gi{font-family:var(--mono);font-size:11px;color:var(--slate)}
.grade.again{box-shadow:inset 0 0 0 1.4px var(--vinho)}.grade.again .gl{color:var(--vinho)}
.grade.hard{box-shadow:inset 0 0 0 1.4px var(--ochre)}.grade.hard .gl{color:var(--ochre)}
.grade.good{box-shadow:inset 0 0 0 2px var(--teal)}.grade.good .gl{color:var(--teal)}
.grade.easy{box-shadow:inset 0 0 0 1.4px var(--terracotta)}.grade.easy .gl{color:var(--terracotta)}
.kbdhint{font-family:var(--mono);font-size:11.5px;color:var(--slate);text-align:center;margin-top:14px}

/* ---------- multiple choice ---------- */
.choices{display:flex;flex-direction:column;gap:8px;margin-top:20px}
.choice{width:100%;padding:16px 18px;font-family:var(--serif);font-size:16px;color:var(--ink);
  background:var(--card);box-shadow:inset 0 0 0 1px var(--rule-2)}
.choice.right{box-shadow:inset 0 0 0 2px var(--teal);color:var(--teal);font-weight:600}
.choice.wrong{box-shadow:inset 0 0 0 2px var(--vinho);color:var(--vinho)}
.choice.dim{opacity:.4}

/* ---------- type it ---------- */
.typeprompt{font-family:var(--serif);font-size:32px;color:var(--ink);text-align:center;margin:8px 0 24px}
.typeline{font-family:var(--serif);font-size:30px;color:var(--ink);min-height:56px;width:100%;
  border-bottom:2px solid var(--terracotta);padding:6px 2px;text-align:center}
.accents{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-top:20px}
.akey{width:46px;height:46px;display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-size:20px;color:var(--ink);box-shadow:inset 0 0 0 1px var(--rule-3)}
@media(hover:hover){.akey:hover{background:var(--ink);color:var(--paper)}}

/* ---------- o ou a ---------- */
.genderword{font-family:var(--serif);font-size:46px;color:var(--ink);text-align:center;margin:6px 0 4px}
.gendersub{text-align:center;font-size:13px;color:var(--slate-en);margin-bottom:24px}
.genderopts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gopt{padding:30px 0;text-align:center;font-family:var(--serif);font-size:40px;color:var(--ink);
  background:var(--card);box-shadow:inset 0 0 0 1.4px var(--ring)}
.gopt.right{box-shadow:inset 0 0 0 2.5px var(--teal);color:var(--teal)}
.gopt.wrong{box-shadow:inset 0 0 0 2.5px var(--vinho);color:var(--vinho)}
.gopt.dim{opacity:.4}
.explain{background:var(--card);box-shadow:inset 3px 0 0 var(--teal);padding:14px 16px 14px 18px;margin-top:20px}
.explain .np{font-family:var(--serif);font-size:15.5px;color:var(--ink);line-height:1.45}
.explain .ne{font-size:12.5px;color:var(--slate-en);margin-top:4px;line-height:1.45}
/* what-you-wrote vs what-was-wanted, with the differing characters marked */
.dline{display:flex;align-items:baseline;gap:10px;margin-bottom:5px}
.dline:last-of-type{margin-bottom:2px}
.dlab{flex:0 0 84px;font-size:11px;color:var(--slate-en);line-height:1.5}
.dgot,.dwant{font-family:var(--serif);font-size:21px;line-height:1.3;word-break:break-word}
.dgot{color:var(--slate)}
.dwant{color:var(--ink)}
.dx{background:rgba(166,74,52,.16);box-shadow:0 1px 0 var(--terracotta);font-weight:inherit;padding:0 1px}
/* reading toolbar: listen / reveal, above the passage rather than below it */
/* type-it in context: the word blanked out of its own example sentence */
.clzline{font-family:var(--serif);font-size:23px;line-height:1.55;color:var(--ink);
  padding:4px 2px 0;text-align:left}
.clzgap{display:inline-block;min-width:74px;border-bottom:2px solid var(--terracotta);
  vertical-align:baseline;margin:0 2px}
.clzen{font-size:12.5px;color:var(--slate-en);margin-top:10px;line-height:1.45;text-align:left}
.rtools{display:flex;gap:16px;align-items:center;flex-wrap:wrap;row-gap:6px;
  padding:10px 0 9px;border-bottom:1px solid var(--rule-3);margin-bottom:2px}
.dwant .dx{background:rgba(42,122,110,.16);box-shadow:0 1px 0 var(--teal)}

/* ---------- lists (pickers) ---------- */
.booklist{border-top:2px solid var(--ink);margin-top:18px}
.brow{display:flex;align-items:baseline;gap:16px;width:100%;padding:15px 0;border-bottom:1px solid var(--rule)}
.brow .bt{flex:1;min-width:0}
.brow .bp{display:block;font-family:var(--serif);font-size:19px;color:var(--ink);line-height:1.15}
.brow .be{display:block;font-size:11.5px;color:var(--slate-en);margin-top:2px}
.brow .bs{display:block;font-size:11.5px;color:var(--slate);margin-top:2px}
.brow .tail{font-family:var(--mono);font-size:11px;color:var(--slate);flex:none;align-self:center}
@media(hover:hover){.brow:hover .bp{color:var(--terracotta)}}

/* ---------- dictionary ---------- */
.searchrow{display:flex;align-items:center;gap:10px;border-top:2px solid var(--ink);border-bottom:1px solid var(--rule);padding:12px 2px}
.searchrow svg{width:15px;height:15px;stroke:var(--slate);flex:none}
.searchrow input{flex:1;font-size:14px;color:var(--ink)}
.searchrow input::placeholder{color:var(--slate-en2)}
.classfilter{display:flex;flex-wrap:wrap;gap:16px;padding:14px 0}
.cf{min-height:34px;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--slate);padding-bottom:3px;font-weight:600}
.cf.on{color:var(--terracotta);border-bottom:2px solid var(--terracotta)}
.dgroup{font-size:10px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;color:var(--slate);
  margin:22px 0 4px;padding-top:12px;border-top:2px solid var(--ink)}
.dentry{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--rule)}
.dentry .dot{width:6px;height:6px;border-radius:50%;flex:none}
.dot.known{background:var(--teal)}.dot.learning{background:var(--ochre)}.dot.new{background:oklch(23% .025 45 / .2)}
.dentry .dp{font-family:var(--serif);font-size:18px;color:var(--ink);flex:1}
.dentry .de{font-size:12.5px;color:var(--slate-en);text-align:right}

/* ---------- settings ---------- */
.field{padding:18px 0;border-bottom:1px solid var(--rule)}
.field .fl{font-family:var(--serif);font-size:19px;color:var(--ink)}
.field .fle{font-size:11.5px;color:var(--slate-en);margin-top:1px}
.field .fh{font-size:12px;color:var(--slate);margin-top:8px;line-height:1.45}
.field .fhe{font-size:11.5px;color:var(--slate-en2);margin-top:2px;line-height:1.45}
.stepper{display:flex;align-items:center;gap:18px;margin-top:14px}
.stepper button{width:46px;height:46px;display:flex;align-items:center;justify-content:center;
  font-size:22px;box-shadow:inset 0 0 0 1.4px var(--ink);color:var(--ink)}
.stepper .val{font-family:var(--serif);font-size:30px;color:var(--ink);min-width:44px;text-align:center}
.seg{display:flex;gap:0;margin-top:14px}
.seg button{flex:1;text-align:center;padding:11px 0;font-size:12.5px;font-weight:600;
  box-shadow:inset 0 0 0 1px var(--rule-3);color:var(--slate)}
.seg button.on{background:var(--ink);color:var(--paper);box-shadow:none}
.tgl{display:flex;align-items:center;justify-content:space-between;gap:14px}
.tglstate{font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;padding:6px 12px;flex:none}
.tglstate.on{background:var(--teal);color:var(--card)}
.tglstate.off{box-shadow:inset 0 0 0 1px var(--rule-3);color:var(--slate)}
.datasum{font-family:var(--mono);font-size:11px;color:var(--slate);line-height:1.6;margin-top:6px}
#io textarea{width:100%;min-height:90px;margin-top:12px;padding:11px;background:var(--card);
  box-shadow:inset 0 0 0 1px var(--rule-2);border:0;border-radius:0;font-family:var(--mono);
  font-size:12px;color:var(--ink);resize:vertical;-webkit-appearance:none}

/* ---------- method ---------- */
.mrow{display:flex;gap:16px;padding:18px 0;border-bottom:1px solid var(--rule)}
.mrow .mn{font-family:var(--mono);font-size:11px;color:var(--terracotta);flex:none;width:22px;padding-top:5px}
.mrow .mt{font-family:var(--serif);font-size:19px;color:var(--ink);line-height:1.2}
.mrow .mte{font-size:11.5px;color:var(--slate-en);margin-top:1px}
.mrow .mb{font-size:13px;color:var(--slate);margin-top:8px;line-height:1.5}
.mrow .mbe{font-size:12px;color:var(--slate-en2);margin-top:3px;line-height:1.5}

/* ---------- grammar text table ---------- */
.gtable{border-top:2px solid var(--ink);margin-top:18px}
.gthead{display:flex;padding:8px 0;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--slate);font-weight:700}
.gtrow{display:flex;padding:11px 0;border-bottom:1px solid var(--rule);align-items:baseline}
.gtlabel{width:31%;flex:none;font-size:12.5px;color:var(--slate);padding-right:10px}
.gtcell{flex:1;font-family:var(--serif);font-size:17.5px;color:var(--ink)}
.gthead .gtlabel{color:var(--slate)}

/* ---------- leitura (reading) ---------- */
.passage{margin-top:8px}
/* Left gutter is always reserved, so the read-along marker has somewhere to
   live and the text doesn't shift when a line starts being read. */
.rline{padding:12px 0 12px 14px;border-bottom:1px solid var(--rule);cursor:pointer;position:relative}
.rline .rpt{font-family:var(--serif);font-size:20px;line-height:1.5;color:var(--ink)}
/* the line currently being read aloud */
.rline.reading{background:oklch(from var(--ochre) l c h / .18)}
.rline.reading::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--terracotta)}
.rline.reading .rpt{color:var(--ink)}
[data-listen] .lbl-stop{display:none}
[data-listen].on .lbl-stop{display:inline}
[data-listen].on .lbl-play{display:none}
/* speaking: record control and the score readout */
.bigrec{width:96px;height:96px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  margin:22px auto 0;color:var(--paper);background:var(--vinho)}
.bigrec:active{opacity:.75}
.bigrec.on{animation:recpulse 1.1s ease-in-out infinite}
@keyframes recpulse{0%,100%{opacity:1}50%{opacity:.55}}
@media(prefers-reduced-motion:reduce){.bigrec.on{animation:none;opacity:.7}}
.scorewrap{margin-top:18px}
.scoren{font-family:var(--serif);font-size:64px;line-height:1;text-align:center;color:var(--teal)}
.scoren.near{color:var(--ochre)}
.scoren.no{color:var(--vinho)}
.scorewords{font-family:var(--serif);font-size:22px;text-align:center;margin-top:16px;line-height:1.6}
.sw{padding:1px 3px}
.sw.good{box-shadow:inset 0 -3px 0 var(--teal)}
.sw.mid{box-shadow:inset 0 -3px 0 var(--ochre)}
.sw.bad{box-shadow:inset 0 -3px 0 var(--vinho);color:var(--vinho)}
.diag{margin-top:22px;border-top:1px solid var(--rule-3);padding-top:12px}
.diag summary{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--slate);cursor:pointer}
.diag pre{font-family:var(--mono);font-size:11.5px;line-height:1.5;color:var(--slate);
  white-space:pre-wrap;margin:10px 0 8px;max-height:240px;overflow:auto}
.fbk{margin:18px 0 0;padding:14px 16px 14px 32px;box-shadow:inset 3px 0 0 var(--teal);background:var(--card)}
.fbk li{font-size:14px;line-height:1.55;color:var(--ink);margin-bottom:8px}
.fbk li:last-child{margin-bottom:0}
.fbk b{font-weight:600}
.bigrec.warm{background:var(--slate);animation:none}
.scorebars{margin-top:20px;display:flex;flex-direction:column;gap:10px}
.sbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--slate);display:flex;gap:6px}
.sbl b{margin-left:auto;color:var(--ink);font-family:var(--mono)}
.sbt{height:5px;background:var(--rule-3);margin-top:5px;overflow:hidden}
.sbt span{display:block;height:100%;background:var(--teal)}
/* dictation: the sound is the prompt, so the play control is the focal point */
.bigplay{width:96px;height:96px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  margin:18px auto 0;color:var(--paper);background:var(--ink)}
.bigplay:active{opacity:.75}
.bigplay.busy{background:var(--terracotta)}
.updbar{position:fixed;left:0;right:0;bottom:0;z-index:70;background:var(--teal);color:var(--paper);
  display:flex;align-items:center;gap:12px;padding:12px 18px calc(12px + var(--safe-b));font-size:13.5px}
.updbar button{margin-left:auto;flex:none;background:var(--paper);color:var(--ink);padding:8px 14px;font-weight:600}
.updbar .updx{margin-left:6px;background:none;color:var(--paper);padding:8px 10px;font-size:17px;line-height:1;
  opacity:.85;min-width:40px}
.updbar .updx:hover{opacity:1}
/* today's plan */
.todaytext{display:flex;flex-direction:column;gap:3px;width:100%;text-align:left;margin:18px 0 4px;
  padding:15px 16px;background:var(--ink);color:var(--paper)}
.todaytext .ttl{font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ochre)}
.todaytext .ttn{font-family:var(--serif);font-size:19px;line-height:1.2}
.plan{margin:26px 0 4px;box-shadow:inset 0 0 0 1px var(--rule-3);background:var(--card)}
.planhd{display:flex;align-items:baseline;padding:13px 16px 11px;border-bottom:1px solid var(--rule-3);
  font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--terracotta);font-weight:700}
.planbudget{margin-left:auto;color:var(--slate);font-family:var(--mono);letter-spacing:.04em;font-weight:400}
.planrow{display:flex;align-items:center;gap:13px;width:100%;text-align:left;padding:13px 16px;
  border-bottom:1px solid var(--rule-3)}
.planrow:last-of-type{border-bottom:0}
.pmark{font-family:var(--mono);font-size:11px;color:var(--slate);width:20px;flex:none}
.planrow.next .pmark{color:var(--terracotta)}
.planrow.done .pmark{color:var(--teal)}
.pbody{display:flex;flex-direction:column;min-width:0}
.ppt{font-family:var(--serif);font-size:19px;color:var(--ink);line-height:1.15}
.pen{font-size:11px;color:var(--slate);margin-top:1px}
.pnote{font-size:11.5px;color:var(--slate);margin-top:4px}
.pmins{margin-left:auto;flex:none;font-family:var(--mono);font-size:11px;color:var(--slate)}
.planrow.done .ppt{color:var(--slate);text-decoration:line-through;text-decoration-thickness:1px}
.planrow.next{background:var(--card)}
.plandone{padding:13px 16px;font-size:12.5px;line-height:1.5;color:var(--teal);border-top:1px solid var(--rule-3)}
.dlbar{height:6px;background:var(--rule-3);margin:14px 0 8px;overflow:hidden}
.dlbar span{display:block;height:100%;width:0;background:var(--teal);transition:width .25s ease}
.legal p{font-size:14.5px;line-height:1.6;color:var(--ink);margin:0 0 13px;max-width:62ch}
.legal p.en{color:var(--slate);font-size:13.5px;margin-top:-8px}
.legal h2{font-family:var(--serif);font-size:21px;font-weight:400;margin:28px 0 10px;color:var(--ink)}
.legal ul{margin:0 0 13px 18px;padding:0}
.legal li{font-size:14.5px;line-height:1.6;color:var(--ink);margin-bottom:6px;max-width:60ch}
.legal a{color:var(--terracotta);text-decoration:underline}
.legal .updated{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--slate);margin-top:34px}
.legalnav{display:flex;gap:14px;flex-wrap:wrap;margin-top:26px;padding-top:18px;border-top:1px solid var(--rule-3)}
.legalnav button{font-size:12px;color:var(--slate);text-decoration:underline}
/* Vertical padding on an inline element grows the touch target without
   changing the line box — fingers land between lines otherwise. */
.wtap{cursor:pointer;border-radius:2px;padding:.3em .06em;margin:0 -.06em;
  -webkit-tap-highlight-color:oklch(55% .16 40 / .22)}
.wtap:active{background:oklch(55% .16 40 / .18)}
@media(hover:hover){.wtap:hover{background:oklch(55% .16 40 / .10)}}
.winfobar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--ink);color:var(--paper);
  transform:translateY(110%);transition:transform .18s ease;padding-bottom:var(--safe-b);box-shadow:0 -8px 30px rgba(40,25,15,.25)}
.winfobar.show{transform:translateY(0)}
.wib-in{max-width:680px;margin:0 auto;padding:16px 22px 18px;position:relative}
.wib-word{font-family:var(--serif);font-size:23px;line-height:1.1;display:flex;align-items:center;gap:12px}
.wib-say{color:var(--ochre);padding:6px;margin:-6px 0;flex:none}
.wib-say:active{opacity:.5}
.wib-say.busy{opacity:.45}
.wib-tag{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ochre);margin-top:5px}
.wib-detail{font-size:14.5px;color:var(--slate);margin-top:7px;line-height:1.45}
.wib-x{position:absolute;top:10px;right:16px;font-size:24px;line-height:1;color:var(--paper);opacity:.65;padding:4px}
.rline .ren{font-size:13px;color:var(--slate-en);line-height:1.5;margin-top:6px;max-height:0;overflow:hidden;opacity:0;transition:opacity .15s}
.rline.show .ren{max-height:220px;opacity:1}
@media(hover:hover){.rline:hover .rpt{color:var(--terracotta)}}
.passage.cloze{font-family:var(--serif);font-size:20px;line-height:2.1;color:var(--ink)}
.gapinput{font-family:var(--serif);font-size:19px;color:var(--terracotta);text-align:center;
  border:0;border-bottom:2px solid var(--terracotta);background:transparent;padding:0 4px;margin:0 2px;border-radius:0}
.gapinput:focus{outline:none;background:oklch(55% .16 40 / .08)}
.gapinput.right{color:var(--teal);border-bottom-color:var(--teal)}
.gapinput.wrong{color:var(--vinho);border-bottom-color:var(--vinho)}
.wbank{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 18px}
.wbchip{font-family:var(--serif);font-size:16px;color:var(--ink);padding:8px 14px;background:var(--card);box-shadow:inset 0 0 0 1px var(--rule-3)}
.wbchip.used{opacity:.32;text-decoration:line-through}
@media(hover:hover){.wbchip:not(.used):hover{box-shadow:inset 0 0 0 1.5px var(--terracotta);color:var(--terracotta)}}
.srcline{margin-top:26px;padding-top:14px;border-top:1px solid var(--rule);font-size:11px;color:var(--slate-en);line-height:1.6}
.srcline a{color:var(--terracotta)}
.srcline .lvl{display:inline-block;font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;color:var(--paper);
  background:var(--teal);padding:2px 7px;margin-right:8px;vertical-align:middle}
.brow .lvlbadge{font-family:var(--mono);font-size:11px;color:var(--paper);background:var(--teal);padding:2px 6px;margin-left:8px;letter-spacing:.06em}
.srcline .aimark{color:var(--ochre)}
.fgroup{display:flex;align-items:baseline;gap:12px;margin-top:14px;flex-wrap:wrap}
.fgroup .fglabel{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--slate);flex:none;width:74px}
.fgroup .classfilter{flex:1;padding:0;gap:14px}
.fcount{font-family:var(--mono);font-size:11.5px;color:var(--slate);margin:16px 0 2px}
/* translate mode */
.rline.tmode .ten{font-size:15px;color:var(--ink);line-height:1.5}
.rline.tmode .tpt{font-family:var(--serif);font-size:20px;color:var(--terracotta);line-height:1.5;margin-top:6px;max-height:0;overflow:hidden;opacity:0;transition:opacity .15s}
.rline.tmode.show .tpt{max-height:220px;opacity:1}
.rline.tmode .ren{display:none}
/* comprehension quiz */
.qblock{padding:16px 0;border-bottom:1px solid var(--rule)}
.qtext{font-family:var(--serif);font-size:18px;color:var(--ink);line-height:1.35}
.qtexte{font-size:12px;color:var(--slate-en);margin-top:3px}
.qopts{display:flex;flex-direction:column;gap:7px;margin-top:12px}
.qopt{width:100%;padding:12px 14px;font-family:var(--serif);font-size:15.5px;color:var(--ink);background:var(--card);box-shadow:inset 0 0 0 1px var(--rule-2)}
.qopt.sel{box-shadow:inset 0 0 0 2px var(--ink)}
.qopt.right{box-shadow:inset 0 0 0 2px var(--teal);color:var(--teal)}
.qopt.wrong{box-shadow:inset 0 0 0 2px var(--vinho);color:var(--vinho)}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 26px);transform:translateX(-50%);
  background:var(--ink);color:var(--paper);font-size:12.5px;padding:10px 16px;z-index:50;letter-spacing:.02em}

/* ---------- account panel (sync) reuse ---------- */
#syncMount .hint{font-size:11.5px;color:var(--slate-en)}
.stack{display:flex;flex-direction:column;gap:10px}
.mt{margin-top:12px}
.quiet{box-shadow:inset 0 0 0 1px var(--rule-3);color:var(--ink);background:none}

/* ============ web dashboard (wide screens) ============ */
#app.web{max-width:1120px;padding:calc(var(--safe-t) + 34px) 44px 60px}
.webhead{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;
  border-bottom:2px solid var(--ink);padding-bottom:16px;margin-bottom:30px;flex-wrap:wrap}
.webhead .wm{font-family:var(--serif);font-style:italic;font-size:30px;color:var(--ink);line-height:1}
.webhead .we{font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--terracotta);font-weight:700;margin-top:8px}
.webhead .wee{font-size:11.5px;color:var(--slate-en);margin-top:4px}
.webkpis{display:flex;gap:38px;align-items:baseline;flex:none}
.webkpi{text-align:right}
.webkpi .n{font-family:var(--serif);font-size:24px;line-height:1;color:var(--ink)}
.webkpi.terra .n{color:var(--terracotta)}.webkpi.teal .n{color:var(--teal)}
.webkpi .lp{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--slate);margin-top:5px;white-space:nowrap}
.webkpi .le{font-size:11.5px;color:var(--slate-en);margin-top:3px;white-space:nowrap}
.webbody{display:flex;gap:44px;align-items:flex-start}
.rail{width:172px;flex:none;position:sticky;top:20px}
.rail .rhd{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--slate);font-weight:700;margin-bottom:10px}
.rail button{display:block;width:100%;padding:10px 12px;margin-bottom:6px;font-family:var(--serif);font-size:15px;
  color:var(--ink);background:var(--card);box-shadow:inset 0 0 0 1px var(--rule-2)}
.rail button.on{color:var(--terracotta);box-shadow:inset 0 0 0 1.5px var(--terracotta)}
.rail button .rle{display:block;font-family:var(--sans);font-size:11.5px;color:var(--slate-en);margin-top:1px}
@media(hover:hover){.rail button:hover{color:var(--ink)}.rail button.on:hover{color:var(--terracotta)}}
.rail .quote{margin-top:22px;padding-top:16px;border-top:1px solid var(--rule-3)}
.rail .quote .qp{font-family:var(--serif);font-style:italic;font-size:14px;line-height:1.6;color:var(--slate)}
.rail .quote .qe{font-size:11.5px;line-height:1.6;color:var(--slate-en);margin-top:5px}
.dash{flex:1;min-width:0}
.dashrow{display:flex;gap:36px;align-items:flex-start;flex-wrap:wrap}
.dmain{flex:1 1 420px;min-width:420px}
.dside{flex:1 1 300px;min-width:280px;max-width:340px}
.wodweb{display:block;width:100%;text-align:center;padding:36px 0 40px;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink)}
.wodweb .word{font-family:var(--serif);font-size:clamp(42px,5.4vw,64px);color:var(--ink);line-height:1.02}
.wodweb .ipa{font-family:var(--mono);font-size:13px;color:var(--slate);margin-top:16px}
.wodweb .answer{font-family:var(--serif);font-size:clamp(32px,3.8vw,44px);color:var(--terracotta);line-height:1.12}
.wodweb .ex{font-family:var(--serif);font-style:italic;font-size:20px;color:var(--slate);margin-top:18px}
.wodweb .hint{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--slate-en2);margin-top:24px}
.webbtns{display:flex;gap:12px;margin-top:20px;flex-wrap:wrap}
.webbtns .btn{flex:1}
.sectlabel{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--slate);font-weight:700}
.sectlabel.teal{color:var(--teal)}.sectlabel.terra{color:var(--terracotta)}
.fila{display:flex;align-items:baseline;gap:12px;border-top:2px solid var(--ink);padding-top:12px;margin-top:10px}
.fila .fn{font-family:var(--serif);font-size:52px;color:var(--terracotta);line-height:.9}
.fila .ft{font-family:var(--serif);font-style:italic;font-size:17px;color:var(--slate);line-height:1.35}
.fila .ft .fte{display:block;font-family:var(--sans);font-style:normal;font-size:11.5px;color:var(--slate-en);margin-top:3px}
.filarow{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--rule)}
.filarow .fp{font-family:var(--serif);font-size:16px;color:var(--ink)}
.filarow .fp .en2{font-family:var(--sans);font-size:11px;color:var(--slate-en)}
.filarow .fv{font-family:var(--mono);font-size:11.5px;color:var(--slate)}
.mbar{margin-bottom:14px}
.mbar .mh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.mbar .mp{font-family:var(--serif);font-size:16px;color:var(--ink)}
.mbar .mp .en2{font-family:var(--sans);font-size:11px;color:var(--slate-en)}
.mbar .mv{font-family:var(--mono);font-size:11px;color:var(--slate)}
.mbar .mtk{height:3px;background:var(--rule)}
.mbar .mtk>span{display:block;height:100%;background:var(--terracotta)}
.mbar.teal .mtk>span{background:var(--teal)}

/* ---------- classes that were being rendered with no rules behind them ---------- */
/* inline "hear it" button, sits next to a line of Portuguese */
.say{display:inline-flex;align-items:center;vertical-align:baseline;color:var(--teal);
  padding:4px;margin-left:2px;line-height:0}
.say svg{width:15px;height:15px}
.say.inline svg{width:13px;height:13px}
.sbar{display:block}
/* reading: comprehension questions and the cloze passage */
.quiz{display:flex;flex-direction:column;gap:18px;margin-top:14px}
.clozeline{display:inline}
/* small print under a settings control */
.foot{font-size:11.5px;color:var(--slate-en);margin-top:8px;line-height:1.45}
/* quiet tertiary button — no fill, no outline, just a word */
.btn.ghost{color:var(--slate);box-shadow:inset 0 0 0 1px var(--rule)}
/* irreversible actions: folded away, and styled so they can never be mistaken
   for the reversible buttons directly above them */
.btn.danger{background:var(--vinho);color:var(--paper)}
.danger{margin-top:14px;padding:12px 14px;box-shadow:inset 0 0 0 1px oklch(from var(--vinho) l c h / .4)}
.danger>summary{cursor:pointer;font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  font-weight:700;color:var(--vinho);list-style:none}
.danger>summary::-webkit-details-marker{display:none}
.danger>summary::after{content:" ▾";letter-spacing:0}
.danger[open]>summary::after{content:" ▴"}
.btn.ghost:hover{color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
/* an inline confirmation or warning, e.g. the erase-everything double tap */
.verdict{background:var(--card);box-shadow:inset 3px 0 0 var(--teal);
  padding:12px 14px;font-size:13px;line-height:1.5;color:var(--ink)}
.verdict.no{box-shadow:inset 3px 0 0 var(--vinho)}
.verdict em{font-style:normal;font-weight:700}

/* ---------- conversa ---------- */
.convnote{font-size:11.5px;color:var(--slate-en);line-height:1.5;margin:14px 0 4px;
  padding:10px 12px;background:var(--card);box-shadow:inset 3px 0 0 var(--teal)}
.cvthread{margin:18px 0 4px;display:flex;flex-direction:column;gap:14px;
  max-height:56vh;overflow-y:auto;padding-right:2px}
.cvrow{display:flex;flex-direction:column;max-width:88%}
.cvrow.them{align-self:flex-start}
.cvrow.me{align-self:flex-end;align-items:flex-end}
.cvbub{font-family:var(--serif);font-size:19px;line-height:1.5;color:var(--ink);
  background:var(--card);padding:11px 14px;box-shadow:inset 0 0 0 1px var(--rule-2)}
.cvrow.me .cvbub{background:var(--ink);color:var(--paper);box-shadow:none}
.cvbub .say{color:var(--teal);margin-left:4px}
.cvwait{color:var(--slate-en);font-style:italic}
.cven{font-size:12px;color:var(--slate-en);margin-top:5px;line-height:1.45;padding-left:2px}
/* a correction sits under the turn it corrects, quiet but unmissable */
.cvfix{align-self:flex-start;max-width:88%;margin-top:-6px;display:flex;flex-direction:column;gap:3px;
  padding:9px 12px;box-shadow:inset 3px 0 0 var(--ochre);background:var(--card)}
.cvfixl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--ochre)}
.cvfixt{font-family:var(--serif);font-size:17px;color:var(--ink);line-height:1.45}
.cvfixw{font-size:11.5px;color:var(--slate-en);line-height:1.45}
.cvform{border-top:1px solid var(--rule-3);padding-top:14px;margin-top:6px}
.cvinput{font-size:20px;min-height:46px}

/* ---------- verb-tense level switches ---------- */
.tlvls{display:flex;flex-direction:column;margin-top:14px;box-shadow:inset 0 0 0 1px var(--rule-2)}
.tlvlrow{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;
  padding:13px 14px;background:none;border-bottom:1px solid var(--rule)}
.tlvlrow:last-child{border-bottom:0}
.tlvmark{flex:0 0 18px;font-size:14px;line-height:1.4;color:var(--teal)}
.tlvbody{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.tlvpt{font-family:var(--serif);font-size:17px;color:var(--slate);line-height:1.3}
.tlvlrow.on .tlvpt{color:var(--ink)}
.tlven{font-size:11.5px;color:var(--slate-en);line-height:1.4}
.tlvn{font-family:var(--mono);font-size:11px;color:var(--slate-en2);margin-top:3px}
.tlvstate{flex:0 0 auto;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  font-weight:700;color:var(--slate-en2);padding-top:3px}
.tlvlrow.on .tlvstate{color:var(--teal)}

/* four-up theme control (Eu · appearance) */
.thseg{display:grid;grid-template-columns:repeat(4,1fr);margin-top:14px;
  box-shadow:inset 0 0 0 1px var(--rule-3)}
.thcell{display:flex;flex-direction:column;align-items:center;gap:2px;padding:11px 4px;
  background:none;border-right:1px solid var(--rule)}
.thcell:last-child{border-right:0}
.thcell .thpt{font-family:var(--serif);font-size:15px;color:var(--ink);line-height:1.2}
.thcell .then{font-size:11px;color:var(--slate-en2);line-height:1.2}
.thcell.on{background:var(--btn)}
.thcell.on .thpt,.thcell.on .then{color:var(--onbtn)}

/* ---------- tab bar ----------
   Five places. Estudar is the centre and is a filled block rather than a text
   tab, because it is the verb — everything else is somewhere you look. The
   selected text tab is marked with a rule along its top edge, not a pill:
   the identity here is rules and rectangles, nothing rounded. */
#tabhost{position:fixed;left:0;right:0;bottom:0;z-index:60}
.tabbar{display:grid;grid-template-columns:repeat(5,1fr);align-items:stretch;
  max-width:430px;margin:0 auto;background:var(--paper);
  border-top:1px solid var(--rule-2);
  padding-bottom:var(--safe-b);min-height:62px}
.tabbar .tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  background:none;padding:9px 2px;min-height:62px;color:var(--slate)}
.tabbar .tab .tpt{font-family:var(--serif);font-size:15px;line-height:1.15}
.tabbar .tab .ten2{font-size:10px;line-height:1.15;color:var(--slate-en2)}
.tabbar .tab.on{box-shadow:inset 0 2px 0 var(--terra);color:var(--terra)}
.tabbar .tab.on .ten2{color:var(--terra)}
.tabbar .tabc{display:flex;align-items:center;justify-content:center;margin:8px 6px;
  background:var(--btn);color:var(--onbtn);min-height:46px;padding:0 6px}
.tabbar .tabc .tcpt{font-family:var(--serif);font-size:16px}
.tabbar .tabc.on{box-shadow:inset 0 0 0 2px var(--terra)}
/* leave room for the bar so nothing hides behind it */
body.hastabs #app{padding-bottom:calc(var(--safe-b) + 84px)}
@media(min-width:760px){ #tabhost{display:none} body.hastabs #app{padding-bottom:60px} }

/* ---------- estudar ---------- */
.estgrp{margin-top:24px}
.estgh{display:flex;align-items:baseline;justify-content:space-between;
  padding-bottom:8px;border-bottom:1px solid var(--rule-3);margin-bottom:12px}
.estgpt{font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:var(--teal)}
.estgen{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--slate-en2)}
.estgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.esttile{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;
  padding:14px;background:var(--card);box-shadow:inset 0 0 0 1px var(--rule-2);min-height:64px}
.estpt{font-family:var(--serif);font-size:18px;color:var(--ink);line-height:1.2}
.esten{font-size:11px;color:var(--slate-en2);line-height:1.25}
.estrow{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;
  padding:14px 2px;background:none;border-bottom:1px solid var(--rule)}
.estrb{display:flex;flex-direction:column;gap:1px}
.estn{font-family:var(--mono);font-size:15px;color:var(--slate)}
.estn.terra{color:var(--terra)}

/* ---------- Hoje ---------- */
.hhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.hbrand{font-family:var(--serif);font-style:italic;font-size:19px;color:var(--ink)}
.hhr{display:flex;align-items:center;gap:10px}
.hday{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--terra)}
.thcycle{display:flex;align-items:center;gap:7px;padding:0 10px;min-height:44px;background:none;
  box-shadow:inset 0 0 0 1px var(--rule-2)}
.thsw{width:11px;height:11px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--rule-3)}
.thlab{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--slate)}

/* the session panel — full-bleed inverted block */
.hpanel{background:var(--panel);color:var(--onpanel);padding:26px 22px 24px;
  margin:0 calc(var(--pad) * -1)}
.hplab{font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:var(--onpanelac)}
.hprow{display:flex;align-items:center;gap:16px;margin-top:10px}
.hpnum{font-family:var(--serif);font-size:88px;line-height:.8;color:var(--onpanel)}
.hpside{flex:1;min-width:0}
.hpit{font-family:var(--serif);font-style:italic;font-size:17px;line-height:1.35;color:var(--onpanel)}
.hpen{font-size:11.5px;line-height:1.4;color:var(--onpaneldim)}
.hpsplit{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;
  border-top:1px solid var(--onpanelrule);margin-top:18px;padding-top:14px}
.hps{display:flex;flex-direction:column;gap:1px}
.hpsn{font-family:var(--serif);font-size:26px;line-height:1;color:var(--onpanel)}
.hpsl{font-size:11px;color:var(--onpaneldim)}
.hpse{font-size:10.5px;color:var(--onpaneldim)}
.hpclear{font-family:var(--serif);font-size:30px;line-height:1.15;color:var(--onpanel);margin-top:10px}
.hpnext{font-family:var(--serif);font-style:italic;font-size:16px;color:var(--onpanel);margin-top:16px;line-height:1.4}
.hpnext span{display:block;font-family:var(--sans);font-style:normal;font-size:11.5px;color:var(--onpaneldim)}
.hpcta{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:58px;
  margin-top:18px;background:var(--onpanel);color:var(--panel)}
.hpctapt{font-family:var(--serif);font-size:21px}
.hpctaen{font-size:11.5px;color:var(--panel);opacity:.7}
.hpquiet{display:block;width:100%;margin-top:12px;background:none;
  font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--onpaneldim)}

/* session-length picker */
.lenpick{display:grid;grid-template-columns:repeat(4,1fr);margin-top:18px;
  box-shadow:inset 0 0 0 1px var(--rule-3)}
.lenpick.onpanel{box-shadow:inset 0 0 0 1px var(--onpanelrule)}
.lencell{display:flex;flex-direction:column;align-items:center;gap:1px;padding:9px 4px;
  min-height:46px;background:none;border-right:1px solid var(--rule)}
.lenpick.onpanel .lencell{border-right-color:var(--onpanelrule)}
.lencell:last-child{border-right:0}
.lenn{font-family:var(--serif);font-size:16px;color:var(--ink)}
.lenm{font-size:10.5px;color:var(--slate-en2)}
.lenpick.onpanel .lenn{color:var(--onpanel)}
.lenpick.onpanel .lenm{color:var(--onpaneldim)}
.lencell.on{background:var(--btn)}
.lencell.on .lenn,.lencell.on .lenm{color:var(--onbtn)}
.lenpick.onpanel .lencell.on{background:var(--onpanel)}
.lenpick.onpanel .lencell.on .lenn,.lenpick.onpanel .lencell.on .lenm{color:var(--panel)}

/* section labels, "a seguir" rows */
.hsect{display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 4px;
  padding-bottom:8px;border-bottom:1px solid var(--rule-3)}
.hspt{font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:var(--teal)}
.hsen{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--slate-en2)}
.hnext{margin-top:2px}
.hnrow{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;
  text-align:left;background:none;padding:13px 0;border-bottom:1px solid var(--rule)}
.hnb{display:flex;flex-direction:column;gap:2px;min-width:0}
.hnpt{font-family:var(--serif);font-size:18px;color:var(--ink);line-height:1.2}
.hngloss{font-family:var(--sans);font-size:11.5px;color:var(--slate-en2);margin-left:8px}
.hnd{font-size:11.5px;color:var(--slate-en2)}
.hnar{font-size:17px;color:var(--terra);flex:none}

/* 7-day forecast */
.fchart{display:flex;align-items:flex-end;gap:6px;margin-top:14px}
.fcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px}
.fchart .fcn{font-family:var(--mono);font-size:11px;color:var(--ink)}
.fchart .fcn.today{color:var(--terra)}
.fcwrap{height:44px;width:60%;display:flex;align-items:flex-end}
.fcb{display:block;width:100%;background:var(--rule-2)}
.fcb.today{background:var(--terra)}
.fcd{font-family:var(--mono);font-size:10.5px;color:var(--slate-en2)}

/* progress footer */
.hfoot{margin-top:26px;padding-top:16px;border-top:1px solid var(--rule-3)}
.hfm{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--slate)}
.hfm span{color:var(--slate-en2)}
.hbar{display:flex;height:6px;background:var(--rule);margin-top:8px}
.hbk{background:var(--teal)}
.hbs{background:var(--terra)}
.hcov{font-family:var(--serif);font-size:19px;line-height:1.35;color:var(--ink);margin-top:14px}
.hcove{font-size:12px;color:var(--slate-en2);line-height:1.4;margin-top:3px}

/* ---------- Estudar step 2: buckets ---------- */
.bkmode{font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;
  color:var(--teal);margin:14px 0 2px}
.bkmode span{font-family:var(--mono);letter-spacing:.1em;color:var(--slate-en2)}
.bkpanel{background:var(--panel);padding:14px 16px;margin:16px calc(var(--pad) * -1) 0}
.bkrows{margin-top:6px}
.bkrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;
  padding:15px 2px;border-bottom:1px solid var(--rule)}
.bkb{flex:1;display:flex;flex-direction:column;gap:1px;min-width:0}
.bkpt{font-family:var(--serif);font-size:19px;color:var(--ink);line-height:1.2}
.bken{font-size:11.5px;color:var(--slate-en2)}
.bkn{font-family:var(--mono);font-size:13px;color:var(--slate)}
.bkar{font-size:17px;color:var(--terra)}

/* ---------- session frame ---------- */
.sfhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.sfquit{display:inline-flex;align-items:center;gap:5px;background:none;padding:6px 0;
  font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--terra)}
.sfquit span{color:var(--slate-en2)}
.sfmode{font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:var(--slate)}
.sfcount{font-family:var(--mono);font-size:12px;color:var(--slate)}
.sftrack{height:3px;background:var(--rule);margin-bottom:14px}
.sftrack>span{display:block;height:100%;background:var(--terra)}
.sfrestart{text-align:right;margin:-6px 0 8px}

/* context, on the front and the back */
.ctxcard{background:var(--card);box-shadow:inset 0 0 0 1px var(--rule-2);padding:13px 15px;margin-top:16px}
.ctxlab{font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;color:var(--teal)}
.ctxlab span{font-family:var(--mono);letter-spacing:.1em;color:var(--slate-en2);font-weight:400}
.ctxcue{font-family:var(--serif);font-style:italic;font-size:18px;line-height:1.5;color:var(--ink);margin-top:7px}
.cueblank{border-bottom:2px solid var(--terra);padding:0 14px;margin:0 2px}
.sfsect{display:flex;align-items:baseline;justify-content:space-between;
  margin:20px 0 6px;padding-bottom:6px;border-bottom:1px solid var(--rule-3)}
.sfspt{font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:var(--teal)}
.sfsen{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--slate-en2)}
.ctxfull{font-family:var(--serif);font-style:italic;font-size:20px;line-height:1.45;color:var(--ink)}
.meansit{font-family:var(--serif);font-size:26px;line-height:1.2;color:var(--terra)}
.meanen{font-size:12.5px;color:var(--slate-en2);margin-top:5px;line-height:1.45}

/* word families */
.famrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.famchip{display:flex;flex-direction:column;gap:1px;background:var(--card);
  box-shadow:inset 0 0 0 1px var(--rule-2);padding:8px 11px}
.fampt{font-family:var(--serif);font-size:16px;color:var(--ink);line-height:1.15}
.famen{font-size:10.5px;color:var(--slate-en2);line-height:1.2}

/* audio bar */
.audbar{display:flex;align-items:center;gap:11px;margin-top:20px;
  padding-top:14px;border-top:1px solid var(--rule-3)}
.audplay{flex:none;width:56px;height:56px;background:var(--btn);color:var(--onbtn);font-size:17px;line-height:1}
.audbar.compact .audplay{width:44px;height:44px;font-size:14px}
.audlab{flex:1;display:flex;flex-direction:column;gap:1px;min-width:0}
.audpt{font-family:var(--serif);font-size:16px;color:var(--ink);line-height:1.15}
.auden{font-size:10.5px;color:var(--slate-en2);line-height:1.2}
.spchips{display:flex;gap:0;flex:none;box-shadow:inset 0 0 0 1px var(--rule-3)}
.spchip{min-width:46px;min-height:44px;background:none;font-family:var(--mono);font-size:11px;
  color:var(--slate);border-right:1px solid var(--rule)}
.spchip:last-child{border-right:0}
.spchip.on{background:var(--btn);color:var(--onbtn)}

/* ---------- session end ---------- */
.fim{background:var(--panel);color:var(--onpanel);margin:calc(var(--safe-t) * -1 - 22px) calc(var(--pad) * -1) calc(var(--safe-b) * -1 - 56px);
  min-height:100vh;padding:calc(var(--safe-t) + 46px) 22px calc(var(--safe-b) + 40px);
  display:flex;flex-direction:column}
.fimtop{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--onpanelac)}
.fimtop span{color:var(--onpaneldim)}
.fimlab{font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;
  color:var(--onpaneldim);margin-top:26px}
.fimlab span{font-family:var(--mono);letter-spacing:.1em}
.fimbig{font-family:var(--serif);font-size:42px;line-height:1.08;color:var(--onpanel);margin-top:10px}
.fimen{font-family:var(--serif);font-style:italic;font-size:16px;color:var(--onpaneldim);margin-top:8px}
.fimlines{margin-top:26px;display:flex;flex-direction:column;gap:12px}
.fiml{font-family:var(--serif);font-size:17px;line-height:1.35;color:var(--onpanel)}
.fiml span{display:block;font-family:var(--sans);font-size:11.5px;color:var(--onpaneldim);margin-top:2px}
.fimstats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:30px;
  padding:16px 0;border-top:1px solid var(--onpanelrule);border-bottom:1px solid var(--onpanelrule)}
.fimst{display:flex;flex-direction:column;gap:1px}
.fimn{font-family:var(--serif);font-size:32px;line-height:1;color:var(--onpanel)}
.fimsl{font-size:11.5px;color:var(--onpaneldim)}
.fimse{font-size:10.5px;color:var(--onpaneldim)}
.fimcta{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;min-height:58px;
  margin-top:auto;background:var(--onpanel);color:var(--panel);font-family:var(--serif);font-size:20px}
.fimcta span{font-family:var(--sans);font-size:11.5px;opacity:.7}
.fimalt{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;min-height:54px;
  margin-top:10px;background:none;box-shadow:inset 0 0 0 1px var(--onpanelrule);
  color:var(--onpanel);font-family:var(--serif);font-size:19px}
.fimalt span{font-family:var(--sans);font-size:11.5px;color:var(--onpaneldim)}

/* reduced motion */
@media(prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
:focus-visible{outline:2px solid var(--terracotta);outline-offset:2px}

<div id="app"></div>

<!-- Crash net. Installed before every other script so a syntax error or a
     failed data file can't leave a blank page with the user's progress
     stranded in localStorage. A boot failure gets the full recovery screen;
     an error after the app is up gets a dismissible bar instead. -->
<script>
(function(){
  var shown = false;
  function raw(){ try { return window.localStorage.getItem("milpalavras.v1") || ""; } catch(e){ return ""; } }
  function panel(detail){
    if (shown) return; shown = true;
    var booted = document.getElementById("app") && document.getElementById("app").children.length > 0;
    var d = document.createElement("div");
    d.setAttribute("role","alert");
    d.style.cssText = booted
      ? "position:fixed;left:0;right:0;bottom:0;z-index:9999;background:#5A1F1F;color:#FCFBF8;padding:14px 18px;font:14px/1.45 system-ui,sans-serif"
      : "position:fixed;inset:0;z-index:9999;background:#F6F0E4;color:#241A14;padding:32px 24px;font:15px/1.55 system-ui,sans-serif;overflow:auto";
    d.innerHTML = (booted
        ? '<b>Algo correu mal · something went wrong.</b> O teu progresso está guardado.'
        : '<h1 style="font:italic 34px/1.1 Georgia,serif;margin:0 0 12px">Mil Palavras</h1>' +
          '<p><b>A aplicação não arrancou · the app failed to start.</b></p>' +
          '<p style="color:#6B5F55">O teu progresso continua guardado neste aparelho. Recarrega a página; se continuar, copia o teu progresso para o teres em segurança.<br>' +
          'Your progress is still saved on this device. Reload the page; if it keeps failing, copy your progress out so you have it safely.</p>') +
      '<div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap">' +
        '<button id="crRel" style="font:inherit;padding:10px 16px;cursor:pointer;background:#241A14;color:#FCFBF8;border:0">Recarregar · reload</button>' +
        (raw() ? '<button id="crCopy" style="font:inherit;padding:10px 16px;cursor:pointer;background:transparent;color:inherit;border:1px solid currentColor">Copiar progresso · copy progress</button>' : '') +
        '<button id="crHide" style="font:inherit;padding:10px 16px;cursor:pointer;background:transparent;color:inherit;border:1px solid currentColor">Fechar · dismiss</button>' +
      '</div>' +
      '<pre id="crDet" style="margin-top:14px;font-size:11px;white-space:pre-wrap;opacity:.75;max-height:120px;overflow:auto"></pre>';
    document.body.appendChild(d);
    d.querySelector("#crDet").textContent = String(detail || "").slice(0, 600);
    d.querySelector("#crRel").onclick = function(){ location.reload(); };
    d.querySelector("#crHide").onclick = function(){ d.remove(); shown = false; };
    var c = d.querySelector("#crCopy");
    if (c) c.onclick = function(){
      var t = document.createElement("textarea");
      t.value = raw(); document.body.appendChild(t); t.select();
      try { document.execCommand("copy"); c.textContent = "Copiado · copied"; }
      catch(e){ c.textContent = "Copia manualmente · copy manually"; }
      t.remove();
    };
  }
  window.addEventListener("error", function(e){
    if (e && e.target && e.target !== window && e.target.tagName) return; // ignore asset 404s
    panel(e && (e.message || e.error));
  });
  window.addEventListener("unhandledrejection", function(e){
    panel(e && e.reason && (e.reason.message || e.reason));
  });
})();
</script>
