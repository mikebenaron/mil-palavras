<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F6F0E4">
<title>Mil Palavras — European Portuguese</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23FCFBF8'/><rect x='3.5' y='3.5' width='25' height='25' fill='none' stroke='%231B4D8F' stroke-width='1.5'/><rect x='6.5' y='6.5' width='19' height='19' fill='none' stroke='%234E7FBE' stroke-width='.8'/><rect x='13' y='13' width='6' height='6' fill='%231B4D8F' transform='rotate(45 16 16)'/></svg>">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="fonts.css">
<meta name="apple-mobile-web-app-title" content="Mil Palavras">
<style>
/* ============================================================
   Mil Palavras — "Reading Room" design system
   A bilingual language book: ivory paper, Newsreader serif for the
   language, Karla for chrome, IBM Plex Mono for data. Radius 0,
   rules and inset shadows instead of cards-on-cards.
   ============================================================ */
:root{
  --paper:oklch(96.5% .018 85);
  --card:#FFFDF9;
  --ink:oklch(23% .025 45);
  --slate:oklch(50% .02 50);
  --slate-en:oklch(58% .02 50);
  --slate-en2:oklch(61% .02 50);
  --terracotta:oklch(55% .16 40);
  --terracotta-d:oklch(45% .16 40);
  --teal:oklch(45% .07 195);
  --ochre:oklch(60% .12 70);
  --vinho:oklch(48% .16 20);

  --rule:oklch(23% .025 45 / .14);
  --rule-2:oklch(23% .025 45 / .18);
  --rule-3:oklch(23% .025 45 / .25);
  --ring:oklch(23% .025 45 / .18);

  --serif:'Newsreader',Georgia,'Times New Roman',serif;
  --sans:'Karla',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;

  --pad:26px;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  overscroll-behavior-y:none;
}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;padding:0;margin:0;cursor:pointer;text-align:left}
input{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;outline:none}
::-webkit-scrollbar{width:0;height:0}

#app{
  max-width:680px;margin:0 auto;
  padding:calc(var(--safe-t) + 22px) var(--pad) calc(var(--safe-b) + 56px);
}

/* ---------- shared type primitives ---------- */
.serif{font-family:var(--serif)}
.mono{font-family:var(--mono)}
.eyebrow{font-size:9px;letter-spacing:.22em;text-transform:uppercase;font-weight:700;color:var(--terracotta)}
.eyebrow.teal{color:var(--teal)}
.eyebrow.slate{color:var(--slate)}
.en{color:var(--slate-en)}
.rule{height:0;border:0;border-top:1px solid var(--rule);margin:0}
.rule.strong{border-top:2px solid var(--ink)}
.rule.q{border-top-color:var(--rule-3)}

/* ---------- back link / screen top ---------- */
.backlink{display:inline-flex;align-items:center;gap:7px;font-size:10px;letter-spacing:.18em;
  text-transform:uppercase;font-weight:700;color:var(--terracotta);padding:2px 0;margin-bottom:20px}
.backlink svg{width:11px;height:11px}
.screentitle{font-family:var(--serif);font-size:34px;font-weight:400;line-height:1.05;color:var(--ink);margin:0}
.screentitle .en{display:block;font-family:var(--sans);font-size:12px;letter-spacing:.02em;
  text-transform:none;color:var(--slate-en);margin-top:5px;font-weight:500}
.introp{font-family:var(--serif);font-style:italic;font-size:15px;color:var(--slate);margin:14px 0 2px;line-height:1.5}
.introp + .introe{font-size:12.5px;color:var(--slate-en2);line-height:1.5;margin-bottom:4px}

/* ---------- home: masthead ---------- */
.masthead{text-align:center;padding-bottom:18px;border-bottom:1px solid var(--rule-3)}
.wordmark{font-family:var(--serif);font-style:italic;font-weight:400;font-size:34px;line-height:1;color:var(--ink)}
.caderno{margin-top:9px;font-size:9px;letter-spacing:.28em;text-transform:uppercase;font-weight:700;color:var(--terracotta)}

/* ---------- word of the day / card face ---------- */
.wod{display:block;width:100%;text-align:center;padding:26px 4px;border-bottom:1px solid var(--rule-3)}
.wod .kicker{font-size:9px;letter-spacing:.22em;text-transform:uppercase;font-weight:700;color:var(--teal);margin-bottom:16px}
.wod .word{font-family:var(--serif);font-size:46px;line-height:1.0;color:var(--ink);font-weight:400}
.wod .ipa{font-family:var(--mono);font-size:11.5px;color:var(--slate);margin-top:14px;letter-spacing:.01em}
.wod .answer{font-family:var(--serif);font-size:30px;line-height:1.1;color:var(--terracotta);font-weight:400}
.wod .ex{font-family:var(--serif);font-style:italic;font-size:17px;color:var(--slate);margin-top:12px;line-height:1.45}
.wod .exe{font-size:12px;color:var(--slate-en2);margin-top:3px}
.wod .hint{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--slate);margin-top:18px}
.fade-in{animation:fadein .16s ease both}
@keyframes fadein{from{opacity:0}to{opacity:1}}

/* ---------- KPI columns ---------- */
.kpis{display:flex;padding:20px 0;border-bottom:1px solid var(--rule-3)}
.kpi{flex:1;text-align:center;padding:0 6px}
.kpi + .kpi{border-left:1px solid var(--rule)}
.kpi .n{font-family:var(--serif);font-size:28px;line-height:1;color:var(--ink);font-weight:400}
.kpi.terra .n{color:var(--terracotta)}
.kpi.teal .n{color:var(--teal)}
.kpi .lp{font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--slate);margin-top:9px;font-weight:600}
.kpi .le{font-size:10px;color:var(--slate-en);margin-top:2px}

/* ---------- numbered contents list ---------- */
.contents{margin-top:4px}
.citem{display:flex;align-items:baseline;gap:16px;width:100%;padding:15px 0;border-bottom:1px solid var(--rule)}
.citem .no{font-family:var(--mono);font-size:10px;color:var(--terracotta);flex:none;width:18px;padding-top:4px}
.citem .ctbody{flex:1;min-width:0}
.citem .ct{display:block;font-family:var(--serif);font-size:20px;color:var(--ink);line-height:1.15}
.citem .cs{display:block;font-size:11.5px;color:var(--slate);margin-top:2px}
.citem .tail{font-family:var(--mono);font-size:11px;color:var(--slate);flex:none;align-self:center}
.citem:active .ct{color:var(--terracotta)}
@media(hover:hover){.citem:hover .ct{color:var(--terracotta)}.citem:hover{border-bottom-color:var(--rule-3)}}

/* ---------- footer ---------- */
.footer{margin-top:26px;padding-top:4px}
.footer .fp{font-family:var(--serif);font-style:italic;font-size:14.5px;color:var(--slate);line-height:1.5}
.footer .fe{font-size:12px;color:var(--slate-en2);margin-top:5px;line-height:1.5}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:14px 18px;font-family:var(--sans);font-size:13.5px;font-weight:700;
  letter-spacing:.02em;border-radius:0;transition:background .12s,color .12s,box-shadow .12s}
.btn.block{display:flex;width:100%}
.btn.fill{background:var(--ink);color:var(--paper)}
.btn.outline{box-shadow:inset 0 0 0 1.4px var(--ink);color:var(--ink)}
.btn.terra{background:var(--terracotta);color:var(--paper)}
@media(hover:hover){
  .btn.fill:hover{background:var(--terracotta)}
  .btn.outline:hover{background:var(--ink);color:var(--paper)}
}
.btnrow{display:flex;gap:10px;margin-top:20px}
.btnrow .btn{flex:1}

/* small text button (audio, etc.) */
.txtbtn{display:inline-flex;align-items:center;gap:6px;font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;font-weight:700;color:var(--teal);padding:6px 0}
.txtbtn svg{width:13px;height:13px}

/* ---------- progress track ---------- */
.progresshead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.progresshead .pl{font-size:9px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:var(--terracotta)}
.progresshead .pc{font-family:var(--mono);font-size:10px;color:var(--slate)}
.track{height:2px;background:var(--rule);position:relative;overflow:hidden}
.track>span{display:block;height:100%;background:var(--terracotta)}

/* ---------- review / card face on paper ---------- */
.cardface{text-align:center;padding:28px 4px 8px}
.cardface .klass{font-size:9px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:var(--slate);margin-bottom:16px}
.cardface .word{font-family:var(--serif);font-size:46px;line-height:1.05;color:var(--ink)}
.cardface .ipa{font-family:var(--mono);font-size:11.5px;color:var(--slate);margin-top:14px}
.cardface .hr{height:0;border-top:1px solid var(--rule);width:60%;margin:22px auto}
.cardface .answer{font-family:var(--serif);font-size:28px;color:var(--terracotta);line-height:1.15}

/* note + footnote cards */
.note{background:var(--card);box-shadow:inset 0 0 0 1px oklch(23% .025 45 / .12);padding:15px 16px;margin-top:14px}
.note .nl{font-size:9px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;color:var(--slate);margin-bottom:9px}
.note .np{font-family:var(--serif);font-size:19px;color:var(--ink);line-height:1.4}
.note .ne{font-size:12.5px;color:var(--slate-en);margin-top:4px;line-height:1.45}
.footnote{background:var(--card);box-shadow:inset 3px 0 0 var(--teal);padding:14px 16px 14px 18px;margin-top:14px}
.footnote .np{font-family:var(--serif);font-size:15.5px;color:var(--ink);line-height:1.45}
.footnote .ne{font-size:12.5px;color:var(--slate-en);margin-top:4px;line-height:1.45}

/* grade buttons */
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:22px}
.grade{display:flex;flex-direction:column;align-items:center;gap:5px;padding:13px 4px;
  box-shadow:inset 0 0 0 1.4px var(--ring);background:var(--card)}
.grade .gl{font-size:13.5px;font-weight:700}
.grade .gi{font-family:var(--mono);font-size:9.5px;color:var(--slate)}
.grade.again{box-shadow:inset 0 0 0 1.4px var(--vinho)}.grade.again .gl{color:var(--vinho)}
.grade.hard{box-shadow:inset 0 0 0 1.4px var(--ochre)}.grade.hard .gl{color:var(--ochre)}
.grade.good{box-shadow:inset 0 0 0 2px var(--teal)}.grade.good .gl{color:var(--teal)}
.grade.easy{box-shadow:inset 0 0 0 1.4px var(--terracotta)}.grade.easy .gl{color:var(--terracotta)}
.kbdhint{font-family:var(--mono);font-size:10px;color:var(--slate);text-align:center;margin-top:14px}

/* ---------- multiple choice ---------- */
.choices{display:flex;flex-direction:column;gap:8px;margin-top:20px}
.choice{width:100%;padding:16px 18px;font-family:var(--serif);font-size:16px;color:var(--ink);
  background:var(--card);box-shadow:inset 0 0 0 1px var(--rule-2)}
.choice.right{box-shadow:inset 0 0 0 2px var(--teal);color:var(--teal);font-weight:600}
.choice.wrong{box-shadow:inset 0 0 0 2px var(--vinho);color:var(--vinho)}
.choice.dim{opacity:.4}

/* ---------- type it ---------- */
.typeprompt{font-family:var(--serif);font-size:32px;color:var(--ink);text-align:center;margin:8px 0 24px}
.typeline{font-family:var(--serif);font-size:30px;color:var(--ink);min-height:56px;width:100%;
  border-bottom:2px solid var(--terracotta);padding:6px 2px;text-align:center}
.accents{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-top:20px}
.akey{width:46px;height:46px;display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-size:20px;color:var(--ink);box-shadow:inset 0 0 0 1px var(--rule-3)}
@media(hover:hover){.akey:hover{background:var(--ink);color:var(--paper)}}

/* ---------- o ou a ---------- */
.genderword{font-family:var(--serif);font-size:46px;color:var(--ink);text-align:center;margin:6px 0 4px}
.gendersub{text-align:center;font-size:13px;color:var(--slate-en);margin-bottom:24px}
.genderopts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gopt{padding:30px 0;text-align:center;font-family:var(--serif);font-size:40px;color:var(--ink);
  background:var(--card);box-shadow:inset 0 0 0 1.4px var(--ring)}
.gopt.right{box-shadow:inset 0 0 0 2.5px var(--teal);color:var(--teal)}
.gopt.wrong{box-shadow:inset 0 0 0 2.5px var(--vinho);color:var(--vinho)}
.gopt.dim{opacity:.4}
.explain{background:var(--card);box-shadow:inset 3px 0 0 var(--teal);padding:14px 16px 14px 18px;margin-top:20px}
.explain .np{font-family:var(--serif);font-size:15.5px;color:var(--ink);line-height:1.45}
.explain .ne{font-size:12.5px;color:var(--slate-en);margin-top:4px;line-height:1.45}

/* ---------- lists (pickers) ---------- */
.booklist{border-top:2px solid var(--ink);margin-top:18px}
.brow{display:flex;align-items:baseline;gap:16px;width:100%;padding:15px 0;border-bottom:1px solid var(--rule)}
.brow .bt{flex:1;min-width:0}
.brow .bp{font-family:var(--serif);font-size:19px;color:var(--ink);line-height:1.15}
.brow .be{font-size:11.5px;color:var(--slate-en);margin-top:2px}
.brow .bs{font-size:11.5px;color:var(--slate);margin-top:2px}
.brow .tail{font-family:var(--mono);font-size:11px;color:var(--slate);flex:none;align-self:center}
@media(hover:hover){.brow:hover .bp{color:var(--terracotta)}}

/* ---------- dictionary ---------- */
.searchrow{display:flex;align-items:center;gap:10px;border-top:2px solid var(--ink);border-bottom:1px solid var(--rule);padding:12px 2px}
.searchrow svg{width:15px;height:15px;stroke:var(--slate);flex:none}
.searchrow input{flex:1;font-size:14px;color:var(--ink)}
.searchrow input::placeholder{color:var(--slate-en2)}
.classfilter{display:flex;flex-wrap:wrap;gap:16px;padding:14px 0}
.cf{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--slate);padding-bottom:3px;font-weight:600}
.cf.on{color:var(--terracotta);border-bottom:2px solid var(--terracotta)}
.dgroup{font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;color:var(--slate);
  margin:22px 0 4px;padding-top:12px;border-top:2px solid var(--ink)}
.dentry{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--rule)}
.dentry .dot{width:6px;height:6px;border-radius:50%;flex:none}
.dot.known{background:var(--teal)}.dot.learning{background:var(--ochre)}.dot.new{background:oklch(23% .025 45 / .2)}
.dentry .dp{font-family:var(--serif);font-size:18px;color:var(--ink);flex:1}
.dentry .de{font-size:12.5px;color:var(--slate-en);text-align:right}

/* ---------- settings ---------- */
.field{padding:18px 0;border-bottom:1px solid var(--rule)}
.field .fl{font-family:var(--serif);font-size:19px;color:var(--ink)}
.field .fle{font-size:11.5px;color:var(--slate-en);margin-top:1px}
.field .fh{font-size:12px;color:var(--slate);margin-top:8px;line-height:1.45}
.field .fhe{font-size:11.5px;color:var(--slate-en2);margin-top:2px;line-height:1.45}
.stepper{display:flex;align-items:center;gap:18px;margin-top:14px}
.stepper button{width:46px;height:46px;display:flex;align-items:center;justify-content:center;
  font-size:22px;box-shadow:inset 0 0 0 1.4px var(--ink);color:var(--ink)}
.stepper .val{font-family:var(--serif);font-size:30px;color:var(--ink);min-width:44px;text-align:center}
.seg{display:flex;gap:0;margin-top:14px}
.seg button{flex:1;text-align:center;padding:11px 0;font-size:12.5px;font-weight:600;
  box-shadow:inset 0 0 0 1px var(--rule-3);color:var(--slate)}
.seg button.on{background:var(--ink);color:var(--paper);box-shadow:none}
.tgl{display:flex;align-items:center;justify-content:space-between;gap:14px}
.tglstate{font-family:var(--mono);font-size:10px;letter-spacing:.14em;padding:6px 12px;flex:none}
.tglstate.on{background:var(--teal);color:var(--card)}
.tglstate.off{box-shadow:inset 0 0 0 1px var(--rule-3);color:var(--slate)}
.datasum{font-family:var(--mono);font-size:11px;color:var(--slate);line-height:1.6;margin-top:6px}

/* ---------- method ---------- */
.mrow{display:flex;gap:16px;padding:18px 0;border-bottom:1px solid var(--rule)}
.mrow .mn{font-family:var(--mono);font-size:11px;color:var(--terracotta);flex:none;width:22px;padding-top:5px}
.mrow .mt{font-family:var(--serif);font-size:19px;color:var(--ink);line-height:1.2}
.mrow .mte{font-size:11.5px;color:var(--slate-en);margin-top:1px}
.mrow .mb{font-size:13px;color:var(--slate);margin-top:8px;line-height:1.5}
.mrow .mbe{font-size:12px;color:var(--slate-en2);margin-top:3px;line-height:1.5}

/* ---------- grammar text table ---------- */
.gtable{border-top:2px solid var(--ink);margin-top:18px}
.gthead{display:flex;padding:8px 0;font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--slate);font-weight:700}
.gtrow{display:flex;padding:11px 0;border-bottom:1px solid var(--rule);align-items:baseline}
.gtlabel{width:31%;flex:none;font-size:12.5px;color:var(--slate);padding-right:10px}
.gtcell{flex:1;font-family:var(--serif);font-size:17.5px;color:var(--ink)}
.gthead .gtlabel{color:var(--slate)}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 26px);transform:translateX(-50%);
  background:var(--ink);color:var(--paper);font-size:12.5px;padding:10px 16px;z-index:50;letter-spacing:.02em}

/* ---------- account panel (sync) reuse ---------- */
#syncMount .hint{font-size:11.5px;color:var(--slate-en)}
.stack{display:flex;flex-direction:column;gap:10px}
.mt{margin-top:12px}
.quiet{box-shadow:inset 0 0 0 1px var(--rule-3);color:var(--ink);background:none}

/* reduced motion */
@media(prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
:focus-visible{outline:2px solid var(--terracotta);outline-offset:2px}

</style>
</head>
<body>
<div id="app"></div>
<!-- Accounts + sync must be defined BEFORE the app script below, so the boot
     sequence can gate on auth (window.MilSync) instead of hitting the fallback. -->
<script src="vendor/supabase.js"></script>

z vá amanhã.","Maybe I'll go tomorrow."],"também":["Eu também quero ir.","I want to go too."],"aqui / cá":["Vem cá!","Come here!"],"ali / lá":["O banco fica ali.","The bank is over there."],"muito":["Obrigado, gostei muito.","Thank you, I really liked it."],"quase":["Está quase pronto.","It's almost ready."],"só / apenas":["Só quero um café.","I just want a coffee."],"mas":["Quero ir, mas não posso.","I want to go, but I can't."],"porque":["Não fui porque estava doente.","I didn't go because I was ill."],"quando":["Quando chegas?","When do you arrive?"],"se":["Se chover, ficamos em casa.","If it rains, we'll stay home."],"embora":["Embora esteja cansado, vou sair.","Although I'm tired, I'm going out."],"portanto / por isso":["Estava a chover, por isso ficámos em casa.","It was raining, so we stayed home."],"eu":["Eu sou de Londres.","I'm from London."],"tu":["Tu falas muito depressa.","You speak very fast."],"você":["O senhor quer alguma coisa?","Would you like anything, sir?"],"nós":["Nós vamos de carro.","We're going by car."],"me":["Ele deu-me o livro.","He gave me the book."],"te":["Eu ligo-te logo.","I'll call you later."],"mim":["Isto é para mim?","Is this for me?"],"ti":["Estou a falar contigo, não com ele.","I'm talking to you, not to him."],"meu / minha":["A minha casa fica ali.","My house is over there."],"seu / sua":["O seu passaporte, por favor.","Your passport, please."],"este / esta":["Este é o meu irmão.","This is my brother."],"isto":["O que é isto?","What's this?"],"aquele / aquela":["Prefiro aquele ali.","I prefer that one over there."],"tudo":["Está tudo bem?","Is everything OK?"],"nada":["Não quero nada, obrigado.","I don't want anything, thanks."],"alguém":["Está aí alguém?","Is anyone there?"],"ninguém":["Não está cá ninguém.","There's nobody here."],"cada":["Cada pessoa paga a sua conta.","Each person pays their own bill."]},"notes":{"o problema":"Masculine despite the -a. Greek-derived words ending in -ema and -oblema are all masculine: <em>o problema, o sistema, o tema, o cinema</em>.","o sistema":"Masculine despite the -a — same Greek family as <em>o problema</em> and <em>o tema</em>.","o tema":"Masculine despite the -a, like <em>o problema</em> and <em>o sistema</em>.","o planeta":"Masculine despite the -a.","o dia":"Masculine despite the -a. So it's <em>bom dia</em> but <em>boa tarde</em> and <em>boa noite</em>.","a mão":"Feminine despite the -ão, and the plural is <em>as mãos</em>, not <em>as mões</em>. One of the most common gender mistakes there is.","o país":"Masculine. Note the accent — <em>país</em> (country) versus <em>pais</em> (parents) is only that í.","a razão":"Feminine. Nouns in <em>-ão</em> split: those from Latin <em>-tio</em> (razão, relação, ação) are feminine; concrete ones (o irmão, o coração, o chão) are masculine.","o coração":"Masculine, even though most <em>-ão</em> abstractions are feminine. Compare <em>a razão</em>.","a cor":"Feminine. Most -or nouns are masculine (<em>o valor, o amor, o calor</em>), so this one has to be learned.","a gente":"Takes a <em>third person singular</em> verb: <em>a gente vai</em>, never <em>a gente vamos</em>. It means <em>we</em> in casual speech but is grammatically an <em>it</em>.","as costas":"Always plural for the human back. <em>A costa</em> singular is the coastline — different word entirely.","a costa":"Coastline. Your back is <em>as costas</em>, always plural.","o pelo":"Body hair. Don't confuse with the contraction <em>pelo</em> (= por + o), which is far more common in text.","a pena":"Two lives: a feather, and a penalty. Also the everyday <em>vale a pena</em> (it's worth it) and <em>que pena!</em> (what a shame!).","a conta":"Restaurant bill, bank account, and a sum in maths. <em>A conta, por favor</em> is the one you'll use most.","o tempo":"Both time and weather. <em>Não tenho tempo</em> (no time); <em>está bom tempo</em> (nice weather).","a vez":"A time as in an occurrence or a turn — <em>três vezes</em>, <em>a tua vez</em>. Clock time is <em>a hora</em>; duration is <em>o tempo</em>.","o largo":"As a noun, a small town square. As an adjective it means wide. Portuguese addresses are full of them: <em>Largo do Carmo</em>.","a massa":"Dough, pasta, or mass. Portuguese doesn't borrow the Italian word.","o banco":"Bank and bench. Context sorts it out.","a secretária":"A desk, and also a female secretary. The furniture meaning is the common one.","assistir":"False friend: it means to attend or to watch, not to assist. To help someone is <em>ajudar</em>.","pretender":"False friend: to intend, not to pretend. To pretend is <em>fingir</em>.","realizar":"Usually to carry out or to hold (an event), not to realise mentally. That's <em>aperceber-se</em> or <em>dar-se conta</em>.","perceber":"In Portugal this is the ordinary word for <em>to understand</em>. In Brazil it leans towards <em>to notice</em> — a genuine dialect split.","esperar":"Covers both waiting and hoping: <em>espero que sim</em> means I hope so.","ficar":"Enormously useful and hard to pin down: to stay, to become, to be located, to suit. <em>Fico em casa. Fiquei doente. O banco fica ali. Fica-te bem.</em>","a casa de banho":"Portugal only. In Brazil it's <em>o banheiro</em>, which in Portugal would suggest a lifeguard.","a equipa":"Portuguese spelling. Brazil writes <em>a equipe</em>.","o frigorífico":"Portugal. Brazil says <em>a geladeira</em>.","a rapariga / a menina":"In Portugal <em>rapariga</em> is the neutral everyday word for a girl or young woman. In Brazil it is offensive — use <em>menina</em> or <em>moça</em> there.","o facto":"Portuguese spelling keeps the c. Brazil writes <em>fato</em> — which in Portugal means a suit.","o contacto":"Portuguese spelling keeps the c; Brazil writes <em>contato</em>.","a t-shirt":"Borrowed straight from English and used constantly in Portugal.","o telhado":"The roof from outside. The ceiling seen from inside is <em>o teto</em>.","gostar":"Always takes <em>de</em>: <em>gosto de café</em>, <em>gostas de mim?</em> Never <em>gosto café</em>.","precisar":"Takes <em>de</em>: <em>preciso de ajuda</em>, <em>precisas de alguma coisa?</em>","depender":"Takes <em>de</em>: <em>depende do tempo</em>.","pertencer":"Takes <em>a</em>: <em>este livro pertence-me</em> / <em>pertence ao João</em>.","casar":"Usually reflexive in practice: <em>casar-se com alguém</em>.","lembrar-se":"Reflexive and takes <em>de</em>: <em>lembro-me de ti</em>. Without the pronoun, <em>lembrar</em> means to remind.","esquecer":"Two patterns: <em>esqueci o livro</em> (plain) or <em>esqueci-me do livro</em> (reflexive + de). The second is more common in speech.","aperceber-se":"Reflexive and takes <em>de</em>: <em>aperceber-se de algo</em>. This is the real translation of <em>to realise</em>.","ser":"Permanent or defining: origin, profession, personality, time. <em>Sou inglês. É segunda-feira.</em> For states and locations, use <em>estar</em>.","estar":"Temporary states and, in Portugal, position: <em>estou cansado</em>, <em>está frio</em>. For a permanent location Portuguese often prefers <em>ficar</em>: <em>o banco fica ali</em>.","saber":"To know a fact or how to do something: <em>sei nadar</em>, <em>não sei</em>. To know a person or place is <em>conhecer</em>.","conhecer":"To know a person, place or thing by acquaintance: <em>conheço o Porto</em>. Knowing a fact is <em>saber</em>.","por":"Cause, route, exchange, agent — the <em>through/by/for the sake of</em> preposition. <em>Passei por Lisboa. Obrigado por tudo.</em> Contrast with <em>para</em>, which is destination and purpose.","para":"Destination and purpose: <em>vou para casa</em>, <em>isto é para ti</em>. If you could say <em>in order to</em>, it's <em>para</em>.","muito":"Invariable before adjectives and verbs (<em>muito bom</em>, <em>trabalho muito</em>), but agrees before nouns: <em>muitos livros</em>, <em>muitas pessoas</em>.","levar":"To take something away from here. To bring something towards here is <em>trazer</em> — Portuguese keeps the distinction strictly.","trazer":"To bring towards the speaker. Taking away is <em>levar</em>.","ouvir":"To hear, and in practice also to listen: <em>ouço música</em>. <em>Escutar</em> exists but is more deliberate.","olhar":"To look — takes <em>para</em>: <em>olha para mim</em>. To see is <em>ver</em>; to watch a film is <em>ver</em> too.","haver":"In practice you only need the third person <em>há</em>: <em>há uma farmácia ali</em> (there is), <em>há dois anos</em> (two years ago). The other forms are rare.","ir":"Followed by an infinitive it forms the everyday future: <em>vou comer</em> — I'm going to eat. Portuguese uses this far more than the true future tense.","dever":"Obligation or probability: <em>deves ir</em> (you should go), <em>deve estar em casa</em> (he's probably home). Also to owe money.","andar":"Beyond walking, it marks an ongoing state: <em>ando cansado</em> — I've been tired lately.","obrigado":"Agrees with <em>you</em>, the speaker — not with the person you're thanking. A man always says <em>obrigado</em>, whoever he's talking to.","obrigada":"Agrees with the speaker. A woman always says <em>obrigada</em>, whoever she's talking to.","boa noite":"Both a greeting on arrival after dark and a farewell. Portuguese doesn't split it into evening and night.","desculpe":"Formal, for strangers. <em>Desculpa</em> is what you say to friends and family. Same split as <em>tu</em> versus <em>você</em>.","desculpa":"Informal. Use <em>desculpe</em> with strangers, older people, or anyone you'd address formally.","com licença":"Used to get past someone or to excuse yourself from a room. To apologise, use <em>desculpe</em>.","tu":"The normal informal <em>you</em> in Portugal, used with friends, family and colleagues. Brazil mostly uses <em>você</em> here instead.","você":"Formal and oddly awkward in Portugal — it can sound distancing. With strangers the Portuguese often drop the pronoun altogether and use the third person: <em>Quer um café?</em>","vocês":"The standard plural <em>you</em> in both countries. There's no plural of <em>tu</em> in everyday use.","se":"Does a lot of work: reflexive (<em>chama-se</em>), impersonal (<em>vende-se</em>), and the conjunction <em>if</em>. Context separates them.","a":"Also the feminine article and a direct-object pronoun. Three common words share this one letter.","o":"Also the masculine article and a direct-object pronoun.","que":"The workhorse: <em>that</em>, <em>which</em>, <em>who</em>, and part of most questions (<em>o que é que…</em>). Portuguese rarely drops it the way English drops <em>that</em>.","de":"Contracts compulsorily with articles: de + o = <em>do</em>, de + a = <em>da</em>. You will almost never write <em>de o</em>.","em":"Contracts with both definite and indefinite articles: em + o = <em>no</em>, em + uma = <em>numa</em>.","mais":"Also forms comparatives: <em>mais rápido do que</em>. Note <em>do que</em>, not just <em>que</em>, in careful European Portuguese.","já":"Slippery: <em>already</em> in statements, <em>yet</em> in questions, and <em>right now</em> as an order. <em>Já comi. Já chegaste? Vem já!</em>","pois":"In Portugal often just a filler agreement noise, roughly <em>right</em> or <em>indeed</em>, as well as the conjunction <em>because</em>.","logo":"Later today, not immediately. <em>Até logo</em> means see you later — same day.","bem":"The adverb of <em>bom</em>. You say <em>o jantar foi bom</em> (adjective) but <em>corri bem</em> (adverb). Mixing them is the commonest slip."},"grammar":[{"id":"artigos","title":"Articles","intro":"Every Portuguese noun carries a gender, and the article tells you which. Learn nouns with their article attached — <em>a mesa</em>, never just <em>mesa</em>.","tables":[{"cols":["","Def. m.","Def. f.","Indef. m.","Indef. f."],"rows":[["Singular","o","a","um","uma"],["Plural","os","as","uns","umas"]]}],"notes":["Definite (o/a/os/as) = <em>the</em>. Indefinite (um/uma/uns/umas) = <em>a / an / some</em>."]},{"id":"contracoes","title":"Preposition contractions","intro":"Four prepositions fuse with the article that follows them. These are compulsory — you cannot say <em>de o</em>.","tables":[{"cols":["+","o","a","os","as"],"rows":[["a","ao","à","aos","às"],["de","do","da","dos","das"],["em","no","na","nos","nas"],["por","pelo","pela","pelos","pelas"]]},{"cols":["+","um","uma","uns","umas"],"rows":[["em","num","numa","nuns","numas"]]}],"notes":["<em>Vou ao mercado</em> — I'm going to the market. <em>Estou na cozinha</em> — I'm in the kitchen."]},{"id":"plurais","title":"Making nouns plural","intro":"Five rules cover almost everything.","tables":[{"cols":["Ending","Rule","Example"],"rows":[["vowel","add -s","o tempo → os tempos"],["consonant","add -es","a vez → as vezes"],["-m","becomes -ns","o homem → os homens"],["-l","becomes -is","o final → os finais"],["-ão","usually -ões","a relação → as relações"]]}],"notes":["-ão is the awkward one: some go to -ãos (o chão → os chãos) or -ães (o cão → os cães). Exceptions are flagged in square brackets on the cards."]},{"id":"presente","title":"Present tense","intro":"Verbs come in three families, named after their infinitive ending: -ar, -er, -ir. Drop the ending, add the one below. This single tense will carry most of your early conversations.","tables":[{"cols":["","falar","escrever","existir"],"rows":[["eu","falo","escrevo","existo"],["tu","falas","escreves","existes"],["ele / ela / você","fala","escreve","existe"],["nós","falamos","escrevemos","existimos"],["vocês / eles / elas","falam","escrevem","existem"]]}],"notes":["The highest-frequency verbs — <em>ser, ter, estar, ir, fazer, poder, dizer, ver, vir</em> — are all irregular. Learn those as whole shapes rather than trying to derive them.","In Portugal <em>tu</em> is the everyday informal <em>you</em>; <em>você</em> is formal and used less than in Brazil. With strangers, Portuguese often skips the pronoun entirely and uses the third person: <em>Quer um café?</em>"]},{"id":"serestar","title":"ser vs estar","intro":"Both mean <em>to be</em>. Roughly: ser is what something <em>is</em>, estar is how it <em>is right now</em>.","tables":[{"cols":["","ser (permanent)","estar (temporary)"],"rows":[["eu","sou","estou"],["tu","és","estás"],["ele / ela / você","é","está"],["nós","somos","estamos"],["vocês / eles / elas","são","estão"]]}],"notes":["<em>Ele é aborrecido</em> — he's a boring person. <em>Ele está aborrecido</em> — he's bored at the moment. Same adjective, different verb, very different insult."]},{"id":"pronomes","title":"Pronouns","intro":"Subject pronouns replace the doer. Clitic pronouns replace the object and never follow a preposition. Tonic pronouns always do.","tables":[{"cols":["","Subject","Clitic","After a preposition"],"rows":[["1st sing.","eu","me","mim"],["2nd sing.","tu","te","ti"],["3rd sing.","ele / ela / você","se, o, a, lhe","si, ele, ela"],["1st pl.","nós","nos","nós"],["2nd pl.","vocês","vos","vocês"],["3rd pl.","eles / elas","se, os, as, lhes","si, eles, elas"]]}],"notes":["European Portuguese usually puts the clitic <em>after</em> the verb, hyphenated: <em>chamo-me Mike</em>. Brazilian Portuguese puts it before. Negatives and questions flip it back to the front: <em>não me chamo Mike</em>."]},{"id":"possessivos","title":"Possessives","intro":"Possessives agree with the thing owned, not the owner. <em>A minha casa</em> stays feminine whether the owner is a man or a woman.","tables":[{"cols":["","m. sing.","m. pl.","f. sing.","f. pl."],"rows":[["eu","meu","meus","minha","minhas"],["tu","teu","teus","tua","tuas"],["você","seu","seus","sua","suas"],["ele / ela","dele / dela","dele / dela","dele / dela","dele / dela"],["nós","nosso","nossos","nossa","nossas"],["vocês","vosso","vossos","vossa","vossas"],["eles / elas","deles / delas","deles / delas","deles / delas","deles / delas"]]}],"notes":["Portuguese keeps the article: <em>o meu carro</em>, not <em>meu carro</em>. Dropping it sounds Brazilian."]},{"id":"demonstrativos","title":"Demonstratives","intro":"Three distances, not two. Near me, near you, near neither of us.","tables":[{"cols":["","m. sing.","m. pl.","f. sing.","f. pl.","Invariable"],"rows":[["near me","este","estes","esta","estas","isto"],["near you","esse","esses","essa","essas","isso"],["over there","aquele","aqueles","aquela","aquelas","aquilo"]]}],"notes":["The invariable forms are for things you can't or won't name: <em>O que é isto?</em> — what is this?"]},{"id":"adjetivos","title":"Adjectives","intro":"Adjectives agree with the noun in gender and number, and normally sit after it: <em>um carro vermelho</em>. Cards show the masculine singular.","tables":[{"cols":["Masculine ends in","Feminine"],"rows":[["-o","swap to -a — bonito → bonita"],["-dor","add -a — assustador → assustadora"],["anything else","no change — grande, feliz, fácil"]]}],"notes":["Two irregulars worth memorising now: <em>bom → boa</em> and <em>mau → má</em>.","Comparatives: <em>mais … do que</em> (more), <em>menos … do que</em> (less), <em>tão … como</em> (as … as). Superlative: <em>o mais / o menos …</em>","Shades of colour take a hyphen: <em>azul-escuro</em>, <em>castanho-claro</em>."]},{"id":"adverbios","title":"Adverbs","intro":"Most manner adverbs are built from an adjective: take the feminine form and add -mente.","tables":[{"cols":["Adjective","Adverb","English"],"rows":[["rápido","rapidamente","quickly"],["fácil","facilmente","easily"],["calmo","calmamente","calmly"],["infeliz","infelizmente","unfortunately"]]}],"notes":["Useful shortcut: a great many English -ly adverbs map straight onto Portuguese -mente. <em>frequently → frequentemente</em>."]}],"pron":[["ã, õ, -m, -ns","Nasal. Air goes through the nose and the consonant mostly disappears. <em>não</em>, <em>bem</em>, <em>manhã</em>."],["unstressed e","Often swallowed almost to nothing, which is why spoken European Portuguese sounds compressed. <em>de</em> ≈ \"duh\", <em>telefone</em> ≈ \"tlfon\"."],["s at the end / before a consonant","Sounds like <em>sh</em>. <em>os livros</em> ≈ \"oosh leevroosh\". This is the single biggest giveaway between Lisbon and São Paulo."],["r at the start, or rr","Guttural, back of the throat, close to a French r. <em>rua</em>, <em>carro</em>."],["lh / nh","Like the middle of <em>million</em> and <em>onion</em>. <em>filho</em>, <em>manhã</em>."],["ç","Always a soft s. <em>coração</em>, <em>almoço</em>."],["ão","Nasal \"ow\" — the vowel of <em>now</em>, sent through the nose. <em>não</em>, <em>pão</em>, <em>irmão</em>."]],"method":[["Do the review first, every day.","Twenty minutes today beats three hours on Sunday. The scheduler only works if you meet it roughly when it asks — the whole point is being tested just as you're about to forget."],["Answer honestly.","Again is not a failure, it's information. Marking something Good because you nearly had it is how a deck quietly fills with words you don't actually know."],["Recall before you flip.","Say the answer out loud, or at least commit to one in your head, before revealing. The effort of retrieval is what builds the memory — reading the answer does almost nothing."],["Go both ways.","PT → EN gets you reading and listening. EN → PT is what you need to actually speak, and it's much harder. Type it mode forces production, including the spelling and the accents."],["Learn the gender with the word.","Portuguese nouns are useless without their article, and retrofitting gender later is miserable. o or a? drills exactly this."],["Let it be a bit uncomfortable.","Cards that feel too easy aren't teaching you anything. The ones that make you pause are doing the work."],["Fifteen new words a day is plenty.","That's about 450 a month, and it keeps tomorrow's review pile survivable. Turn it up only if you're clearing your reviews comfortably."],["Deal with leeches.","A word you've failed six times won't be fixed by seeing it a seventh. Look it up in a real sentence, attach it to an image or a person, then reset it."]]};</script>

var S;
function freshState(){
  var classes = {};
  CLASS_ORDER.forEach(function(k){ classes[k] = true; });
  return {
    v:1, prog:{}, newToday:0, lastDay:0, streak:0, best:0, reviews:0, seenDays:0,
    set:{ perDay:15, dir:"pt", tips:true, audio:true, rate:"steady", classes:classes }
  };
}
function save(){ S._updatedAt = Date.now(); Store.save(S); if (window.MilSync) window.MilSync.push(S); }

function dayNo(ts){ var d = ts ? new Date(ts) : new Date(); d.setHours(0,0,0,0); return Math.round(d.getTime()/86400000); }

function rollDay(){
  var t = dayNo();
  if (S.lastDay === t) return;
  if (S.lastDay === 0) { S.lastDay = t; S.newToday = 0; return; }
  if (t - S.lastDay === 1 && S.reviews > 0) { /* streak continues when they study */ }
  S.newToday = 0;
  S.lastDay = t;
  save();
}
function markStudied(){
  var t = dayNo();
  if (S.studiedDay === t) return;
  if (S.studiedDay === t - 1) S.streak = (S.streak||0) + 1; else S.streak = 1;
  S.studiedDay = t;
  S.seenDays = (S.seenDays||0) + 1;
  if (S.streak > (S.best||0)) S.best = S.streak;
}

/* ============================ scheduler ============================ */
function progOf(id){ return S.prog[id]; }
function isDue(id){ var p = S.prog[id]; return p && p.d <= dayNo(); }
function known(id){ var p = S.prog[id]; return p && p.iv >= 21; }
function leech(id){ var p = S.prog[id]; return p && (p.l||0) >= 6; }

function dueList(){
  var t = dayNo(), out = [];
  for (var k in S.prog) { if (S.prog[k].d <= t) { var c = BY_ID[k]; if (c) out.push(c); } }
  return out;
}
/* Words, conjugations and grammar are drawn from three separate queues and
   interleaved, so drills start appearing on day one instead of waiting until
   all 990 words have been introduced. */
function newPool(){
  var w = [], j = [], g = [];
  for (var i=0;i<CARDS.length;i++){
    var c = CARDS[i];
    if (S.prog[c.i]) continue;
    if (!S.set.classes[c.c]) continue;
    if (c.c === "conjugacao") j.push(c);
    else if (c.c === "gramatica") g.push(c);
    else w.push(c);
  }
  var out = [], iw = 0, ij = 0, ig = 0;
  while (iw < w.length || ij < j.length || ig < g.length){
    for (var n=0; n<3 && iw < w.length; n++) out.push(w[iw++]);
    if (ij < j.length) out.push(j[ij++]);
    if (ig < g.length) out.push(g[ig++]);
  }
  return out;
}
function newAllowance(){ return Math.max(0, S.set.perDay - (S.newToday||0)); }

function grade(id, g){
  var t = dayNo();
  var p = S.prog[id] || { r:0, e:2.5, iv:0, d:t, l:0 };
  var isNew = !S.prog[id];
  if (isNew) { S.newToday = (S.newToday||0) + 1; }
  if (g === 1) {
    p.l = (p.l||0) + 1; p.r = 0; p.iv = 0; p.e = Math.max(1.3, p.e - 0.2); p.d = t;
  } else if (g === 2) {
    p.iv = p.r === 0 ? 1 : Math.max(1, Math.round(p.iv * 1.2));
    p.e = Math.max(1.3, p.e - 0.15); p.r++; p.d = t + p.iv;
  } else if (g === 3) {
    p.iv = p.r === 0 ? 1 : (p.r === 1 ? 3 : Math.round(p.iv * p.e));
    p.r++; p.d = t + p.iv;
  } else {
    p.iv = p.r === 0 ? 3 : Math.round(p.iv * p.e * 1.3);
    p.e = Math.min(3.0, p.e + 0.15); p.r++; p.d = t + p.iv;
  }
  p.iv = Math.min(p.iv, 365 * 3);
  S.prog[id] = p;
  S.reviews = (S.reviews||0) + 1;
  markStudied();
  save();
}
function previewIv(id, g){
  var p = S.prog[id] || { r:0, e:2.5, iv:0, l:0 };
  var iv;
  if (g === 1) return "now";
  if (g === 2) iv = p.r === 0 ? 1 : Math.max(1, Math.round(p.iv * 1.2));
  else if (g === 3) iv = p.r === 0 ? 1 : (p.r === 1 ? 3 : Math.round(p.iv * p.e));
  else iv = p.r === 0 ? 3 : Math.round(p.iv * p.e * 1.3);
  iv = Math.min(iv, 1095);
  if (iv < 30) return iv + "d";
  if (iv < 365) return Math.round(iv/30) + "mo";
  return (Math.round(iv/36.5)/10) + "y";
}

    var eu = pt.filter(function(v){ return norm(v) === "pt-pt"; });
    var list = eu.length ? eu : pt;
    if (!list.length) { voice = null; status = "none"; return true; }
    list = list.slice().sort(function(a,b){ return score(b) - score(a); });

      setTimeout(function(){

  /* the deck writes alternatives with slashes and ellipses; a synth reads those aloud */

    ok: function(){ return supported && status !== "none" && status !== "unsupported"; },
    supported: function(){ return supported; },
    status: function(){ return status; },

    lang: function(){ return voice ? voice.lang : null; },

var CONJ = DATA.conj, WHY = DATA.why, STEMSHIFT = DATA.stem, EXS = DATA.ex, NOTES = DATA.notes;

var PRES = { ar:["o","as","a","amos","am"], er:["o","es","e","emos","em"], ir:["o","es","e","imos","em"] };
var PRET = { ar:["ei","aste","ou","ámos","aram"], er:["i","este","eu","emos","eram"], ir:["i","iste","iu","imos","iram"] };
var PRET_VOWEL_IR = ["í","íste","iu","ímos","íram"];

function bareVerb(p){ return p.replace(/-se$/,""); }

function pretStem(stem, group, i){
  if (group !== "ar" || i !== 0) return stem;

  if (/g$/.test(stem)) return stem.slice(0,-1) + "gu";   // chegar → cheguei
  if (/ç$/.test(stem)) return stem.slice(0,-1) + "c";    // começar → comecei

}

  var stem = group ? v.slice(0,-2) : null;
  var out = { group:group, regular:!explicit, pres:null, pret:null, presReg:true, pretReg:true };

  if (explicit && explicit.p) { out.pres = explicit.p; out.presReg = false; }
  else if (group) out.pres = PRES[group].map(function(e){ return stem + e; });

  if (explicit && explicit.t) { out.pret = explicit.t; out.pretReg = false; }
  else if (group) {
    var realVowel = /[aeiou]$/.test(stem) && !/[gq]u$/.test(stem);
    var ends = (group === "ir" && realVowel) ? PRET_VOWEL_IR : PRET[group];
    out.pret = ends.map(function(e,i){ return pretStem(stem, group, i) + e; });

  if (/guir$/.test(v)) return WHY.guir;
  if (/uir$/.test(v)) return WHY.uir;
  if (/zir$/.test(v)) return WHY.zir;
  if (STEMSHIFT.indexOf(v) >= 0) return WHY.stem;

/* ---- noun morphology ---- */
function pluralOf(w){
  if (/ão$/.test(w))  return w.slice(0,-2) + "ões";
  if (/m$/.test(w))   return w.slice(0,-1) + "ns";
  if (/vel$/.test(w)) return w.slice(0,-3) + "veis";
  if (/al$/.test(w))  return w.slice(0,-2) + "ais";
  if (/el$/.test(w))  return w.slice(0,-2) + "éis";
  if (/ol$/.test(w))  return w.slice(0,-2) + "óis";
  if (/ul$/.test(w))  return w.slice(0,-2) + "uis";
  if (/il$/.test(w))  return w.slice(0,-2) + "is";
  if (/ês$/.test(w))  return w.slice(0,-2) + "eses";
  if (/[sxz]$/.test(w)) return w + "es";
  if (/r$/.test(w))   return w + "es";
  if (/n$/.test(w))   return w + "es";

function pluralRule(w){
  if (/ão$/.test(w))  return "ends in <em>-ão</em>, so the plural is normally <em>-ões</em> — but this is the one ending with real exceptions (<em>-ãos</em>, <em>-ães</em>)";
  if (/m$/.test(w))   return "ends in <em>-m</em>, which becomes <em>-ns</em> in the plural";
  if (/vel$/.test(w)) return "ends in <em>-vel</em>, which becomes <em>-veis</em>";
  if (/l$/.test(w))   return "ends in <em>-l</em>, which is replaced by <em>-is</em>";
  if (/[sxzrn]$/.test(w)) return "ends in a consonant, so the plural adds <em>-es</em>";

/* ---- adjective morphology ---- */
var ADJ_IRREG = { "bom":"boa", "mau":"má" };
var ADV_IRREG = { "bom":"bem", "mau":"mal" };

  if (ADJ_IRREG[w]) return ADJ_IRREG[w];
  if (/o$/.test(w))   return w.slice(0,-1) + "a";
  if (/dor$/.test(w)) return w + "a";
  if (/ês$/.test(w))  return w.slice(0,-2) + "esa";
  if (/eu$/.test(w))  return w.slice(0,-2) + "eia";

}
function adverbOf(w){

/* ---- suffix families: the highest-leverage thing to notice ---- */
var SUFFIX = [
  [/ção$/,  "<b>-ção → English -tion</b>, and every one of them is feminine. Spotting this suffix unlocks several hundred words in one go: <em>informação, situação, produção, organização</em>."],
  [/dade$/, "<b>-dade → English -ty</b>, always feminine: <em>cidade/city, liberdade/liberty, qualidade/quality, realidade/reality</em>."],
  [/agem$/, "<b>-agem → English -age</b>, feminine: <em>viagem/voyage, imagem/image</em>."],
  [/mento$/,"<b>-mento → English -ment</b>, masculine: <em>movimento, documento, conhecimento</em>."],
  [/(ência|ância)$/, "<b>-ência / -ância → English -ence / -ance</b>, feminine: <em>experiência/experience, importância/importance</em>."],
  [/ismo$/, "<b>-ismo → English -ism</b>, masculine."],
  [/ista$/, "<b>-ista → English -ist</b>. Same form for both genders — only the article changes: <em>o artista / a artista</em>."],
  [/(ável|ível)$/, "ADJ<b>-vel → English -ble</b>: <em>possível/possible, terrível/terrible, disponível/available</em>. Plural is <em>-veis</em>."],
  [/oso$/, "<b>-oso → English -ous</b>: <em>famoso/famous, maravilhoso/marvellous</em>. Feminine <em>-osa</em>."],
  [/ura$/, "<b>-ura → often English -ure</b>, feminine: <em>cultura, literatura, estrutura</em>."],
  [/mente$/,"<b>-mente → English -ly</b>. Built from the <em>feminine</em> of an adjective, which is why it's <em>rápida → rapidamente</em>."]

  for (var i=0;i<SUFFIX.length;i++){

    if (body.indexOf("ADJ") === 0) {          // adjective-only pattern
      if (cls !== "adjetivo") continue;

    }

  }

    bits.push("The matching adverb is <em>" + esc(ADV_IRREG[w]) + "</em>, not a <em>-mente</em> form — <em>bom/bem</em> and <em>mau/mal</em> are the two that behave like English <em>good/well</em>.");

function advTip(c){

function pairTip(p){
  if (p.indexOf("/") < 0) return null;
  if (/^o\/a\s/.test(p) || /\/\s*a\s/.test(p)) {
    return "Person nouns come as a pair, and the pattern is predictable: <em>-o</em> swaps to <em>-a</em> (<em>o primo / a prima</em>), <em>-or</em> adds an <em>-a</em> (<em>o professor / a professora</em>), and words ending in <em>-e</em> or <em>-ista</em> don't change at all — only the article moves (<em>o/a presidente</em>).";
  }
  return "Two words for the same thing, both in ordinary use. Learn whichever feels easier to say and recognise the other when you hear it.";
}
function buildTips(c){
  if (c.k) return drillTips(c);
  var parts = [];
  var ex = EXS[c.p];
  if (ex) parts.push(tipBlock("ex", "In use",
    '<span class="s">' + esc(ex[0]) + sayBtn(ex[0], "inline") + '</span>' +
    '<span class="t">' + esc(ex[1]) + '</span>'));

  if (c.c === "verbo") parts.push(verbTip(c));
  else if (c.c === "substantivo") parts.push(nounTip(c));
  else if (c.c === "adjetivo" || c.c === "cor") parts.push(adjTip(c));
  else if (c.c === "adverbio") parts.push(advTip(c));

  var suf = suffixNote(c.b || c.p, c.c);
  if (suf) parts.push(tipBlock("rule", "Pattern", suf));

  if (NOTES[c.p]) parts.push(tipBlock("note", "Watch out", NOTES[c.p]));

  parts = parts.filter(Boolean);
  if (!parts.length) {
    var sub = SUB_TIP[c.c + "|" + (c.s || "")];
    var pair = pairTip(c.p);
    if (pair) parts.push(tipBlock("rule", "Form", pair));
    else if (sub) parts.push(tipBlock("rule", "Worth knowing", sub));
    else if (CLASS_TIP[c.c]) parts.push(tipBlock("rule", "Worth knowing", CLASS_TIP[c.c]));
  }
  return parts.length ? '<div class="tips">' + parts.join("") + '</div>' : "";
}
function tipsFor(c){ return (S.set.tips === false) ? "" : buildTips(c); }

/* a drill card explains the rule behind the answer, then shows the whole
   table it came from — so the form is never learned as an isolated string */
function drillTips(c){
  var parts = [];
  if (c.t) parts.push(tipBlock("rule", "Why", c.t));
  if (c.v) {
    var cj = conjugate(c.v);
    if (cj.pres) parts.push(tipBlock("conj-wrap", "Full table · " + esc(c.v), conjTable(cj, c.v)));
    var key = c.w ? c.w.p : c.v;
    var ex = EXS[key];
    if (ex) parts.push(tipBlock("ex", "In use",
      '<span class="s">' + esc(ex[0]) + sayBtn(ex[0], "inline") + '</span>' +
      '<span class="t">' + esc(ex[1]) + '</span>'));
    if (NOTES[key]) parts.push(tipBlock("note", "Watch out", NOTES[key]));
  }
  return parts.length ? '<div class="tips">' + parts.join("") + '</div>' : "";

   Everything below is built at runtime from the same data the tips use, so
   the file stays small. Two new card families:
     conjugacao — one card per verb, per person, per tense
     gramatica  — one card per cell of every grammar table, plus cloze usage
   They grade and schedule exactly like word cards.                        */

var DRILLS = [];
var PLABEL = ["eu", "tu", "ele / ela / você", "nós", "vocês / eles / elas"];
var BIGNINE = ["ser","ter","estar","ir","fazer","poder","dizer","ver","vir"];

function conjWhy(v, cj, key, irr){
  var g = cj.group, bits = [];
  if (key === "p") {
    if (!irr && g) bits.push("Regular <em>-" + g + "</em> verb: drop the <em>-" + g +
      "</em> and add <em>" + PRES[g].join(" / ") + "</em>. That is the whole rule for this tense.");
    else {
      bits.push("Irregular in the present — this form has to be learned as a shape, not derived.");
      var w = whyIrregular(v); if (w) bits.push(w);
    }
  } else {
    if (!irr && g) bits.push("Regular past (<em>pretérito perfeito</em>): <em>" + PRET[g].join(" / ") + "</em>." +
      (g === "ar" ? " The accent on <em>-ámos</em> is what separates past from present in Portugal." : ""));
    else bits.push("Irregular past. The stems (<em>fiz-, disse-, tive-, pus-</em> and friends) are shared across the commonest verbs, so learning one helps with the rest.");
  }
  return bits.join(" ");
}

(function buildConjugation(){
  var out = [];
  WORDS.forEach(function(c){
    if (c.c !== "verbo") return;
    var v = bareVerb(c.p), rfx = reflexive(c.p);
    var cj = conjugate(v);
    if (!cj.pres) return;
    var sets = [["p", "present", cj.pres, !cj.presReg]];
    if (cj.pret) sets.push(["t", "past", cj.pret, !cj.pretReg]);
    sets.forEach(function(t){
      var forms = t[2].map(function(f, i){
        if (!f || f === "—") return null;
        if (!rfx) return f;
        var base = (i === 3) ? f.replace(/s$/, "") : f;   // nós loses its -s before -nos
        return base + CLITIC[i];
      });
      forms.forEach(function(f, i){
        if (!f) return;
        var others = [];
        forms.forEach(function(g, gi){
          if (!g || gi === i || g === f || others.indexOf(g) >= 0) return;
          others.push(g);
        });
        out.push({
          i: "c|" + c.p + "|" + t[0] + "|" + i,
          k: 1, c: "conjugacao", v: v, w: c, rf: rfx ? 1 : 0,
          s: t[1] + " · " + (t[3] ? "irregular" : "regular"),
          q: PLABEL[i],
          qs: v + " · " + t[1] + " · " + c.e,
          e: v + " (" + c.e + ") — " + PLABEL[i] + ", " + t[1],
          p: f,
          x: others,
          a: rfx ? [f, f.replace(/-/g, " ")] : [f],
          t: conjWhy(v, cj, t[0], t[3]) +
             (rfx ? " Reflexive: the pronoun hooks onto the end with a hyphen. After a negative or a question word it jumps in front instead." : ""),
          rank: (t[3] ? 0 : 2) + (t[0] === "p" ? 0 : 1) + (BIGNINE.indexOf(v) >= 0 ? -4 : 0)
        });
      });
    });
  });
  out.sort(function(a, b){ return a.rank - b.rank; });
  DRILLS = DRILLS.concat(out);
})();

(function padDistractors(){

function drillGroups(kind){
  var seen = {}, order = [];
  for (var i = 0; i < CARDS.length; i++) {
    var c = CARDS[i];
    if (c.c !== kind) continue;
    if (seen[c.s] === undefined) { seen[c.s] = 0; order.push(c.s); }
    seen[c.s]++;
  }
  return order.map(function(s){ return [s, seen[s]]; });
}
