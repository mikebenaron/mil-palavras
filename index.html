function renderReading(id){
  var r = null; for (var i=0;i<READINGS.length;i++) if (READINGS[i].id === id) r = READINGS[i];
  if (!r) return renderReadingPicker();
  // Opening a passage counts as the day's reading — the plan shouldn't nag
  // once you've actually sat down with a text.
  if (LAST_READING !== id) { LAST_READING = id; bumpAct("read"); }
  /* Remember which texts have been opened, and which was last, so the picker
     can mark them and offer to pick up where you left off. */
  if (!S.read) S.read = {};
  if (!S.read[id]) S.read[id] = dayNo();
  S.readLast = id;
  save();
  /* Decode the opening lines and fetch the rest, so "Ouvir a história" starts
     immediately and doesn't gap between sentences. */
  if (Recorded.warm) (r.lines || []).forEach(function(l, i){
    if (!l.pt) return;
    if (i === 0) Recorded.warm(l.pt);
    else setTimeout(function(){ Recorded.prefetch(l.pt); }, 800 + i * 200);
  });

  var modes = [{k:"read",l:"Ler"}];
  if (r.gaps && r.gaps.length) modes.push({k:"fill",l:"Preencher"});
  modes.push({k:"translate",l:"Traduzir"});
  if (r.questions && r.questions.length) modes.push({k:"quiz",l:"Perguntas"});
  if (!modes.some(function(m){ return m.k === READMODE; })) READMODE = "read";
  var qstate = quizStateFor(r, id), quizSel = qstate.sel;

  var seg = '<div class="seg" style="margin:16px 0 4px">' + modes.map(function(m){
    return '<button class="' + (READMODE===m.k?"on":"") + '" data-rm="' + m.k + '">' + m.l + '</button>';
  }).join("") + '</div>';

  /* Listen and reveal-all sat *below* the passage, which on every text means
     below the fold: you had to scroll past the whole story to discover it
     could be read to you. They belong with the mode tabs, above the text. */
  var readTools = (READMODE === "read" || READMODE === "translate")
    ? '<div class="rtools">' +
        (READMODE === "read" && ReadAloud.available(r)
          ? '<button class="txtbtn" data-listen="1">' +
            '<svg width="13" height="13" viewBox="0 0 20 20" fill="none" stroke="currentColor" ' +
            'stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
            '<path d="M4 7.5h2.5L10 4.5v11L6.5 12.5H4z" fill="currentColor" stroke="none"/>' +
            '<path d="M13 7.4a3.6 3.6 0 010 5.2"/></svg>' +
            '<span class="lbl-play">ouvir · listen</span>' +
            '<span class="lbl-stop">parar · stop</span></button>' : '') +
        '<button class="txtbtn" data-revealall="1">revelar · reveal all</button>' +
      '</div>'
    : "";

  var body;
  if (READMODE === "read") {
    body = '<div class="passage">' + r.lines.map(function(l, i){
      return '<div class="rline" data-i="' + i + '"><div class="rpt">' + tapWords(l.pt) + '</div>' +
        '<div class="ren">' + esc(l.en) + '</div></div>';
    }).join("") + '</div>' +
    '<div class="pcap" style="margin-top:14px">Toca numa <b>palavra</b> para ver a informação; toca no <b>espaço</b> da frase para a tradução. · Tap a <b>word</b> for its info; tap the sentence for its translation.</div>';
  } else if (READMODE === "translate") {
    body = '<div class="passage">' + r.lines.map(function(l, i){
      return '<div class="rline tmode" data-i="' + i + '"><div class="ten">' + esc(l.en) + '</div>' +
        '<div class="tpt">' + esc(l.pt) + '</div></div>';
    }).join("") + '</div>' +
    '<div class="pcap" style="margin-top:14px">Diz ou escreve cada frase em português; toca para ver a resposta. · Say or write each line in Portuguese, then tap to reveal.</div>';
  } else if (READMODE === "quiz") {
    body = '<div class="quiz">' + r.questions.map(function(qq, qi){
      var opts = (qstate.order[qi] || qq.options.map(function(_, i){ return i; })).map(function(oi){
        var sel = quizSel[qi] === oi ? " sel" : "";
        return '<button class="qopt' + sel + '" data-q="' + qi + '" data-o="' + oi + '">' +
          esc(qq.options[oi]) + '</button>';
      }).join("");
      return '<div class="qblock"><div class="qtext">' + esc(qq.q) + '</div>' +
        (qq.qE ? '<div class="qtexte">' + esc(qq.qE) + '</div>' : '') +
        '<div class="qopts">' + opts + '</div></div>';
    }).join("") + '</div>' +
    '<button class="btn fill block" style="margin-top:16px" data-quizcheck="1">Verificar · check</button>' +
    '<div id="quizres"></div>';
  } else {
    var used = {}, gi = 0;
    var cloze = r.lines.map(function(l){
      var t = esc(l.pt);
      r.gaps.forEach(function(w){
        if (used[w]) return;
        var re = new RegExp("(^|[^0-9A-Za-zÀ-ÿ])(" + escapeRe(esc(w)) + ")([^0-9A-Za-zÀ-ÿ]|$)");
        if (re.test(t)) {
          used[w] = true;
          t = t.replace(re, function(m,a,b,c){
            /* Each gap carries a stable index and re-renders with whatever
               was typed into it. Switching to Ler and back used to wipe a
               half-finished cloze with no warning, because the inputs only
               ever existed in the DOM. */
            var n = gi++, was = qstate.fill[n] || "";
            return a + '<input class="gapinput" data-ans="' + b + '" data-gi="' + n + '" ' +
              'size="' + Math.max(4, b.length + 1) + '" value="' + esc(was) + '" ' +
              'autocapitalize="off" autocorrect="off" spellcheck="false">' + c;
          });
        }
      });
      return '<span class="clozeline">' + t + '</span> ';
    }).join("");
    var accents = ACCENTS.map(function(a){ return '<button class="akey" data-racc="' + a + '">' + a + '</button>'; }).join("");
    var bank = shuffle(r.gaps.slice()).map(function(w){
      return '<button class="wbchip" data-word="' + esc(w) + '">' + esc(w) + '</button>';
    }).join("");
    body = '<div class="pcap" style="margin-top:12px">Toca numa palavra e ela vai para a próxima lacuna. · Tap a word and it drops into the next gap.</div>' +
      '<div class="wbank">' + bank + '</div>' +
      '<div class="passage cloze">' + cloze + '</div>' +
      '<div class="accents" style="margin-top:14px">' + accents + '</div>' +
      '<div class="btnrow" style="margin-top:14px">' +
        '<button class="btn outline" data-transl="1">Ver tradução · translation</button>' +
        '<button class="btn fill" data-check="1">Verificar · check</button></div>' +
      '<div id="translbox" style="display:none"></div>' +
      '<div id="clozeres"></div>';
  }

  var srcLbl = r.src || "Texto original · Mil Palavras";
  var srcLine = '<div class="srcline"><span class="lvl">' + esc(r.level) + '</span>' +
    'Fonte · source: ' + (r.srcUrl ? '<a href="' + esc(r.srcUrl) + '" target="_blank" rel="noopener noreferrer">' + esc(srcLbl) + '</a>' : esc(srcLbl)) +
    (r.pt_note ? ' · português europeu' : '') +
    (r.ai ? ' · <span class="aimark">✳ texto gerado por IA · AI-generated</span>' : '') + '</div>';

  renderPage("leitura", screenTitle(r.title, r.titleE) + seg + readTools + body + srcLine,
    function(){ renderReading(id); }, "leitura", "Leitura · reading");

  on("[data-rm]","click",function(e){ READMODE = e.currentTarget.getAttribute("data-rm"); renderReading(id); });
  // Word tap wins over the line's reveal-translation tap. The guard is a
  // belt-and-braces backup for stopPropagation below.
  on("[data-i]","click",function(e){
    if (e.target && e.target.closest && e.target.closest(".wtap")) return;
    e.currentTarget.classList.toggle("show");
  });
  on("[data-w]","click",function(e){ e.stopPropagation(); showWordInfo(e.currentTarget.getAttribute("data-w")); });
  on("[data-listen]","click",function(){ ReadAloud.toggle(r); });
  on("[data-revealall]","click",function(){
    var n = app.querySelectorAll(".rline"); for (var j=0;j<n.length;j++) n[j].classList.add("show");
  });
  // cloze wiring
  var gaps = app.querySelectorAll(".gapinput");
  for (var g=0; g<gaps.length; g++) {
    gaps[g].addEventListener("focus", function(e){ readGap = e.target; });
    gaps[g].addEventListener("input", function(e){
      qstate.fill[e.target.getAttribute("data-gi")] = e.target.value;
    });
  }
  /* A word already dropped into a gap shouldn't still be offered in the bank
     after a re-render. */
  (function(){
    var taken = {};
    for (var j=0;j<gaps.length;j++) if (gaps[j].value) taken[norm(gaps[j].value)] = 1;
    var chips = app.querySelectorAll("[data-word]");
    for (var k=0;k<chips.length;k++)
      if (taken[norm(chips[k].getAttribute("data-word"))]) {
        chips[k].classList.add("used"); chips[k].setAttribute("disabled","");
      }
  })();
  on("[data-racc]","click",function(e){
    if (!readGap) return;
    var a = e.currentTarget.getAttribute("data-racc");
    var s = readGap.selectionStart || readGap.value.length;
    readGap.value = readGap.value.slice(0,s) + a + readGap.value.slice(readGap.selectionEnd || s);
    readGap.focus(); readGap.setSelectionRange(s+1, s+1);
  });
  // word bank: tap a word to drop it into the focused-or-next empty gap
  on("[data-word]","click",function(e){
    var w = e.currentTarget.getAttribute("data-word");
    var target = (readGap && !readGap.value && !readGap.disabled) ? readGap : null;
    if (!target) for (var j=0;j<gaps.length;j++){ if (!gaps[j].value && !gaps[j].disabled){ target = gaps[j]; break; } }
    if (!target) return;
    target.value = w;
    qstate.fill[target.getAttribute("data-gi")] = w;
    e.currentTarget.classList.add("used"); e.currentTarget.setAttribute("disabled","");
    for (var k=0;k<gaps.length;k++){ if (!gaps[k].value){ gaps[k].focus(); readGap = gaps[k]; break; } }
  });
  on("[data-transl]","click",function(){
    var box = document.getElementById("translbox");
    if (!box.innerHTML){
      box.innerHTML = '<div class="note" style="margin-top:14px"><div class="nl">Tradução · translation</div>' +
        r.lines.map(function(l){ return '<div class="ne" style="font-size:13px;margin-top:5px">' + esc(l.en) + '</div>'; }).join("") + '</div>';
      box.style.display = "block";
    } else { box.style.display = box.style.display === "none" ? "block" : "none"; }
  });
  on("[data-check]","click",function(){
    var ok = 0, tot = gaps.length;
    for (var j=0;j<gaps.length;j++){
      var inp = gaps[j], right = norm(inp.getAttribute("data-ans")) === norm(inp.value);
      inp.classList.remove("right","wrong"); inp.classList.add(right ? "right" : "wrong");
      if (right) ok++; else inp.value = inp.getAttribute("data-ans");
      inp.disabled = true;
    }
    document.getElementById("clozeres").innerHTML =
      '<div class="explain" style="margin-top:16px"><div class="eyebrow ' + (ok===tot?"teal":"") + '" style="margin-bottom:6px">' +
      (ok===tot ? "Tudo certo · all correct" : ok + " / " + tot + " certas · correct") + '</div>' +
      '<div class="ne">As palavras em falta aparecem a cheio. · The missing words are shown filled in.</div></div>';
  });
  // quiz wiring
  on("[data-o]","click",function(e){
    var qi = e.currentTarget.getAttribute("data-q");
    quizSel[qi] = +e.currentTarget.getAttribute("data-o");
    var sibs = app.querySelectorAll('[data-q="' + qi + '"]');
    for (var s=0;s<sibs.length;s++) sibs[s].classList.remove("sel");
    e.currentTarget.classList.add("sel");
  });
  on("[data-quizcheck]","click",function(){
    if (!r.questions) return;
    var ok = 0;
    r.questions.forEach(function(qq, qi){
      var opts = app.querySelectorAll('[data-q="' + qi + '"]');
      for (var o=0;o<opts.length;o++){
        /* Options are rendered shuffled, so the button's position is no
           longer its identity — read the original index off the element. */
        var oi = +opts[o].getAttribute("data-o");
        opts[o].classList.remove("sel");
        if (oi === qq.answer) opts[o].classList.add("right");
        else if (quizSel[qi] === oi) opts[o].classList.add("wrong");
        opts[o].setAttribute("disabled","");
      }
      if (quizSel[qi] === qq.answer) ok++;
    });
    qstate.checked = true;
    document.getElementById("quizres").innerHTML =
      '<div class="explain" style="margin-top:16px"><div class="eyebrow ' + (ok===r.questions.length?"teal":"") + '" style="margin-bottom:6px">' +
      ok + " / " + r.questions.length + " certas · correct</div>" +
      '<div class="ne">A resposta certa fica a verde. · The correct answer is shown in green.</div></div>' +
      '<button class="btn outline block" style="margin-top:12px" data-quizagain="1">' +
        'Tentar outra vez · try again</button>';
    /* Re-shuffling on retry matters: a second pass through the same order
       tests where the answer sat, not whether the passage was understood. */
    on("[data-quizagain]","click",function(){ READQ.id = null; renderReading(id); });
  });
  bindNav();
}

/* Wiring for the offline-audio downloader in Definições. Kept out of
   renderSettings so a re-render during a download doesn't restart it. */
function bindAudioDownload(){
  if (!AudioStore.ok()) return;
  var fill = document.getElementById("dlfill"),
      stat = document.getElementById("dlstat"),
      goBtn = app.querySelector('[data-dl="go"]'),
      stopBtn = app.querySelector('[data-dl="stop"]'),
      rmBtn = app.querySelector('[data-dl="rm"]');
  if (!fill || !stat) return;

  function paint(p){
    if (!fill.isConnected) return;              // user navigated away
    var pct = p.total ? Math.round(p.done / p.total * 100) : 0;
    fill.style.width = pct + "%";
    var mb = Math.round(p.done / Math.max(p.total,1) * (Recorded.bytes() / 1048576));
    stat.textContent = p.done >= p.total
      ? "Tudo descarregado · all " + p.total + " clips downloaded" + (p.failed ? " (" + p.failed + " failed)" : "")
      : p.done + " / " + p.total + " · ~" + mb + " MB" + (p.failed ? " · " + p.failed + " failed" : "");
  }
  function busy(on){
    if (goBtn) goBtn.hidden = on;
    if (stopBtn) stopBtn.hidden = !on;
    if (rmBtn) rmBtn.disabled = on;
  }

  AudioStore.status().then(function(s){ paint({ done:s.have, total:s.total, failed:0 }); });
  busy(AudioStore.running());

  if (goBtn) goBtn.addEventListener("click", function(){
    busy(true);
    stat.textContent = "A descarregar… · downloading…";
    AudioStore.downloadAll(paint).then(function(r){
      busy(false);
      if (r.error && /quota|space/i.test(r.error))
        toast("Sem espaço no aparelho · not enough space");
      else if (r.aborted) toast("Parado · stopped");
      else if (r.failed) toast(r.failed + " falharam · failed — try again");
      else toast("Áudio pronto sem ligação · audio ready offline");
      AudioStore.status().then(function(s){ paint({ done:s.have, total:s.total, failed:0 }); });
    });
  });
  if (stopBtn) stopBtn.addEventListener("click", function(){ AudioStore.stop(); busy(false); });
  if (rmBtn) rmBtn.addEventListener("click", function(){
    AudioStore.remove().then(function(){
      toast("Descarregados removidos · downloads removed");
      paint({ done:0, total:Recorded.allSources().length, failed:0 });
    });
  });
}

/* ============================ boot ============================ */
Store.init().then(function(saved){
  S = saved && saved.prog ? saved : freshState();
  if (!S.set) S.set = freshState().set;
  if (!S.set.classes) S.set.classes = freshState().set.classes;
  if (S.set.tips === undefined) S.set.tips = true;
  if (S.set.audio === undefined) S.set.audio = true;
  if (!S.set.rate) S.set.rate = "steady";
  /* One-time move off recognition-only review. "pt" was the shipped default
     rather than a choice anyone made, and it let the whole deck reach "known"
     without a single word ever being produced under test. Runs once and
     records that it ran, so choosing "pt" deliberately afterwards sticks. */
  /* The ladder became four independent switches. Carry the old "up to rung N"
     value across so nobody's queue changes shape on upgrade. */
  if (!S.set.tlv) {
    S.set.tlv = {};
    var upTo = (S.set.tlvl >= 1 && S.set.tlvl <= TMAX) ? S.set.tlvl : 2;
    for (var lv = 1; lv <= TMAX; lv++) S.set.tlv[lv] = lv <= upTo;
  }
  if (!S.set.dirMoved) {
    if (S.set.dir === "pt") S.set.dir = "mix";
    S.set.dirMoved = 1;
  }
  CLASS_ORDER.forEach(function(k){ if (S.set.classes[k] === undefined) S.set.classes[k] = true; });
  applyTheme();
  try {
    window.matchMedia("(prefers-color-scheme: dark)")
      .addEventListener("change", function(){ if (themeSetting() === "auto") applyTheme(); });
  } catch(e){}
  /* iOS discards a backgrounded PWA freely, and the restart used to land on
     home with the session gone. Restore the stack, and let the edge-swipe and
     the Android back button pop it. */
  if (S.ui && S.ui.nav && S.ui.nav.length) NAV = S.ui.nav.slice();
  try {
    window.addEventListener("popstate", function(){
      if (NAV.length > 1) { NAV.pop(); navRemember(); }
      var to = navTop();
      NAV_SUPPRESS = true;
      try { go(to); } finally { NAV_SUPPRESS = false; }
    });
  } catch(e){}
  rollDay();
  startApp();
}).catch(function(){
  S = freshState();
  startApp();
});

/* Hand the account/sync layer a bridge to the app's private state, then let it
   decide whether to show the login screen or enter the app (account-first). */
function attachSync(){
  if (!window.MilSync) return false;
  window.MilSync.attach({
    get: function(){ return S; },
    set: function(ns){
      S = ns;
      if (!S.set) S.set = freshState().set;
      CLASS_ORDER.forEach(function(k){ if (S.set.classes[k] === undefined) S.set.classes[k] = true; });
    },
    persist: function(){ Store.save(S); },   // raw save: no timestamp bump, no re-push
    save: save,
    render: function(){ openStartScreen(); },
    freshState: freshState,
    // True while a study session is running — an auto-pull must not swap the
    // state out from under a session in progress.
    busy: function(){ return !!SES; },
    // Redraw whatever is on screen after remote progress has been applied,
    // without navigating the user somewhere else.
    refresh: function(){
      if (SES) return;
      if (LAST_RENDER) { try { LAST_RENDER(); return; } catch(e){} }
      renderHome();
    }
  });
  return true;
}
/* Home, unless a manifest shortcut (?go=review) asked for somewhere else. */
function openStartScreen(){
  var m = /[?&]go=([a-z]+)/.exec(location.search);
  if (m){
    history.replaceState(null, "", location.pathname);
    try { return go(m[1]); } catch(e){ /* unknown target — fall through to home */ }
  }
  /* Come back to where you were, not to the top. Only for today, and only for
     a screen that still exists. */
  var back = S.ui && S.ui.nav && S.ui.nav[S.ui.nav.length - 1];
  var fresh = S.ui && S.ui.at && (Date.now() - S.ui.at) < 36e5 * 12;
  if (back && back !== "home" && fresh) {
    NAV_SUPPRESS = true;
    try { go(back); return; } catch(e){ /* fall through */ }
    finally { NAV_SUPPRESS = false; }
  }
  renderHome();
}
function startApp(){
  /* Ask for durable storage up front. Without it iOS evicts the audio cache
     under pressure, and every clip quietly becomes a network fetch again —
     which is what a 100-300ms baseline with occasional multi-second stalls
     looks like. This was only being requested during "download all audio". */
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e){}
  // Check on launch and whenever the app comes back to the foreground — that's
  // when a phone that's been asleep for a week would otherwise stay stale.
  setTimeout(checkForUpdate, 2500);
  document.addEventListener("visibilitychange", function(){
    if (!document.hidden) checkForUpdate();
  });
  var attached = attachSync();
  // Dev-only: skip the auth gate on localhost (never runs on the real domain).
  if ((location.hostname === "localhost" || location.hostname === "127.0.0.1") &&
      location.search.indexOf("dev=1") > -1) {
    /* The whole app lives inside one strict-mode closure, which is good for
       the global namespace and terrible for testing: nothing inside could be
       exercised from outside, so the scheduler and the daily plan had no way
       to be checked and quietly shipped broken. Same localhost + ?dev=1 gate
       as the auth bypass, so it never exists on the real domain. */
    window.__MP__ = {
      get S(){ return S; }, set S(v){ S = v; },
      get SES(){ return SES; }, set SES(v){ SES = v; },
      CARDS: CARDS, BY_ID: BY_ID,
      grade: grade, practiceGrade: practiceGrade, studyBeat: studyBeat,
      act: act, sinceAct: sinceAct, dayNo: dayNo, todayPlan: todayPlan,
      dueList: dueList, deckProgress: deckProgress, fsrsApply: fsrsApply,
      diffPair: diffPair, freshState: freshState, save: save, go: go,
    };
    openStartScreen(); return;
  }
  if (attached && window.MilSync.gate) window.MilSync.gate();
  else renderHome();   // fallback if the account layer failed to load
}

})();
</script>

/* Register the service worker so the app works offline and is installable. */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function (err) {
      console.warn("Service worker registration failed:", err);
    });
  });
}
</script>
