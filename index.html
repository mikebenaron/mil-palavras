    '<div class="menu mt">' +
      '<button class="row" data-deck="__random"><span class="body"><span class="lab">Random mix</span>' +
      '<span class="sub">anything at all, in no particular order</span></span><span class="tail num">' + CARDS.length + '</span>' +
      '<svg class="tail" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#B4BDC8" stroke-width="1.8"><path d="M6 3l5 5-5 5"/></svg></button>' +
      '<button class="row" data-deck="__started"><span class="body"><span class="lab">Words I\'ve started</span>' +
      '<span class="sub">everything already in rotation</span></span><span class="tail num">' + Object.keys(S.prog).length + '</span>' +
      '<svg class="tail" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#B4BDC8" stroke-width="1.8"><path d="M6 3l5 5-5 5"/></svg></button>' +
      '<button class="row" data-deck="__weak"><span class="body"><span class="lab">Trouble words</span>' +
      '<span class="sub">the ones you keep missing</span></span><span class="tail num">' +
      CARDS.filter(function(c){ return (S.prog[c.i]||{}).l >= 3; }).length + '</span>' +
      '<svg class="tail" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#B4BDC8" stroke-width="1.8"><path d="M6 3l5 5-5 5"/></svg></button>' +
      '<button class="row" data-deck="__all"><span class="body"><span class="lab">Everything</span>' +
      '<span class="sub">words, conjugations and grammar</span></span><span class="tail num">' + CARDS.length + '</span>' +
      '<svg class="tail" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#B4BDC8" stroke-width="1.8"><path d="M6 3l5 5-5 5"/></svg></button>' +
      rows +
    '</div>');
  bindNav();
  on("[data-deck]", "click", function(e){
    var d = e.currentTarget.getAttribute("data-deck"), pool, rnd = false;
    if (d === "__all") pool = CARDS.slice();
    else if (d === "__random") { pool = CARDS.slice(); rnd = true; }
    else if (d === "__started") pool = CARDS.filter(function(c){ return S.prog[c.i]; });
    else if (d === "__weak") pool = CARDS.filter(function(c){ return (S.prog[c.i]||{}).l >= 3; });
    else pool = CARDS.filter(function(c){ return c.c === d; });
    /* every other set keeps frequency order in flip mode; the random mix
       shuffles first, so it draws from the whole deck rather than the top of it */
    if (rnd) pool = shuffle(pool.slice()).slice(0, mode === "flash" ? 40 : 25);
    else if (mode === "type" || mode === "choice") pool = shuffle(pool.slice()).slice(0, 30);
    else pool = pool.slice(0, 60);
    if (!pool.length) { toast("Nothing in that set yet"); return; }
    startSession(mode, pool);
  });
}
function genderPool(){
  var p = CARDS.filter(function(c){ return c.c === "substantivo" && (c.g === "o" || c.g === "a"); });
  return shuffle(p).slice(0, 25);
}

/* ============================ review session ============================ */
function startReview(){
  rollDay();
  var due = shuffle(dueList());
  var fresh = newPool().slice(0, newAllowance());
  if (!due.length && !fresh.length) return renderEmpty();
  // interleave: spread the new cards evenly through the due pile
  var q = due.slice();
  if (fresh.length) {
    if (!q.length) q = fresh.slice();
    else {
      var step = Math.max(1, Math.floor(q.length / fresh.length));
      for (var i = 0; i < fresh.length; i++) {
        var at = Math.min(q.length, i * (step + 1) + 1);
        q.splice(at, 0, fresh[i]);
      }
    }
  }
  startSession("review", q);
}
function renderEmpty(){
  var next = null, t = dayNo();
  for (var k in S.prog) { var d = S.prog[k].d; if (d > t && (next === null || d < next)) next = d; }
  var msg = Object.keys(S.prog).length === 0
    ? "Nothing scheduled yet. Start a review and the first words will come in."
    : (next ? "Next batch lands in " + (next - t) + (next - t === 1 ? " day" : " days") +
        ". You can still drill any set from the menu." 
      : "Nothing left in rotation.");
  h(backBar("Home") +
    '<div class="done"><div class="mark">✦</div><h2>Reviews clear</h2><p>' + esc(msg) + '</p>' +
    '<button class="btn ghost" data-nav="flash">Practise anyway</button></div>');
  bindNav();
}

/* ============================ session runner ============================ */
var SES = null;
function startSession(mode, queue){
  SES = { mode:mode, q:queue.slice(), i:0, total:queue.length, right:0, wrong:0, shown:false, answered:false, done:0 };
  renderSession();
}
function sessionDir(c){
  if (SES.mode === "type") return "en";
  if (SES.mode === "gender") return "pt";
  if (c && c.k) return "en";        /* a drill always runs prompt → answer */
  var d = S.set.dir;
  if (d === "mix") return Math.random() < 0.5 ? "pt" : "en";
  return d;
}
function renderSession(){
  if (!SES || SES.i >= SES.q.length) return renderSummary();
  var c = SES.q[SES.i];
  SES.dir = SES.dir_locked || sessionDir(c);
  var pct = SES.total ? Math.round(SES.done / SES.total * 100) : 0;

  var head =
    '<div class="top" style="margin-bottom:10px"><button class="back" data-end="1">' +
    '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4l8 8M12 4l-8 8"/></svg>' +
    'End</button><div class="eyebrow" style="padding-top:9px">' + esc(MODE_TITLE[SES.mode]) + '</div></div>' +
    '<div class="progress"><i style="width:' + pct + '%"></i></div>' +
    '<div class="meta"><span class="num">' + SES.done + ' / ' + SES.total + '</span>' +
    '<span class="num">' + (SES.right) + ' right</span></div>';

  if (SES.mode === "choice") return renderChoice(head, c);
  if (SES.mode === "type") return renderType(head, c);
  if (SES.mode === "gender") return renderGender(head, c);
  return renderFlip(head, c);
}

/* ---- flip (review + flashcards) ---- */
function renderFlip(head, c){
  var dir = SES.dir;
  var front = dir === "pt" ? variants(c.p)[0] : c.e;
  var back  = dir === "pt" ? c.e : c.p;
  if (c.k) { front = c.q; back = c.p; }
  var isNew = !S.prog[c.i];
  var frontCls = dir === "pt" ? "word" : "word en";
  var backCls  = dir === "pt" ? "word en" : "word";
  var sub = c.s ? '<div class="word-sub">' + esc(c.s) + '</div>' : "";
  var klass = c.k ? c.s : CLASS_LABEL[c.c];
  var cap = c.k ? '<div class="word-sub">' + esc(c.qs) + '</div>' : "";

  var grades = SES.mode === "review"
    ? '<div class="grade">' +
        gbtn(1,"Again","again",c.i) + gbtn(2,"Hard","hard",c.i) +
        gbtn(3,"Good","good",c.i) + gbtn(4,"Easy","easy",c.i) +
      '</div>'
    : '<div class="grade" style="grid-template-columns:1fr 1fr"><button class="g again" data-adv="1"><b>Still learning</b></button>' +
      '<button class="g good" data-adv="1"><b>Got it</b></button></div>';

  var tips = SES.shown ? tipsFor(c) : "";
  h(head + '<div class="sess">' +
    '<div class="cardwrap' + (tips ? " sm" : "") + '">' +
    '<div class="flipper' + (SES.shown ? " flip" : "") + '" id="cd">' +
      '<div class="face tile">' + tileFrame() +
        '<div class="klass">' + esc(klass) + (isNew ? " · new" : "") + '</div>' +
        '<div><div class="' + frontCls + '">' + esc(front) + '</div>' + (c.k ? cap : (dir === "pt" ? sub : "")) + '</div>' +
        '<div class="tap-hint">tap to reveal</div>' +
      '</div>' +
      '<div class="face b tile">' + tileFrame() +
        '<div class="klass">' + esc(klass) + '</div>' +
        '<div><div class="' + backCls + '">' + esc(back) + '</div>' + (c.k ? cap : sub) + '</div>' +
        '<div class="tap-hint"></div>' +
      '</div>' +
    '</div>' + sayBtn(c.p) + '</div>' + tips +
    '<div class="ctl">' +
    (SES.shown ? grades : '<button class="btn" data-show="1">Show answer</button>') +
    '</div></div>');

  var cd = document.getElementById("cd");
  function reveal(){
    if (SES.shown) return;
    SES.shown = true;
    autoSay(c.p);
    if (cd) cd.classList.add("flip");
    setTimeout(renderSession, motionOK() ? 300 : 0);
  }
  cd.addEventListener("click", reveal);
  on("[data-show]","click", reveal);
  bindSay();
  on("[data-grade]","click",function(e){
    var g = +e.currentTarget.getAttribute("data-grade");
    applyGrade(c, g);
  });
  on("[data-adv]","click",function(){ SES.done++; SES.i++; SES.shown = false; renderSession(); });
  bindEnd();
}
function gbtn(g, lab, cls, id){
  return '<button class="g ' + cls + '" data-grade="' + g + '"><b>' + lab + '</b><s>' + previewIv(id, g) + '</s></button>';
}
function applyGrade(c, g){
  grade(c.i, g);
  if (g === 1) {
    SES.wrong++;
    // requeue a few cards later so it comes back inside this session
    var at = Math.min(SES.q.length, SES.i + 1 + Math.floor(Math.random()*4) + 4);
    SES.q.splice(at, 0, c);
  } else { SES.right++; }
  SES.done++; SES.i++; SES.shown = false;
  renderSession();
}

/* ---- multiple choice ---- */
function renderChoice(head, c){
  if (!SES.opts) {
    if (c.k && c.x && c.x.length) {
      /* a drill carries its own distractors: the other cells of its table,
         or the other persons of the same verb — far more useful than random */
      var d = shuffle(c.x.slice()).slice(0,3).map(function(t, n){
        return { i:"x" + n, p:t, e:t, c:c.c, k:1 };
      });
      SES.opts = shuffle([c].concat(d));
    } else {
      var same = CARDS.filter(function(x){ return x.c === c.c && x.i !== c.i && !x.k; });
      var pool = same.length >= 3 ? same : CARDS.filter(function(x){ return x.i !== c.i && !x.k; });
      var d2 = shuffle(pool.slice()).slice(0,3);
      SES.opts = shuffle([c].concat(d2));
    }
  }
  var dir = SES.dir;
  var prompt = dir === "pt" ? variants(c.p)[0] : c.e;
  if (c.k) prompt = c.q;
  var opts = SES.opts.map(function(o){
    var txt = dir === "pt" ? o.e : variants(o.p)[0];
    var cls = "ch" + (dir === "pt" ? "" : " ");
    var state = "";
    if (SES.answered) {
      if (o.i === c.i) state = " right";
      else if (o.i === SES.chosen) state = " wrong";
      else state = " dim";
    }
    return '<button class="ch' + state + '" data-opt="' + o.i + '"' + (SES.answered ? " disabled" : "") + '>' +
      (dir === "pt" ? esc(txt) : '<span class="pt">' + esc(txt) + '</span>') + '</button>';
  }).join("");

  h(head + '<div class="sess">' +
    '<div class="tile prompt">' + tileFrame() +
      '<div class="klass">' + esc(c.k ? c.s : CLASS_LABEL[c.c]) + '</div>' +
      '<div><div class="' + (dir === "pt" ? "word" : "word en") + '">' + esc(prompt) + '</div>' +
      (c.k ? '<div class="word-sub">' + esc(c.qs) + '</div>' : "") + '</div>' +
      (SES.answered || dir === "pt" ? sayBtn(c.p) : "") +
    '</div>' +
    '<div class="choices">' + opts + '</div>' +
    (SES.answered ? tipsFor(c) : "") +
    '<div class="ctl">' +
    (SES.answered ? '<button class="btn" data-next="1">Next</button>' : '') +
    '</div></div>');

  on("[data-opt]","click",function(e){
    if (SES.answered) return;
    SES.chosen = +e.currentTarget.getAttribute("data-opt");
    SES.answered = true;
    autoSay(c.p);
    if (SES.chosen === c.i) SES.right++; else SES.wrong++;
    SES.done++; markStudied(); save();
    renderSession();
  });
  on("[data-next]","click",function(){ nextQ(); });
  bindSay(); bindEnd();
}
function nextQ(){ SES.opts = null; SES.answered = false; SES.chosen = null; SES.i++; SES.shown = false; renderSession(); }

/* ---- type it ---- */
var ACCENTS = ["á","à","â","ã","ç","é","ê","í","ó","ô","õ","ú"];
function renderType(head, c){
  var accents = ACCENTS.map(function(a){ return '<button data-acc="' + a + '">' + a + '</button>'; }).join("");
  var v = SES.verdict;
  h(head + '<div class="sess">' +
    '<div class="tile prompt">' + tileFrame() +
      '<div class="klass">' + esc(c.k ? c.s : CLASS_LABEL[c.c]) + '</div>' +
      '<div><div class="word en">' + esc(c.k ? c.q : c.e) + '</div>' +
      (c.k ? '<div class="word-sub">' + esc(c.qs) + '</div>' : "") + '</div>' +
      (v ? sayBtn(c.p) : "") +
    '</div>' +
    '<input class="answer" id="ans" autocapitalize="none" autocorrect="off" spellcheck="false" ' +
      'autocomplete="off" placeholder="em português…"' + (v ? " disabled" : "") +
      ' value="' + esc(SES.typed || "") + '">' +
    (v ? "" : '<div class="accents">' + accents + '</div>') +
    (v ? '<div class="verdict ' + v.k + '">' + v.msg + '<b>' + esc(c.p) + '</b></div>' : "") +
    (v ? tipsFor(c) : "") +
    '<div class="ctl">' +
    (v ? '<button class="btn" data-next="1">Next</button>'
       : '<button class="btn" data-check="1">Check</button>') +
    '</div></div>');

  var input = document.getElementById("ans");
  if (!v) { input.focus(); }
  input.addEventListener("keydown", function(e){ if (e.key === "Enter") { e.preventDefault(); check(); } });
  on("[data-acc]","click",function(e){
    var a = e.currentTarget.getAttribute("data-acc");
    var s = input.selectionStart || input.value.length;
    input.value = input.value.slice(0,s) + a + input.value.slice(input.selectionEnd || s);
    input.focus(); input.setSelectionRange(s+1, s+1);
  });
  on("[data-check]","click",check);
  on("[data-next]","click",function(){ SES.verdict = null; SES.typed = ""; nextQ(); });
  bindSay(); bindEnd();

  function check(){
    var raw = input.value;
    if (!raw.trim()) return;
    SES.typed = raw;
    var accepted = c.a ? c.a.slice() : variants(c.p);
    accepted = accepted.concat(accepted.map(function(z){ return z.replace(/^-/, ""); }));
    var exact = accepted.some(function(a){ return keepAccents(a) === keepAccents(raw); });
    var loose = accepted.some(function(a){ return norm(a) === norm(raw); });
    var noArt = accepted.some(function(a){ return norm(stripArticle(a)) === norm(raw); });
    if (exact) { SES.verdict = { k:"ok", msg:"Exactly right." }; SES.right++; }
    else if (loose) { SES.verdict = { k:"near", msg:"Right word — the accents are off." }; SES.right++; }
    else if (noArt) { SES.verdict = { k:"near", msg:"Right noun, but it needs its article — gender is part of the word." }; SES.right++; }
    else { SES.verdict = { k:"no", msg:"Not quite." }; SES.wrong++; }
    SES.done++; markStudied(); save();
    autoSay(c.p);
    renderSession();
  }
}

/* ---- gender drill ---- */
function renderGender(head, c){
  var bare = c.b || stripArticle(c.p);
  var ans = SES.chosen;
  h(head + '<div class="sess">' +
    '<div class="tile prompt">' + tileFrame() +
      '<div class="klass">substantivo</div>' +
      '<div><div class="word">' + esc(bare) + '</div>' +
      (ans ? '<div class="word-sub">' + esc(c.e) + '</div>' : '') + '</div>' +
      (ans ? sayBtn(c.p) : "") +
    '</div>' +
    '<div class="oa">' +
      oab("o", c.g, ans) + oab("a", c.g, ans) +
    '</div>' +
    (ans ? tipsFor(c) : "") +
    '<div class="ctl">' +
    (ans ? '<button class="btn" data-next="1">Next</button>' : '') +
    '</div></div>');
  on("[data-oa]","click",function(e){
    if (SES.chosen) return;
    SES.chosen = e.currentTarget.getAttribute("data-oa");
    if (SES.chosen === c.g) SES.right++; else SES.wrong++;
    SES.done++; markStudied(); save();
    autoSay(c.p);
    renderSession();
  });
  on("[data-next]","click",function(){ SES.chosen = null; nextQ(); });
  bindSay(); bindEnd();
}
function oab(letter, correct, chosen){
  var cls = "";
  if (chosen) {
    if (letter === correct) cls = " right";
    else if (letter === chosen) cls = " wrong";
  }
  return '<button class="' + cls.trim() + '" data-oa="' + letter + '">' + letter + '</button>';
}

function bindEnd(){ on("[data-end]","click",function(){ SES = null; renderHome(); }); }

/* ---- summary ---- */
function renderSummary(){
  var s = SES || { right:0, wrong:0, total:0, mode:"review" };
  var total = s.right + s.wrong;
  var pctv = total ? Math.round(s.right / total * 100) : 0;
  var line;
  if (s.mode === "review") line = "Scheduled. Come back tomorrow and the ones you wobbled on will be waiting first.";
  else if (pctv >= 90) line = "That set is close to done. Try a harder one, or switch the direction to English → Portuguese.";
  else if (pctv >= 60) line = "Solid. The misses are the useful part — they'll come round again sooner.";
  else line = "A rough round, which means you picked the right set. Run it again.";
  SES = null;
  h(backBar("Home") +
    '<div class="done"><div class="mark">✦</div>' +
    '<h2>' + (total ? pctv + "% right" : "Session ended") + '</h2>' +
    '<p>' + esc(line) + '</p>' +
    '<div class="stats" style="max-width:320px;margin:0 auto 20px">' +
      '<div class="stat"><b class="num">' + s.right + '</b><span>right</span></div>' +
      '<div class="stat"><b class="num" style="color:var(--vinho)">' + s.wrong + '</b><span>missed</span></div>' +
      '<div class="stat warm"><b class="num">' + (S.streak||0) + '</b><span>streak</span></div>' +
    '</div>' +
    '<button class="btn" data-nav="review">Keep going</button>' +
    '<div style="height:9px"></div><button class="btn quiet" data-nav="home">Done for now</button></div>');
  bindNav();
}

/* ============================ browse ============================ */
var bq = "", bfilter = "all";
function renderBrowse(){
  var chips = ['<button class="chip' + (bfilter === "all" ? " on" : "") + '" data-f="all">All</button>']
    .concat(CLASS_ORDER.map(function(k){
      return '<button class="chip' + (bfilter === k ? " on" : "") + '" data-f="' + k + '">' + esc(CLASS_EN[k]) + '</button>';
    })).join("");
  var q = norm(bq);
  var list = CARDS.filter(function(c){
    if (bfilter !== "all" && c.c !== bfilter) return false;
    if (!q) return true;
    return norm(c.p).indexOf(q) >= 0 || norm(c.e).indexOf(q) >= 0;
  });
  var shown = list.slice(0, 300);
  var body = shown.map(function(c){
    var p = S.prog[c.i];
    var d = !p ? "n" : (leech(c.i) ? "l" : (known(c.i) ? "k" : "n"));
    var dotTitle = !p ? "not started" : (leech(c.i) ? "trouble word" : (known(c.i) ? "settled in" : "in rotation"));
    return '<button class="entry"' + (Speech.supported() ? ' data-say="' + esc(c.p) + '"' : '') + '>' +
      '<span class="dot ' + d + '" title="' + dotTitle + '"></span>' +
      '<span class="p">' + esc(c.p) + '</span><span class="e">' + esc(c.e) + '</span></button>';
  }).join("");
  h(backBar("Home") +
    '<h1 style="margin-bottom:12px">Browse</h1>' +
    '<input class="search" id="q" placeholder="Search Portuguese or English" value="' + esc(bq) + '" ' +
      'autocapitalize="none" autocorrect="off" spellcheck="false">' +
    '<div class="chips">' + chips + '</div>' +
    '<div class="eyebrow" style="margin-bottom:8px">' + list.length + ' word' + (list.length === 1 ? "" : "s") +
      (list.length > 300 ? " · showing first 300" : "") + '</div>' +
    (body || '<p style="color:var(--slate);font-size:14px;padding:22px 0">No match. Try fewer letters, or search the English side.</p>'));
  var qi = document.getElementById("q");
  qi.addEventListener("input", function(){
    bq = qi.value; var pos = qi.selectionStart;
    renderBrowse();
    var n = document.getElementById("q"); n.focus(); n.setSelectionRange(pos,pos);
  });
  on("[data-f]","click",function(e){ bfilter = e.currentTarget.getAttribute("data-f"); renderBrowse(); });
  bindSay(); bindNav();
}

/* ============================ grammar ============================ */
function renderGrammar(){
  var body = DATA.grammar.map(function(g){
    var tables = g.tables.map(function(t){
      return '<table><thead><tr>' + t.cols.map(function(c){ return '<th>' + c + '</th>'; }).join("") +
        '</tr></thead><tbody>' + t.rows.map(function(r){
          return '<tr>' + r.map(function(cell){ return '<td>' + cell + '</td>'; }).join("") + '</tr>';
        }).join("") + '</tbody></table>';
    }).join("");
    var notes = (g.notes||[]).map(function(n){ return '<div class="gnote">' + n + '</div>'; }).join("");
    var n = grammarDrillPool(g.id).length;
    var btn = n ? '<button class="btn ghost" style="margin-top:12px" data-gd="' + esc(g.id) + '">' +
      'Drill this — ' + n + ' cards</button>' : "";
    return '<div class="gcard"><div class="eyebrow">' + esc(g.title) + '</div>' +
      '<p style="font-size:14px;color:#4A5A6E;line-height:1.55">' + g.intro + '</p>' + tables + notes + btn + '</div>';
  }).join("");
  var pron = '<div class="gcard"><div class="eyebrow">Sounds worth knowing</div>' +
    '<p style="font-size:14px;color:#4A5A6E;line-height:1.55">European Portuguese eats its vowels — this is why it looks like Spanish on the page and sounds nothing like it. A few rules explain most of the gap.</p>' +
    '<ul class="plist">' + DATA.pron.map(function(p){
      return '<li><b>' + p[0] + '</b><span>' + p[1] + '</span></li>';
    }).join("") + '</ul></div>';
  h(backBar("Home") +
    '<h1 style="margin-bottom:6px">Grammar</h1>' +
    '<p style="color:var(--slate);font-size:13.5px;margin-bottom:16px">Every table below is also a deck. ' +
    'Reading these once does very little — tap <em>Drill this</em> and be tested on them instead.</p>' +
    body + pron);
  on("[data-gd]","click",function(e){
    var pool = grammarDrillPool(e.currentTarget.getAttribute("data-gd"));
    startDrill(pool);
  });
  bindNav();
}

/* ============================ method ============================ */
function renderMethod(){
  var body = DATA.method.map(function(m){
    return '<div class="gcard"><h2 style="font-size:18px;margin-bottom:7px">' + esc(m[0]) + '</h2>' +
      '<p style="font-size:14px;color:#4A5A6E;line-height:1.6;margin:0">' + esc(m[1]) + '</p></div>';
  }).join("");
  h(backBar("Home") +
    '<div class="eyebrow">Method</div><h1 style="margin-bottom:6px">Making it stick</h1>' +
    '<p style="color:var(--slate);font-size:13.5px;margin-bottom:18px">Everything below is doing work in the background. Worth two minutes.</p>' +
    body);
  bindNav();
}

/* ============================ settings ============================ */
function renderSettings(){
  var d = S.set.dir;
  var toggles = CLASS_ORDER.map(function(k){
    var n = CARDS.filter(function(c){ return c.c === k; }).length;
    var on_ = S.set.classes[k];
    return '<button class="row' + (on_ ? "" : " off") + '" data-cls="' + k + '">' +
      '<span class="glyph">' + (on_ ?
        '<svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2"><path d="M3.5 9.5l3.5 3.5 7.5-8"/></svg>' :
        '<svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#B4BDC8" stroke-width="1.5"><circle cx="9" cy="9" r="6.5"/></svg>') +
      '</span><span class="body"><span class="lab">' + esc(CLASS_EN[k]) + '</span>' +
      '<span class="sub">' + esc(CLASS_LABEL[k]) + '</span></span><span class="tail num">' + n + '</span></button>';
  }).join("");

  var storeNote = Store.mode() === "app" ? "Saved in this Claude conversation."
    : Store.mode() === "local" ? "Saved in this browser on this device."
    : "This browser is blocking storage, so progress lasts only until you close the page. Export it below before you go.";

  h(backBar("Home") + '<h1 style="margin-bottom:14px">Settings</h1>' +

    '<div class="field"><div class="lab">New words a day</div>' +
    '<div class="hint">How many unseen words enter rotation each day. Settled in, expect roughly ten reviews a day for every one new word you let in.</div>' +
    '<div class="stepper"><button data-per="-5">−</button><b class="num" id="per">' + S.set.perDay + '</b>' +
    '<button data-per="5">+</button></div></div>' +

    '<div class="field"><div class="lab">Which way round</div>' +
    '<div class="hint">Portuguese → English builds reading. English → Portuguese builds speaking, and is much harder.</div>' +
    '<div class="seg">' +
      '<button class="' + (d==="pt"?"on":"") + '" data-dir="pt">PT → EN</button>' +
      '<button class="' + (d==="en"?"on":"") + '" data-dir="en">EN → PT</button>' +
      '<button class="' + (d==="mix"?"on":"") + '" data-dir="mix">Mixed</button>' +
    '</div></div>' +

    '<div class="field"><div class="lab">Tips on reveal</div>' +
    '<div class="hint">Conjugations, gender and plural rules, example sentences, and warnings about the words that catch people out.</div>' +
    '<div class="seg">' +
      '<button class="' + (S.set.tips !== false ? "on" : "") + '" data-tips="1">Show</button>' +
      '<button class="' + (S.set.tips === false ? "on" : "") + '" data-tips="0">Hide</button>' +
    '</div></div>' +

    '<h3>Audio</h3>' +
    '<div class="hint" id="voiceline" style="font-size:11.5px;color:var(--slate);line-height:1.5">' + voiceLine() + '</div>' +
    '<div class="field" style="border-top:1px solid rgba(16,36,63,.09);margin-top:12px">' +
    '<div class="lab">Speak on reveal</div>' +
    '<div class="hint">Plays the Portuguese automatically the moment an answer is shown. Tap the speaker on any card to replay it.</div>' +
    '<div class="seg">' +
      '<button class="' + (S.set.audio !== false ? "on" : "") + '" data-audio="1">On</button>' +
      '<button class="' + (S.set.audio === false ? "on" : "") + '" data-audio="0">Off</button>' +
    '</div></div>' +
    '<div class="field"><div class="lab">Speaking speed</div>' +
    '<div class="hint">European Portuguese runs fast and swallows its vowels. Start slow and move up as your ear catches on.</div>' +
    '<div class="seg">' +
      '<button class="' + (S.set.rate === "slow" ? "on" : "") + '" data-rate="slow">Slow</button>' +
      '<button class="' + (S.set.rate === "steady" || !S.set.rate ? "on" : "") + '" data-rate="steady">Steady</button>' +
      '<button class="' + (S.set.rate === "natural" ? "on" : "") + '" data-rate="natural">Natural</button>' +
    '</div>' +
    (Speech.supported() ? '<button class="btn ghost" style="margin-top:11px" data-say="Bom dia! Isto é português europeu.">Hear a sample</button>' : '') +
    '</div>' +

    '<h3>Word classes in rotation</h3>' +
    '<div class="hint" style="font-size:11.5px;color:var(--slate);margin-bottom:6px">Turn a class off and nothing new from it will be introduced. Anything already in rotation keeps coming back. <em>Verb conjugation</em> and <em>Grammar drills</em> are generated sets — switch them off here if you would rather keep Review to vocabulary only.</div>' +
    '<div class="menu">' + toggles + '</div>' +

    '<h3>Account</h3>' +
    '<div id="syncMount"></div>' +

    '<h3>Progress</h3>' +
    '<div class="hint" style="font-size:11.5px;color:var(--slate)">' + esc(storeNote) + '</div>' +
    '<div class="stack mt">' +
      '<button class="btn quiet" data-act="export">Copy progress as text</button>' +
      '<button class="btn quiet" data-act="import">Paste progress back in</button>' +
      '<button class="btn quiet" data-act="resetleech">Reset trouble words</button>' +
      '<button class="btn quiet" style="color:var(--vinho)" data-act="wipe">Erase all progress</button>' +
    '</div>' +
    '<div id="io"></div>' +

    '<div class="foot"><b class="num">' + (S.reviews||0) + '</b> cards graded · <b class="num">' +
    Object.keys(S.prog).length + '</b> of ' + CARDS.length + ' cards started · best streak <b class="num">' +
    (S.best||0) + '</b> days</div>');

  on("[data-per]","click",function(e){
    var dlt = +e.currentTarget.getAttribute("data-per");
    S.set.perDay = Math.max(5, Math.min(60, S.set.perDay + dlt)); save(); renderSettings();
  });
  on("[data-dir]","click",function(e){ S.set.dir = e.currentTarget.getAttribute("data-dir"); save(); renderSettings(); });
  on("[data-tips]","click",function(e){ S.set.tips = e.currentTarget.getAttribute("data-tips") === "1"; save(); renderSettings(); });
  on("[data-audio]","click",function(e){ S.set.audio = e.currentTarget.getAttribute("data-audio") === "1"; save(); renderSettings(); });
  on("[data-rate]","click",function(e){
    S.set.rate = e.currentTarget.getAttribute("data-rate"); save(); renderSettings();
    Speech.speak("Bom dia! Isto é português europeu.", null);
  });
  bindSay();
  on("[data-cls]","click",function(e){
    var k = e.currentTarget.getAttribute("data-cls");
    var on_ = CLASS_ORDER.filter(function(x){ return S.set.classes[x]; });
    if (on_.length === 1 && S.set.classes[k]) { toast("Keep at least one class on"); return; }
    S.set.classes[k] = !S.set.classes[k]; save(); renderSettings();
  });
  on("[data-act]","click",function(e){
    var a = e.currentTarget.getAttribute("data-act");
    var io = document.getElementById("io");
    if (a === "export") {
      io.innerHTML = '<textarea readonly id="ta">' + esc(JSON.stringify(S)) + '</textarea>' +
        '<button class="btn ghost" style="margin-top:8px" data-copy="1">Copy to clipboard</button>';
      var ta = document.getElementById("ta"); ta.select();
      io.querySelector("[data-copy]").addEventListener("click", function(){
        ta.select(); ta.setSelectionRange(0, 999999);
        try { document.execCommand("copy"); toast("Copied"); } catch(err){ toast("Select and copy manually"); }
      });
    } else if (a === "import") {
      io.innerHTML = '<textarea id="ta" placeholder="Paste the exported text here"></textarea>' +
        '<button class="btn ghost" style="margin-top:8px" data-load="1">Load it</button>';
      io.querySelector("[data-load]").addEventListener("click", function(){
        var v = safeParse(document.getElementById("ta").value);
        if (!v || !v.prog) { toast("That doesn't look like a progress file"); return; }
        S = v; if (!S.set) S.set = freshState().set; save(); toast("Progress loaded"); renderSettings();
      });
    } else if (a === "resetleech") {
      var n = 0, t = dayNo();
      for (var k in S.prog) { if ((S.prog[k].l||0) >= 6) { S.prog[k] = { r:0, e:2.5, iv:0, d:t, l:0 }; n++; } }
      save(); toast(n ? n + " words reset" : "No trouble words yet"); renderSettings();
    } else if (a === "wipe") {
      if (io.getAttribute("data-armed")) { S = freshState(); save(); toast("Progress erased"); renderHome(); return; }
      io.setAttribute("data-armed","1");
      io.innerHTML = '<div class="verdict no" style="margin-top:12px">This clears every schedule, streak and grade. Tap <em>Erase all progress</em> once more to confirm.</div>';
    }
  });
  bindNav();
  if (window.MilSync) window.MilSync.mount();
}

/* ============================ keyboard ============================ */
document.addEventListener("keydown", function(e){
  if (!SES) return;
  var tag = (e.target.tagName||"").toLowerCase();
  if (tag === "input" || tag === "textarea") return;
  if (e.code === "Space") { e.preventDefault();
    var b = app.querySelector("[data-show]") || app.querySelector("[data-next]");
    if (b) b.click(); else { var cd = document.getElementById("cd"); if (cd) cd.click(); }
    return; }
  if (/^[1-4]$/.test(e.key)) {
    var g = app.querySelector('[data-grade="' + e.key + '"]');
    if (g) g.click();
  }
});

/* ============================ boot ============================ */
Store.init().then(function(saved){
  S = saved && saved.prog ? saved : freshState();
  if (!S.set) S.set = freshState().set;
  if (!S.set.classes) S.set.classes = freshState().set.classes;
  if (S.set.tips === undefined) S.set.tips = true;
  if (S.set.audio === undefined) S.set.audio = true;
  if (!S.set.rate) S.set.rate = "steady";
  CLASS_ORDER.forEach(function(k){ if (S.set.classes[k] === undefined) S.set.classes[k] = true; });
  rollDay();
  startApp();
}).catch(function(){
  S = freshState();
  startApp();
});

/* Hand the account/sync layer a bridge to the app's private state, then let it
   decide whether to show the login screen or enter the app (account-first). */
function attachSync(){
  if (!window.MilSync) return false;
  window.MilSync.attach({
    get: function(){ return S; },
    set: function(ns){
      S = ns;
      if (!S.set) S.set = freshState().set;
      CLASS_ORDER.forEach(function(k){ if (S.set.classes[k] === undefined) S.set.classes[k] = true; });
    },
    persist: function(){ Store.save(S); },   // raw save: no timestamp bump, no re-push
    save: save,
    render: function(){ renderHome(); },
    freshState: freshState
  });
  return true;
}
function startApp(){
  var attached = attachSync();
  // Local-only preview bypass (can never trigger on the real domain).
  if ((location.hostname === "localhost" || location.hostname === "127.0.0.1") &&
      location.search.indexOf("dev=1") > -1) { renderHome(); return; }
  if (attached && window.MilSync.gate) window.MilSync.gate();
  else renderHome();   // fallback if the account layer failed to load
}

})();
</script>
<script>
/* Register the service worker so the app works offline and is installable. */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function (err) {
      console.warn("Service worker registration failed:", err);
    });
  });
}
</script>
</body>
